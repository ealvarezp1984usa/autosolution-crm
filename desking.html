body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}

button{cursor:pointer;font-family:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

header{position:sticky;top:0;z-index:50;background:#070707;border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:900;letter-spacing:.5px;font-size:16px}.logo b{color:var(--p)}
.sub{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em}

.tabs{position:sticky;top:49px;z-index:49;display:flex;background:#0b0b0b;border-bottom:1px solid var(--bd);overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:90px;padding:11px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--tx3);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--p);border-bottom-color:var(--p)}

main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.f label{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:4px}
.f input,.f select{width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid var(--bd);background:var(--bg3);color:var(--tx);outline:none}

function cargarLibro(){

function vincular(kind,id){
  const p=personas().find(x=>x.kind===kind&&x.id===id); if(!p)return;

    W.tipo=d.tipo==='Lease'?'lease':d.tipo==='Contado'?'cash':'finance';

  render();
}

/* ═══ CÁLCULO ═══ */
function calc(){
  const precio=num(W.precio), msrp=num(W.msrp)||precio;
  const fees=num(W.docFee)+num(W.tagFee)+num(W.otros);
  const allow=num(W.tradeAllow), payoff=num(W.tradePayoff), equity=allow-payoff;
  const rebates=num(W.rebates), down=num(W.down), taxR=num(W.taxPct)/100;
  if(W.tipo==='finance'||W.tipo==='cash'){
    /* FL: el trade-in allowance reduce la base imponible */
    const taxBase=Math.max(0,precio-allow);
    const tax=taxBase*taxR;
    const otd=precio+fees+tax-rebates;
    const financiar=Math.max(0,otd-equity-down);
    let pago=0;
    if(W.tipo==='finance'){
      const r=num(W.apr)/100/12, n=num(W.plazoF)||60;
      pago=r>0?financiar*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1):financiar/n;
    }
    return {precio,msrp,fees,tax,otd,financiar,pago,equity,down,rebates,allow,payoff,
      alFirmar:W.tipo==='cash'?Math.max(0,otd-equity):down};
  }
  /* LEASE */
  const residual=msrp*num(W.residPct)/100;
  const capRed=down+Math.max(0,equity)+rebates;
  const capCost=precio+num(W.acqFee)-capRed+Math.max(0,-equity); /* equity negativo se capitaliza */
  const n=num(W.plazoL)||36, mf=num(W.mf);
  const dep=(capCost-residual)/n;
  const renta=(capCost+residual)*mf;
  const base=dep+renta;
  const pago=base*(1+taxR); /* FL cobra tax sobre cada pago */
  const alFirmar=pago+down+fees; /* primer pago + down + fees al firmar */
  return {precio,msrp,fees,residual,capCost,pago,base,alFirmar,down,rebates,equity,allow,payoff,
    aprEq:(mf*2400)};
}

function quoteText(){
  const c=calc(), veh=[W.ano,W.marca,W.modelo].filter(Boolean).join(' ');
  const firma=S.cfg.vendedor?` — ${S.cfg.vendedor}, AutoSolution Miami`:' — AutoSolution Miami';
  if(W.tipo==='lease')
    return `🚗 ${veh} (${W.cond})\n`+
      `LEASE: ${fm(c.pago)}/mes CON TAX\n`+
      `${fm(c.alFirmar)} al firmar (1er pago + entrada + fees)\n`+
      `${W.plazoL} meses · ${Number(W.millas).toLocaleString()} millas/año\n`+
      `Incluye doc fee ${fm(W.docFee)} y tag ${fm(W.tagFee)} — el número COMPLETO, sin sorpresas${firma}`;
  if(W.tipo==='finance')
    return `🚗 ${veh} (${W.cond})\n`+
      `FINANCIADO: ${fm(c.pago)}/mes\n`+
      `${W.plazoF} meses · ${W.apr}% APR · ${fm(c.down)} de entrada\n`+
      `Out-the-door: ${fm(c.otd)} (precio + fees + tax, todo incluido)\n`+
      `A financiar: ${fm(c.financiar)} — el número COMPLETO, sin sorpresas${firma}`;
  return `🚗 ${veh} (${W.cond})\n`+
    `DE CONTADO — Out-the-door: ${fm(c.alFirmar)}\n`+
    `(precio + fees + tax − rebates${c.equity?` − equity del trade ${fm(c.equity)}`:''}, todo incluido)${firma}`;
}

    </div>
    ${cotDe(W.vinculo).length?`<div style="margin-bottom:12px;background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:11px 14px">
      <div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:7px">Negocios guardados de ${esc(W.vinculo.nom)} (${cotDe(W.vinculo).length})</div>
      ${cotDe(W.vinculo).slice(0,3).map(q=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)">
        <span style="flex:1;font-size:12px;color:var(--tx2)">${esc([q.w.ano,q.w.marca,q.w.modelo].filter(Boolean).join(' '))} · <b style="text-transform:uppercase;font-size:10px">${q.w.tipo}</b> · ${q.fecha}</span>
        <button class="btn sec sm" onclick="abrirCot(${q.id})">Abrir</button>
      </div>`).join('')}
    </div>`:''}`
    :`
    <div class="f" style="margin-bottom:12px;position:relative">
      <label>¿Para quién es el negocio? — busca en tu libro y leads</label>
      <input id="buscaP" placeholder="Escribe el nombre… (${personas().length} en tu CRM)" oninput="buscarP(this.value)" autocomplete="off">
      <div id="listaP"></div>
    </div>`}
    <div class="grid">
      ${F('Cliente','cliente','text','Nombre')}${F('Teléfono (WhatsApp)','tel','tel','305 000 0000')}
    </div>
    <div style="height:10px"></div>
    <div class="grid3">
      ${F('Año','ano','number','2026')}${F('Marca','marca','text','Toyota')}${F('Modelo','modelo','text','Corolla LE')}
      ${F('# Stock','stock','text','')}
      <div class="f"><label>Condición</label><select onchange="inp('cond',this.value)">
        <option ${W.cond==='Nuevo'?'selected':''}>Nuevo</option><option ${W.cond==='Usado'?'selected':''}>Usado</option><option ${W.cond==='CPO'?'selected':''}>CPO</option></select></div>
      ${F('MSRP $','msrp','number','')}
      ${F('Precio de venta $','precio','number','')}
      ${F('Rebates $','rebates','number','0')}
      ${F('Entrada / Down $','down','number','0')}
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:13px">Fees y tax <span class="pill" style="margin-left:6px">plantilla del dealer</span></h2>
    <div style="height:8px"></div>
    <div class="grid3">
      ${F('Doc fee $','docFee','number','999')}
      ${F('Tag / título $','tagFee','number','399')}
      ${F('Otros fees $','otros','number','0')}
      ${F('Tax %','taxPct','number','7','0.1')}
      ${W.tipo==='lease'?F('Acquisition fee $','acqFee','number','695'):''}
    </div>
    ${S.plantillas.length?`<div class="row" style="margin-top:10px"><span style="font-size:11px;color:var(--tx3)">Aplicar plantilla:</span>${S.plantillas.map((p,i)=>`<button class="btn sec sm" onclick="aplicarP(${i})">${esc(p.nombre)}</button>`).join('')}</div>`:''}
  </div>

  <div class="card">
    <h2 style="font-size:13px">Trade-in</h2>
    <div style="height:8px"></div>
    <div class="grid">
      ${F('Allowance (lo que ofreces) $','tradeAllow','number','0')}
      ${F('Payoff (lo que debe) $','tradePayoff','number','0')}
    </div>
  </div>

  ${W.tipo==='finance'?`<div class="card">
    <h2 style="font-size:13px">Financiamiento</h2>
    <div style="height:8px"></div>
    <div class="grid">
      ${F('APR %','apr','number','6.9','0.1')}
      <div class="f"><label>Plazo (meses)</label><select onchange="inp('plazoF',this.value)">
        ${[36,48,60,66,72,75,84].map(x=>`<option ${W.plazoF==x?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>
    <div class="hint" style="margin:8px 0 0">💡 Toca un banco en la pestaña Bancos para traer su tasa de referencia aquí.</div>
  </div>`:''}

  ${W.tipo==='lease'?`<div class="card">
    <h2 style="font-size:13px">Estructura del lease</h2>
    <div style="height:8px"></div>
    <div class="grid3">
      ${F('Residual % del MSRP','residPct','number','57','0.5')}
      ${F('Money factor','mf','number','0.0028','0.0001')}
      <div class="f"><label>Plazo (meses)</label><select onchange="inp('plazoL',this.value)">
        ${[24,27,30,33,36,39,42,48].map(x=>`<option ${W.plazoL==x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="f"><label>Millas/año</label><select onchange="inp('millas',this.value)">
        ${[7500,10000,12000,15000].map(x=>`<option ${W.millas==x?'selected':''}>${x.toLocaleString()}</option>`).join('')}</select></div>
    </div>
    <div class="hint" style="margin:8px 0 0">MF × 2400 = APR equivalente. El residual y el MF salen del programa del mes de cada marca (pestaña Programas del CRM).</div>
  </div>`:''}

  <div id="resultado"></div>

  <div class="row" style="margin:14px 0 30px">
    <button class="btn" onclick="guardarCot()">💾 Guardar cotización</button>
    <button class="btn sec" onclick="copiarCot()">📋 Copiar</button>
    <button class="btn wa" onclick="waCot()">Enviar por WhatsApp</button>
  </div>`;
}

function renderResultado(){
  const el=$('resultado');if(!el)return;
  const c=calc();
  if(!num(W.precio)){el.innerHTML='<div class="card empty">Pon el precio de venta y aquí aparece el negocio armado en vivo.</div>';return}
  let k='',d='';
  if(W.tipo==='lease'){
    k=`<div><div class="lbl">Al firmar</div><div class="v mono">${fm(c.alFirmar)}</div></div>
       <div><div class="lbl">Plazo</div><div class="v mono">${W.plazoL} m</div></div>
       <div><div class="lbl">Millas/año</div><div class="v mono">${Number(W.millas).toLocaleString()}</div></div>
       <div><div class="lbl">APR equiv.</div><div class="v mono">${c.aprEq.toFixed(2)}%</div></div>`;
    d=`<div class="dl"><span>Cap cost (precio + acq − reducciones)</span><b class="mono">${fm(c.capCost)}</b></div>
       <div class="dl"><span>Residual (${W.residPct}% de ${fm(c.msrp)})</span><b class="mono">${fm(c.residual)}</b></div>
       <div class="dl"><span>Pago base</span><b class="mono">${fm(c.base,2)}</b></div>
       <div class="dl"><span>+ Tax ${W.taxPct}% sobre el pago</span><b class="mono">${fm(c.pago-c.base,2)}</b></div>
       ${c.equity<0?`<div class="dl neg"><span>⚠ Equity negativo capitalizado</span><span class="mono">${fm(-c.equity)}</span></div>`:''}
       <div class="dl tot"><span>Pago mensual CON tax</span><span class="mono">${fm(c.pago)}</span></div>`;
  }else if(W.tipo==='finance'){
    k=`<div><div class="lbl">Out-the-door</div><div class="v mono">${fm(c.otd)}</div></div>
       <div><div class="lbl">A financiar</div><div class="v mono">${fm(c.financiar)}</div></div>
       <div><div class="lbl">Plazo</div><div class="v mono">${W.plazoF} m</div></div>
       <div><div class="lbl">APR</div><div class="v mono">${W.apr}%</div></div>`;
    d=`<div class="dl"><span>Precio de venta</span><b class="mono">${fm(c.precio)}</b></div>
       <div class="dl"><span>+ Fees (doc + tag + otros)</span><b class="mono">${fm(c.fees)}</b></div>
       <div class="dl"><span>+ Tax (base ${fm(Math.max(0,c.precio-c.allow))} × ${W.taxPct}%)</span><b class="mono">${fm(c.tax)}</b></div>
       <div class="dl neg"><span>− Rebates</span><span class="mono">${fm(c.rebates)}</span></div>
       ${c.allow?`<div class="dl neg"><span>− Equity del trade (${fm(c.allow)} − payoff ${fm(c.payoff)})</span><span class="mono">${fm(c.equity)}</span></div>`:''}
       <div class="dl neg"><span>− Entrada</span><span class="mono">${fm(c.down)}</span></div>
       <div class="dl tot"><span>A financiar</span><span class="mono">${fm(c.financiar)}</span></div>`;
  }else{
    k=`<div><div class="lbl">Precio</div><div class="v mono">${fm(c.precio)}</div></div>
       <div><div class="lbl">Fees</div><div class="v mono">${fm(c.fees)}</div></div>
       <div><div class="lbl">Tax</div><div class="v mono">${fm(c.tax)}</div></div>`;
    d=`<div class="dl tot"><span>Out-the-door de contado</span><span class="mono">${fm(c.alFirmar)}</span></div>`;
  }
  el.innerHTML=`<div class="numero">
    <div class="lbl">${W.tipo==='cash'?'Total out-the-door':'Pago mensual'}${W.tipo==='lease'?' · con tax':''}</div>
    <div class="big mono">${fm(W.tipo==='cash'?c.alFirmar:c.pago)}</div>
    <div class="klist">${k}</div>
    <div class="desglose">${d}</div>
  </div>`;
}

/* ═══ ACCIONES ═══ */
function copiarCot(){
  const t=quoteText();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Cotización copiada — el número completo'));
  else prompt('Copia:',t);
}
function waCot(){
  const tel=tel10(W.tel);
  if(!tel){toast('Pon el teléfono del cliente arriba');return}
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(quoteText())}`,'_blank');
}
function guardarCot(){
  if(!num(W.precio)){toast('Arma el negocio primero');return}
  S.cotizaciones.unshift({id:Date.now(),fecha:new Date().toLocaleDateString('es-US'),vinculo:W.vinculo?JSON.parse(JSON.stringify(W.vinculo)):null,w:JSON.parse(JSON.stringify(W)),texto:quoteText()});
  save();toast(W.vinculo?`Guardado en el historial de ${W.vinculo.nom}`:'Cotización guardada');render();
}
function cotDe(v){return S.cotizaciones.filter(q=>q.vinculo&&q.vinculo.kind===v.kind&&q.vinculo.id===v.id)}
function buscarP(q){
  const el=$('listaP');if(!el)return;
  q=(q||'').trim().toLowerCase();
  if(!q){el.innerHTML='';return}
  const m=personas().filter(p=>(p.nom+' '+p.veh+' '+(p.tel||'')).toLowerCase().includes(q)).slice(0,6);
  el.innerHTML=m.length?`<div style="position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--bg2);border:1px solid var(--bd2);border-radius:11px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.5)">
    ${m.map(p=>`<div onclick="vincular('${p.kind}','${p.id}')" style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd);cursor:pointer">
      <span>${p.kind==='cliente'?'📒':'🎯'}</span>
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;color:var(--tx)">${esc(p.nom)}</div>
      <div style="font-size:11px;color:var(--tx3)">${esc(p.veh)}${p.tel?' · '+esc(p.tel):''}</div></div>
      <span style="font-size:9px;font-weight:800;text-transform:uppercase;color:${p.kind==='cliente'?'var(--ok)':'var(--info)'}">${p.kind}</span>
    </div>`).join('')}</div>`
  :`<div style="position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--bg2);border:1px solid var(--bd);border-radius:11px;padding:11px 14px;font-size:12px;color:var(--tx3)">Nadie con ese nombre — escribe abajo los datos a mano.</div>`;
}
function abrirCot(id){const q=S.cotizaciones.find(x=>x.id===id);if(!q)return;W=JSON.parse(JSON.stringify(q.w));go('desk')}
function delCot(id){S.cotizaciones=S.cotizaciones.filter(x=>x.id!==id);save();render()}

/* ═══ PLANTILLAS ═══ */
function rPlantillas(){
  return `<div class="card">
    <h2>Plantillas por dealer</h2>
    <div class="hint">Cada dealer tiene sus fees. Guarda una plantilla por dealer y aplícala en el Desk con un toque — así el número sale bien a la primera.</div>
    <div class="grid">
      <div class="f span2"><label>Nombre del dealer</label><input id="pNom" placeholder="Ej. Toyota of Doral"></div>
      <div class="f"><label>Doc fee $</label><input id="pDoc" type="number" value="${esc(W.docFee)}"></div>
      <div class="f"><label>Tag/título $</label><input id="pTag" type="number" value="${esc(W.tagFee)}"></div>
      <div class="f"><label>Otros fees $</label><input id="pOtr" type="number" value="${esc(W.otros)}"></div>
      <div class="f"><label>Tax %</label><input id="pTax" type="number" step="0.1" value="${esc(W.taxPct)}"></div>
    </div>
    <div style="margin-top:12px"><button class="btn" onclick="addP()">Guardar plantilla</button></div>
  </div>
  <div class="card">
    ${S.plantillas.length?S.plantillas.map((p,i)=>`<div class="qrow">
      <div style="flex:1"><b>${esc(p.nombre)}</b><div style="font-size:11px;color:var(--tx3)">Doc ${fm(p.docFee)} · Tag ${fm(p.tagFee)} · Otros ${fm(p.otros)} · Tax ${p.taxPct}%</div></div>
      <button class="btn sec sm" onclick="aplicarP(${i});go('desk')">Usar</button>
      <button class="btn dan sm" onclick="delP(${i})">✕</button>
    </div>`).join(''):'<div class="empty">Sin plantillas todavía.<br>Guarda la primera con los fees del dealer donde más trabajas.</div>'}
  </div>
  <div class="card">
    <h2 style="font-size:13px">Tu firma en las cotizaciones</h2>
    <div style="height:8px"></div>
    <div class="grid">
      <div class="f"><label>Tu nombre</label><input id="cfgNom" value="${esc(S.cfg.vendedor)}" placeholder="Carlos"></div>
      <div class="f"><label>Tu WhatsApp</label><input id="cfgWa" value="${esc(S.cfg.wa)}" placeholder="305 000 0000"></div>
    </div>
    <div style="margin-top:10px"><button class="btn sec sm" onclick="S.cfg.vendedor=$('cfgNom').value;S.cfg.wa=$('cfgWa').value;save();toast('Guardado')">Guardar</button></div>
  </div>
  <div class="card">
    <h2 style="font-size:13px">Respaldo</h2>
    <div class="hint">Plantillas, bancos y cotizaciones viven en este dispositivo. Descarga el respaldo cada semana.</div>
    <div class="row">
      <button class="btn sec sm" onclick="expJson()">⬇ Descargar respaldo</button>
      <label class="btn sec sm" style="cursor:pointer">⬆ Restaurar<input type="file" accept=".json" style="display:none" onchange="impJson(this)"></label>
    </div>
  </div>`;
}
function addP(){
  const nombre=$('pNom').value.trim();if(!nombre){toast('Nombre del dealer');return}
  S.plantillas.push({nombre,docFee:num($('pDoc').value),tagFee:num($('pTag').value),otros:num($('pOtr').value),taxPct:num($('pTax').value)});
  save();render();toast('Plantilla guardada');
}
function aplicarP(i){const p=S.plantillas[i];if(!p)return;W.docFee=p.docFee;W.tagFee=p.tagFee;W.otros=p.otros;W.taxPct=p.taxPct;toast('Plantilla: '+p.nombre);if(TAB==='desk')render()}
function delP(i){S.plantillas.splice(i,1);save();render()}

/* ═══ BANCOS ═══ */
function rBancos(){
  const G={'RouteOne':'#3b82f6','Cautiva':'#8b5cf6','Credit Union':'#22c55e'};
  const grupos=['Credit Union','Cautiva','RouteOne'];
  return `<div class="card">
    <h2>Bancos y tasas de referencia</h2>
    <div class="hint">Los comunes de <b>RouteOne/DealerTrack</b> (para cuando tengas tu dealer, la conexión va aquí), las cautivas de marca, y las credit unions — que publican sus tasas GRATIS en sus webs. Las tasas son <b>referencia (${esc(S.bancosFecha)})</b>: edítalas con la del día. Toca <b>Usar</b> para llevar la tasa al Desk.</div>
    <div class="note">📌 Referencia del mercado: el promedio nacional de APR nuevo ronda 6.5-7% y usado 10-11%; las credit unions suelen estar 1-2 puntos por debajo de los bancos. Buen crédito baja de ahí, subprime sube.<br>🔄 <b>Rutina diaria del equipo:</b> antes del primer desking del día, abre el link del banco que vas a usar y actualiza su tasa aquí — 60 segundos y trabajas con el número real. (Cuando el backend esté vivo, esto se actualizará solo todos los días.)</div>
    <div class="row" style="margin-bottom:6px">
      <div class="f" style="flex:1"><label>Fecha de estas tasas</label><input value="${esc(S.bancosFecha)}" onchange="S.bancosFecha=this.value;save()"></div>
    </div>
  </div>
  ${grupos.map(g=>`<div class="card">
    <div class="row" style="margin-bottom:8px"><span class="gtag" style="background:${G[g]}20;color:${G[g]}">${g==='RouteOne'?'Comunes en RouteOne':g==='Cautiva'?'Cautivas de marca':'Credit Unions (tasas públicas)'}</span></div>
    <div class="tblwrap"><table>
      <tr><th>Banco</th><th>APR nuevo</th><th>APR usado</th><th></th><th></th></tr>
      ${S.bancos.map((b,i)=>b.g!==g?'':`<tr>
        <td><b>${esc(b.n)}</b>${b.nota?`<div style="font-size:10px;color:var(--tx3)">${esc(b.nota)}</div>`:''}<a href="https://www.${esc(b.w)}" target="_blank" rel="noopener">${esc(b.w)} ↗</a></td>
        <td><input type="number" step="0.1" value="${esc(b.an)}" onchange="S.bancos[${i}].an=this.value;save()">%</td>
        <td><input type="number" step="0.1" value="${esc(b.au)}" onchange="S.bancos[${i}].au=this.value;save()">%</td>
        <td><button class="btn sec sm" onclick="usarBanco(${i})">Usar</button></td>
        <td></td>
      </tr>`).join('')}
    </table></div>
  </div>`).join('')}`;
}
function usarBanco(i){
  const b=S.bancos[i];if(!b)return;
  W.apr=num(W.cond==='Nuevo'?b.an:b.au);W.tipo='finance';
  toast(`${b.n}: ${W.apr}% al Desk`);go('desk');
}

/* ═══ COTIZACIONES ═══ */
function rCotizaciones(){
  return `<div class="card">
    <h2>Cotizaciones guardadas</h2>
    <div class="hint">Cada negocio que armas se puede guardar y reabrir. Al cerrar de verdad, pásalo al CRM.</div>
    ${S.cotizaciones.length?S.cotizaciones.map(q=>`<div class="qrow">
      <div style="flex:1;min-width:0">
        <b>${esc(q.w.cliente||'Sin nombre')}</b> <span class="pill">${q.w.tipo}</span>
        ${q.vinculo?`<span class="pill" style="background:rgba(34,197,94,.1);color:var(--ok)">${q.vinculo.kind==='cliente'?'📒 libro':'🎯 lead'}</span>`:''}
        <div style="font-size:11px;color:var(--tx3)">${esc([q.w.ano,q.w.marca,q.w.modelo].filter(Boolean).join(' '))} · ${q.fecha}</div>
      </div>
      <button class="btn sec sm" onclick="abrirCot(${q.id})">Abrir</button>
      <button class="btn dan sm" onclick="delCot(${q.id})">✕</button>
    </div>`).join(''):'<div class="empty">Sin cotizaciones guardadas.<br>Arma un negocio en el Desk y tócale 💾.</div>'}
  </div>`;
}

/* ═══ RESPALDO ═══ */
function expJson(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='autosolution-desking-respaldo.json';a.click();
}
function impJson(el){
  const f=el.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);
    if(!d.bancos&&!d.plantillas){toast('Archivo no válido');return}
    S=Object.assign(BLANK(),d);save();render();toast('Respaldo restaurado');
  }catch(err){toast('No se pudo leer')}};
  r.readAsText(f);
}

/* Abierto desde la ficha del CRM: ?cid=<cliente> o ?lid=<lead> */
(function(){
  try{
    const p=new URLSearchParams(location.search);
    if(p.get('cid'))vincular('cliente',p.get('cid'));
    else if(p.get('lid'))vincular('lead',p.get('lid'));
  }catch(e){}
})();
render();
</script>
