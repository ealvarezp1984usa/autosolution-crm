<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#080808"/>
<title>AutoSolution Miami — CRM</title>
<link rel="manifest" href="./manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AutoSolution"/>
<link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080808;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;
  --bd:#2a2a2a;--bd2:#363636;
  --tx:#f2f2f2;--tx2:#b0b0b0;--tx3:#7d7d7d;
  --p:#e31c1c;--pd:#b91c1c;--ps:rgba(227,28,28,.1);
  --ok:#22c55e;--warn:#eab308;--info:#3b82f6;--dan:#ef4444;
  --vio:#8b5cf6;--ora:#f97316;--wa:#25D366;
  --r:9px;--r2:13px;
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);
  font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;font-feature-settings:'tnum'}
.bebas{font-family:'Bebas Neue','Archivo Black',sans-serif;letter-spacing:.04em}
button{cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#333;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
.sh{-ms-overflow-style:none;scrollbar-width:none}
.sh::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.fi{animation:fadeUp .16s ease forwards}
.spin{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;
  margin-left:-3px;vertical-align:top;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ═══ SHELL ═══ */
.app{display:flex;height:100%;overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:none}
.scrim.on{display:block}
aside{position:fixed;top:0;left:0;bottom:0;width:230px;background:#070707;border-right:1px solid var(--bd);
  display:flex;flex-direction:column;z-index:90;transform:translateX(-100%);transition:transform .2s ease}
aside.on{transform:none}
.sbhead{padding:14px 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--bd);min-height:54px}
.sbuser{padding:10px}
.sbuser .pill{display:flex;align-items:center;gap:8px;padding:8px;border-radius:9px;background:var(--bg3)}
.sbav{width:28px;height:28px;border-radius:50%;background:var(--p);display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:11.5px;flex-shrink:0;letter-spacing:-.02em}
.sbnav{flex:1;overflow-y:auto;padding:6px}
.nvi{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:14.5px;
  border:none;background:transparent;color:var(--tx3);text-align:left;margin-bottom:1px;position:relative}
.nvi.on{background:var(--ps);color:var(--p);font-weight:700}
.nvi .lb{flex:1}
.nvi .bdg{font-size:10px;font-weight:800;background:var(--p);color:#fff;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center}
.nvi .soon{font-size:10px;font-weight:800;color:var(--tx3);border:1px solid var(--bd2);border-radius:99px;padding:1px 5px;letter-spacing:.04em}
.nvsec{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;padding:12px 10px 5px}
.sbfoot{padding:8px;border-top:1px solid var(--bd)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd);
  background:var(--bg2);flex-shrink:0;min-height:52px}
.tbtitle{font-size:14.5px;font-weight:700;color:var(--tx);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:none;border:none;color:var(--tx3);padding:6px;border-radius:7px;line-height:0;display:flex}
.content{flex:1;overflow-y:auto;padding:16px 14px calc(78px + var(--sb));}
.content.flush{padding:0}
.inner{max-width:1180px;margin:0 auto}

.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--bd);display:flex;z-index:70;padding-bottom:var(--sb)}
.bn{flex:1;background:none;border:none;color:var(--tx3);font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.bn svg.ic{width:19px;height:19px}
.bn.on{color:var(--tx)}
.bn.on svg.ic{stroke:var(--p)}
.bn .dot{position:absolute;top:6px;right:calc(50% - 16px);width:6px;height:6px;border-radius:50%;background:var(--p)}

/* ═══ PRIMITIVES ═══ */
h2.vh{font-size:20px;font-weight:800;color:var(--tx);letter-spacing:-.02em}
.vsub{font-size:14.5px;color:var(--tx3);margin-top:3px;line-height:1.5}
.stack{display:flex;flex-direction:column;gap:18px}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.chead{padding:15px 18px;border-bottom:1px solid var(--bd);font-weight:700;font-size:14.5px;color:var(--tx)}
.chead .s{font-size:13px;color:var(--tx3);font-weight:400;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid1{display:grid;grid-template-columns:1fr;gap:10px}
.divider{height:1px;background:var(--bd);margin:12px 0}

.btn{border-radius:8px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  letter-spacing:.01em;white-space:nowrap;font-size:14.5px;padding:9px 16px;background:var(--p);color:#fff;border:none;transition:opacity .12s}
.btn:active{opacity:.75}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--tx2);border:1px solid var(--bd2)}
.btn.ghost{background:transparent;color:var(--tx3);border:none}
.btn.ok{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.25)}
.btn.dan{background:rgba(239,68,68,.1);color:var(--dan);border:1px solid rgba(239,68,68,.25)}
.btn.wa{background:var(--wa);color:#07130A;font-weight:700}
.btn.sm{font-size:13px;padding:6px 12px;gap:5px}
.btn.xs{font-size:11.5px;padding:5px 9px;gap:4px}
.btn.lg{font-size:14.5px;padding:12px 22px}
.btn.full{width:100%}
.btn svg.ic{width:13px;height:13px}

.bdg2{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:11.5px;
  font-weight:700;letter-spacing:.03em;white-space:nowrap;border:1px solid}
label.f{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);
  margin-bottom:5px;display:flex;gap:4px;align-items:center}
label.f .h{color:var(--tx3);font-weight:400;text-transform:none;letter-spacing:normal;font-size:11.5px}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--bd);
  background:var(--bg3);color:var(--tx);font-size:16.5px;outline:none;line-height:1.4;transition:border-color .12s}
.inp:focus{border-color:var(--p)}
.inp::placeholder{color:var(--tx3)}
textarea.inp{resize:vertical;min-height:88px;font-size:16.5px;line-height:1.55}
select.inp{-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%23555' stroke-width='2' stroke-linecap='round'><path d='M3 5l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
.fr{display:flex;flex-direction:column}
.check{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--tx2);padding:4px 0}
.check input{accent-color:var(--p);width:16px;height:16px}

.kpi{background:var(--bg2);border-radius:12px;padding:17px;display:flex;align-items:flex-start;gap:13px;border:1px solid var(--bd)}
.kpi .ib{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi .v{font-size:25px;font-weight:800;color:var(--tx);line-height:1.1;letter-spacing:-.04em}
.kpi .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-top:3px}
.kpi .s{font-size:11.5px;color:var(--tx3);margin-top:2px}

.empty{display:flex;flex-direction:column;align-items:center;padding:40px 20px;text-align:center}
.empty .eb{width:44px;height:44px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;
  justify-content:center;margin-bottom:12px;color:var(--tx3)}
.empty .t{font-weight:700;color:var(--tx2);font-size:14.5px}
.empty .s{font-size:14.5px;color:var(--tx3);margin-top:5px;max-width:280px;line-height:1.55}

/* ═══ LIST ROWS ═══ */
.lrow{width:100%;display:flex;align-items:stretch;background:none;border:none;border-bottom:1px solid var(--bd);
  text-align:left;padding:0;color:inherit}
.lrow:last-child{border-bottom:none}
.lrow .heat{width:3px;flex-shrink:0;align-self:stretch;opacity:.75}
.lrow .body{flex:1;padding:12px 14px;min-width:0;display:flex;align-items:center;gap:10px}
.lname{font-size:14.5px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta{font-size:13px;color:var(--tx3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagrow{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;align-items:center}

/* ═══ ALERTAS ═══ */
.arow{position:relative;padding-left:16px}
.arow::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--warn)}
.arow.hot::before{background:var(--p)}
.atag{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.arow.hot .atag{color:var(--p)}
.aact{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}

/* ═══ PIPELINE ═══ */
.kan{display:flex;gap:11px;overflow-x:auto;padding-bottom:10px}
.kcol{min-width:208px;flex-shrink:0}
.khead{background:var(--bg2);border:1px solid var(--bd);border-radius:0 0 10px 10px;padding:9px 12px;margin-bottom:8px}
.kcard{background:var(--bg2);border-radius:10px;border:1px solid var(--bd);overflow:hidden}
.kcard .hb{height:3px;opacity:.75}

/* ═══ DEAL ROOM ═══ */
.steps{display:flex;gap:7px;overflow-x:auto;padding:11px 14px;border-bottom:1px solid var(--bd);background:#0d0d0d}
.stp{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:99px;border:1px solid var(--bd);
  background:transparent;color:var(--tx3);font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0}
.stp.on{background:var(--ps);border-color:var(--p);color:var(--p)}
.stp.done{border-color:rgba(34,197,94,.4);color:var(--ok)}
.stp .n{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:flex;
  align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.fbar{border-top:1px solid var(--bd);background:#0a0a0a;padding:9px 0;
  position:fixed;bottom:calc(56px + var(--sb));left:0;right:0;z-index:60;
  display:flex;align-items:center;gap:14px;overflow-x:auto}
.fbar .f{flex-shrink:0;padding-left:14px}
.fbar .f:last-child{padding-right:14px}
.fbar .fl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3)}
.fbar .fv{font-size:16.5px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.tl{padding-left:16px;border-left:2px solid var(--bd);margin-top:12px}
.tli{position:relative;margin-bottom:12px}
.tli .dot{position:absolute;left:-25px;top:2px;width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:1.5px solid}
.tli .dot svg.ic{width:9px;height:9px}
.actgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.actbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:8px;
  border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:10px;font-weight:700;text-transform:uppercase}
.sumrow{display:flex;justify-content:space-between;padding:7px 0;font-size:14.5px}
.sumrow.b{border-top:1px solid var(--bd);font-weight:700;color:var(--tx);margin-top:2px;padding-top:7px}

/* ═══ PROGRAMAS ═══ */
.promo{border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;background:var(--bg2)}
.phead{background:linear-gradient(135deg,#1a1a1e,#141416);padding:14px 16px;border-bottom:1px solid var(--bd)}
.pbrand{font-family:'Bebas Neue',sans-serif;font-size:14.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--p)}
.pmodel{font-weight:800;font-size:20px;letter-spacing:-.03em;margin-top:2px}
.ppay{font-weight:800;font-size:16.5px;margin-top:3px}
.ppay small{color:var(--tx3);font-weight:500;font-size:13px}
.pfine{padding:10px 16px;color:var(--tx3);font-size:13px;line-height:1.55;border-bottom:1px solid var(--bd)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--bd);font-size:14.5px;color:var(--tx2)}
.mrow:last-child{border-bottom:none}
.mlab{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:12px 0 2px}

/* ═══ MODAL ═══ */
.mask{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd2);border-radius:16px 16px 0 0;width:100%;
  max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .2s ease}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;
  border-bottom:1px solid var(--bd);flex-shrink:0}
.mhead b{font-weight:700;font-size:16.5px}
.mbody{padding:16px 18px calc(16px + var(--sb));overflow-y:auto;flex:1}
.mfoot{padding:12px 18px calc(12px + var(--sb));border-top:1px solid var(--bd);display:flex;gap:8px;flex-shrink:0}
.mfoot .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--bg2);
  border:1px solid rgba(34,197,94,.35);color:var(--ok);font-size:14.5px;font-weight:600;padding:11px 20px;
  border-radius:99px;z-index:300;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:88vw;text-align:center}
.toast.on{opacity:1;bottom:106px}

/* ═══ ONBOARDING ═══ */
.onb{position:fixed;inset:0;z-index:400;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.onbhero{background:#0d0909;border-bottom:1px solid var(--bd);padding:34px 22px 30px;position:relative;overflow:hidden}
.onbhero .glow{position:absolute;bottom:-90px;right:-60px;width:240px;height:240px;
  background:rgba(227,28,28,.06);border-radius:50%}
.onbtag{display:inline-flex;align-items:center;gap:6px;background:var(--ps);border:1px solid rgba(227,28,28,.19);
  border-radius:99px;padding:4px 12px;margin:20px 0 16px;font-size:11.5px;font-weight:700;color:var(--p);
  text-transform:uppercase;letter-spacing:.08em}
.onbform{padding:26px 22px calc(30px + var(--sb));max-width:440px;width:100%;margin:0 auto}

/* ═══ ENTRADA (login / registro) ═══ */
.auh{font-size:25px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
.aup{color:var(--tx3);font-size:14.5px;margin-bottom:20px;line-height:1.6}
.aunota{font-size:13px;color:var(--tx3);text-align:center;margin-top:14px;line-height:1.6}
.aumsg{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:9px;
  font-size:14.5px;line-height:1.55;margin-bottom:14px}
.aumsg.dan{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
.aumsg.ok{background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.25);color:#86efac}
.aumsg svg.ic{flex-shrink:0;margin-top:1px}
.inp.au{font-size:16.5px;padding:12px 14px}
.ausep{display:flex;align-items:center;gap:10px;margin:20px 0 12px;color:var(--tx3);font-size:13px}
.ausep:before,.ausep:after{content:'';flex:1;height:1px;background:var(--bd)}
.sbacc{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:9px;
  background:var(--bg3);margin-bottom:7px}

/* ═══ DASH DE ADMIN ═══ */
.admrow{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--bd);align-items:flex-start}
.admrow:last-child{border-bottom:none}
.admav{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.admnom{font-size:14.5px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.admsub{font-size:13px;color:var(--tx3);line-height:1.5}

/* ═══ DESKTOP ═══ */
@media(min-width:1000px){
  aside{position:static;transform:none;width:212px}
  .scrim{display:none!important}
  .bottomnav{display:none}
  .content{padding:20px 24px 30px}
  .menubtn{display:none}
  .grid2{grid-template-columns:repeat(4,1fr)}
  .grid1{grid-template-columns:1fr 1fr}
  .mask{align-items:center;padding:20px}
  .modal{border-radius:16px;max-height:88vh}
  .mfoot{justify-content:flex-end}
  .mfoot .btn{flex:0 0 auto}
  .fbar{left:212px;bottom:0}
  .toast{left:auto;right:24px;transform:none;bottom:24px}
  .onb{flex-direction:row}
  .onbhero{width:44%;border-bottom:none;border-right:1px solid var(--bd);padding:48px;
    display:flex;flex-direction:column;justify-content:space-between}
  .onbwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
}
@media(max-width:999px){ .dtonly{display:none!important} }

/* ═══ IMPRESIÓN ═══ */
#impresion{display:none}
@media print{
  @page{margin:12mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  body>*{display:none!important}
  #impresion{display:block!important;background:#fff;color:#000;
    font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:10.5pt;line-height:1.45}
  #impresion .hoja{max-width:100%}
  #impresion .cab{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2.5px solid #000;padding-bottom:7px;margin-bottom:14px}
  #impresion .marca{font-size:16pt;font-weight:900;letter-spacing:.06em}
  #impresion .sub{font-size:9pt;color:#444;margin-top:2px}
  #impresion .fechad{font-size:9pt;color:#444}

<script>
/* ═══════════ ESTADO Y PERSISTENCIA ═══════════ */
const K='asm_libro_v1';
const BLANK=()=>({cfg:{nombre:'',wa:'',dealer:'AutoSolution Miami',onboarded:false,metaMes:{u:0,g:0}},
  clientes:[],leads:[],promos:[],tareas:[],
  meta:{rev:0,updatedAt:'',device:''}});
let S=BLANK();
try{
  const raw=localStorage.getItem(K);
  if(raw){const d=JSON.parse(raw); S=Object.assign(BLANK(),d); S.cfg=Object.assign(BLANK().cfg,d.cfg||{});}
}catch(e){console.warn('Estado ilegible, se arranca vacío.',e);}
['clientes','leads','promos','tareas'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];});
if(!S.meta||typeof S.meta!=='object')S.meta={rev:0,updatedAt:'',device:''};

let saveErr=false;
function saveLocal(){
  try{localStorage.setItem(K,JSON.stringify(S));saveErr=false;return true;}
  catch(e){
    if(!saveErr){saveErr=true;
      alert('No se pudo guardar en este navegador (¿modo privado o disco lleno?). Conecta GitHub o un archivo desde Config › Nube para no perder nada.');}

/* save() = guarda ya en local (rápido) y agenda el envío a la nube (con retraso). */
function save(opts){

/* ═══════════ HELPERS ═══════════ */
const $=id=>document.getElementById(id);
const uid=p=>(p||'x')+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO=()=>new Date().toISOString();
const fechaLocal=d=>{d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const mesLocal=d=>{d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const today=()=>fechaLocal();
const thisMonth=()=>mesLocal();
const num=v=>{const n=Number(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const fm=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(num(n));
const fmN=n=>new Intl.NumberFormat('en-US').format(Math.round(num(n)));
const ini=s=>String(s||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'AS';
function fDate(iso){if(!iso)return'—';const d=new Date(iso.length===10?iso+'T00:00:00':iso);
  return isNaN(d)?iso:d.toLocaleDateString('es-US',{month:'short',day:'numeric',year:'numeric'});}
function fDateEN(iso){if(!iso)return '';const d=new Date(iso.length===10?iso+'T00:00:00':iso);
  return isNaN(d)?iso:d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}
function fDateTime(iso){const d=new Date(iso);return isNaN(d)?'—':
  d.toLocaleDateString('es-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtM(d){return d.toLocaleDateString('es-US',{month:'short',year:'numeric'});}
function addMonths(ym,n){if(!ym)return null;const a=String(ym).split('-');const y=+a[0],m=+a[1];
  if(!y||!m)return null;return new Date(y,(m-1)+n,1);}
function hoy(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dias(a,b){return Math.round((a-b)/864e5);}
function tel10(t){let d=String(t||'').replace(/\D/g,'');
  if(d.length===10)d='1'+d;
  if(d.length===11&&d[0]==='1')return d;
  return d;}
const firma=()=>S.cfg.nombre?', soy '+S.cfg.nombre:'';
/* El idioma del cliente. Se marca una vez en su ficha y todo lo que le
   salga — alertas, hoja del negocio, especiales — va en el suyo. */
const enIngles=o=>!!(o&&o.idioma==='en');
const firmaEN=()=>S.cfg.nombre?', this is '+S.cfg.nombre:'';
function calcPmt(amt,apr,mo){if(!amt||!mo)return 0;const r=(apr/100)/12;
  return r>0?amt*(r*Math.pow(1+r,mo))/(Math.pow(1+r,mo)-1):amt/mo;}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');
  clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600);}
const jsq=x=>esc(JSON.stringify(x));
function badge(txt,color){return `<span class="bdg2" style="color:${color};background:${color}20;border-color:${color}30">${esc(txt)}</span>`;}
function empty(icon,t,s){return `<div class="empty"><div class="eb">${ic(icon,19)}</div>
  <div class="t">${esc(t)}</div>${s?`<div class="s">${s}</div>`:''}</div>`;}
function kpi(icon,label,value,sub,accent){
  return `<div class="kpi"><div class="ib" style="background:${accent}18;color:${accent}">${ic(icon,17,accent)}</div>
    <div style="min-width:0;flex:1"><div class="v mono">${value}</div><div class="l">${esc(label)}</div>
    ${sub?`<div class="s">${esc(sub)}</div>`:''}</div></div>`;}

/* ── vehículo / etiquetas ── */
const vehLead=l=>[l.veh&&l.veh.ano,l.veh&&l.veh.marca,l.veh&&l.veh.mod].filter(Boolean).join(' ')||'Sin vehículo';
const vehCli=c=>[c.ano,c.marca,c.mod].filter(Boolean).join(' ')||'—';
const tipoLbl=t=>t==='lease'?'Lease':t==='finance'?'Financiado':'Cash';
const tipoCol=t=>t==='lease'?'#F87171':t==='finance'?C.warn:C.ok;

/* ═══════════ MOTOR DE URGENCIA (del diseño) ═══════════ */
function getUrgency(l){
  const et=ETAPAS[l.etapa]||'Nuevo';
  if(et==='Vendido'||et==='Perdido')return{score:0,color:C.bd2,label:'Cerrado'};
  const dsU=(Date.now()-new Date(l.updatedAt||l.createdAt))/864e5;
  const dsC=(Date.now()-new Date(l.createdAt))/864e5;
  let s=30;
  if(et==='Nuevo'){ if(dsC<.25)s+=45; else if(dsC<1)s+=30; else if(dsC<3)s+=10; else s-=10; }
  else if(et==='Negociación')s+=40;
  else if(et==='Cita')s+=30;
  else if(et==='Contactado')s+=10;
  if(dsU<.5)s+=15; else if(dsU<1)s+=5; else if(dsU>7)s-=25; else if(dsU>3)s-=12;
  const b=num(l.veh&&l.veh.pres);
  if(b>70000)s+=10; else if(b>35000)s+=5;
  s=Math.max(0,Math.min(100,Math.round(s)));
  if(s>=75)return{score:s,color:C.p,label:'🔴 Urgente'};
  if(s>=55)return{score:s,color:C.warn,label:'🟡 Caliente'};
  if(s>=35)return{score:s,color:C.info,label:'🔵 Tibio'};
  return{score:s,color:C.tx3,label:'⚫ Frío'};
}

/* ═══════════ MOTOR DE ALERTAS (del libro) ═══════════ */
function calcAlertas(){
  const H=hoy(),out=[];
  for(const c of S.clientes){
    if(!c.fecha)continue;
    const base=addMonths(c.fecha,0); if(!base)continue;

    if(c.tipo==='lease'&&num(c.plazo)){
      const fin=addMonths(c.fecha,num(c.plazo)),d=dias(fin,H);
      if(d<=200){
        let tag,hot=false;
        if(d<0){tag='Lease vencido hace '+Math.abs(d)+' días';hot=true;}
        else if(d<=60){tag='Lease vence en '+d+' días';hot=true;}
        else if(d<=125){tag='Lease vence en ~'+Math.round(d/30)+' meses';}
        else{tag='Lease vence en ~6 meses';}
        const meses=Math.max(1,Math.round(d/30));
        out.push({cid:c.id,nom:c.nom,tel:c.tel,veh:vehCli(c),tag,hot,ord:d,tipo:'lease',idioma:c.idioma,
          msg:`Hola ${c.nom}${firma()} 👋 Te aviso con tiempo: el lease de tu ${vehCli(c)} ${d<0?'ya se venció':meses===1?'se vence el mes que viene':'se vence en unos '+meses+' meses'}. Los que empiezan a ver opciones con tiempo consiguen mucho mejor deal que los que esperan al final. ¿Quieres que te vaya buscando opciones?`,
          msgEN:`Hi ${c.nom}${firmaEN()} 👋 Giving you a heads-up: the lease on your ${vehCli(c)} ${d<0?'already ended':meses===1?'ends next month':'ends in about '+meses+' months'}. People who start looking early get a much better deal than the ones who wait until the last minute. Want me to start looking at options for you?`});
      }
    }
    if(c.tipo==='finance'){
      const refi=addMonths(c.fecha,12),d=dias(refi,H);
      if(d<=30&&d>=-180){
        out.push({cid:c.id,nom:c.nom,tel:c.tel,veh:vehCli(c),hot:false,ord:d+1000,tipo:'refi',idioma:c.idioma,
          tag:d<=0?'Cumplió 1 año · revisar refi':'Cumple 1 año en '+d+' días',
          msg:`Hola ${c.nom}${firma()} 👋 Ya ${d<=0?'llevas':'casi llevas'} un año con tu ${vehCli(c)}. A veces a esta altura conviene revisar la tasa — hay casos donde baja el pago. Si quieres le doy un vistazo sin compromiso.`,
          msgEN:`Hi ${c.nom}${firmaEN()} 👋 You've ${d<=0?'had':'almost had'} your ${vehCli(c)} for a year now. Around this point it's often worth checking the rate — sometimes the payment comes down. Happy to take a look, no strings attached.`});
      }
    }
    const H2=hoy();
    let aniv=new Date(H2.getFullYear(),base.getMonth(),1);
    if(dias(aniv,H2)<-30)aniv=new Date(H2.getFullYear()+1,base.getMonth(),1);
    const da=dias(aniv,H2),years=aniv.getFullYear()-base.getFullYear();
    if(da>=0&&da<=30&&years>=1&&!(c.tipo==='finance'&&years===1)){
      out.push({cid:c.id,nom:c.nom,tel:c.tel,veh:vehCli(c),hot:false,ord:da+2000,tipo:'aniv',idioma:c.idioma,
        tag:'Aniversario · '+years+' año'+(years>1?'s':''),
        msg:`¡Hola ${c.nom}! 🎉 Ya se cumple${years>1?'n':''} ${years} año${years>1?'s':''} de tu ${vehCli(c)}. ¿Cómo te ha tratado? Cualquier cosa que necesites — o si alguien cercano anda buscando carro — aquí estoy.`,
        msgEN:`Hi ${c.nom}! 🎉 It's been ${years} year${years>1?'s':''} with your ${vehCli(c)}. How's it treating you? Anything you need — or if someone close to you is looking for a car — I'm here.`});
    }
  }
  /* Alertas de post-venta cargadas en el paso 8 del Deal Room */
  const PS=[['equityDate','Equity','equity',
      c=>`Hola ${c} 👋 Te escribo por algo puntual: tu carro está en un punto donde puede tener equity a tu favor. Si quieres reviso los números sin compromiso y te digo qué opciones tienes.`,
      c=>`Hi ${c} 👋 Quick note: your car is at a point where it may have equity working in your favor. If you want, I'll run the numbers with no obligation and tell you what your options are.`],
            ['refiDate','Refinanciamiento','refi',
      c=>`Hola ${c} 👋 Se abrió ventana para revisar tu tasa. En varios casos baja el pago mensual. ¿Te lo reviso sin compromiso?`,
      c=>`Hi ${c} 👋 A window just opened to review your rate. In a lot of cases the monthly payment comes down. Want me to check it, no obligation?`],
            ['renewDate','Renovación','renov',
      c=>`Hola ${c} 👋 Ya viene el momento de renovar. Si empezamos ahora te consigo mejores números que esperando al final. ¿Miramos opciones?`,
      c=>`Hi ${c} 👋 Renewal time is coming up. If we start now I can get you better numbers than waiting until the end. Want to look at options?`]];
  for(const l of S.leads){
    if(!l.post)continue;
    for(const row of PS){
      const f=l.post[row[0]]; if(!f)continue;
      const d=dias(new Date(f+'T00:00:00'),hoy());
      if(d<=45){
        out.push({lid:l.id,nom:l.nom,tel:l.tel,veh:vehLead(l),hot:d<=14,ord:d+3000,tipo:row[2],idioma:l.idioma,
          tag:'Post-venta · '+row[1]+(d<0?' (hace '+Math.abs(d)+' días)':d===0?' — hoy':' en '+d+' días'),
          msg:row[3](l.nom), msgEN:row[4](l.nom)});
      }
    }
  }
  out.sort((a,b)=>a.ord-b.ord);
  return out;
}

/* ═══════════ FÁBRICAS ═══════════ */
function nuevoLead(o){
  return{id:uid('l'),nom:o.nom,tel:o.tel||'',email:o.email||'',origen:o.origen||'Manual',etapa:0,
    createdAt:nowISO(),updatedAt:nowISO(),notas:o.notas||'',
    veh:{ano:o.ano||'',marca:o.marca||'',mod:o.mod||'',pres:num(o.pres),cond:o.cond||'Nuevo'},
    trade:{has:false,vin:'',ano:'',marca:'',mod:'',millas:0,payoff:0,acv:0,allowance:0},
    oferta:{stock:'',precio:0,msrp:0,fees:0,tax:0,rebates:0,desc:0,down:0},
    perfil:{dir:'',ciudad:'',estado:'FL',zip:'',empleador:'',cargo:'',ingreso:0,licencia:'',seguro:''},
    deal:{banco:'',tipo:'Financiado',apr:0,plazo:60},
    recap:{fni:[],finalizado:false,firmado:false},
    post:{resena:false,referidos:[],equityDate:'',refiDate:'',renewDate:''},
    acts:[]};
}
const TAX_FL=6;   /* Florida: 6% estatal. Editable por negocio. */
function finanzas(l){
  const o=l.oferta||{},t=l.trade||{},d=l.deal||{};
  const precio=num(o.precio),msrp=num(o.msrp),fees=num(o.fees),tax=num(o.tax),
    rebates=num(o.rebates),desc=num(o.desc),down=num(o.down);
  const allowance=t.has?num(t.allowance):0, payoff=t.has?num(t.payoff):0, acv=t.has?num(t.acv):0;
  const totalDue=precio+fees+tax-rebates-desc-allowance;
  const amtFin=Math.max(0,totalDue-down);
  const equity=allowance-payoff;
  const over=Math.max(0,allowance-acv);
  const frontGross=precio-msrp-over;
  const backGross=(l.recap&&l.recap.fni||[]).reduce((s,f)=>s+num(f.profit),0);
  const apr=num(d.apr),plazo=num(d.plazo)||60;

  /* Un lease NO se calcula con fórmula de préstamo. Es depreciación + renta
     sobre el residual, con el tax encima de cada pago. Sin residual ni money
     factor no hay pago que dar — mejor no enseñar nada que enseñar un número
     inventado. */
  const esLease=String(d.tipo||'').toLowerCase()==='lease';
  const base={precio,msrp,fees,tax,rebates,desc,down,allowance,payoff,acv,totalDue,amtFin,equity,over,
    frontGross,backGross,totalGross:frontGross+backGross,apr,plazo,esLease};
  if(!esLease)
    return Object.assign(base,{pago:Math.round(calcPmt(amtFin,apr,plazo)),pagoOk:true,
      alFirmar:down});

  const residPct=num(d.residPct), mf=num(d.mf), acq=num(d.acqFee);
  const taxR=(d.taxPct==null||d.taxPct==='')?TAX_FL/100:num(d.taxPct)/100;
  const n=plazo||36;
  const residual=msrp*residPct/100;
  const capRed=down+Math.max(0,equity)+rebates+desc;
  const capCost=precio+acq-capRed+Math.max(0,-equity);
  const dep=(capCost-residual)/n;
  const renta=(capCost+residual)*mf;
  const pagoBase=dep+renta;
  const pagoLease=pagoBase*(1+taxR);
  const pagoOk=residPct>0&&mf>0&&msrp>0&&n>0;
  return Object.assign(base,{
    pago:pagoOk?Math.round(pagoLease):0, pagoOk:pagoOk,
    residual, capCost, mf, residPct, acqFee:acq, millas:num(d.millas),
    aprEq:Math.round(mf*2400*100)/100, taxPct:Math.round(taxR*10000)/100,
    alFirmar:pagoOk?Math.round(pagoLease+down+fees):0,
    faltan:[residPct>0?'':'residual', mf>0?'':'money factor', msrp>0?'':'MSRP'].filter(Boolean)});
}

<script>
/* ═══════════════════════════════════════════════════════════
   SINCRONIZACIÓN — GitHub (nube) o archivo en la PC
   localStorage queda como caché rápida; la fuente de verdad
   es el remoto. La config vive en su propia clave: el token

═══════════════════════════════════════════════════════════ */

if(!SYNC.device){

              /Mac/.test(ua)?'Mac':/Windows/.test(ua)?'PC':'Navegador';

/* Estado visible: 'local'|'ok'|'pendiente'|'sync'|'error'|'conflicto'|'permiso' */
let SYNCEST={estado:SYNC.modo==='local'?'local':'pendiente',msg:''};
function setEstado(e,msg){

const SYNC_UI={
  local:{c:C.tx3,i:'CloudOff',t:'Solo este dispositivo'},

  pendiente:{c:C.warn,i:'Cloud',t:'Cambios sin enviar'},
  sync:{c:C.info,i:'Loader',t:'Sincronizando…'},
  error:{c:C.dan,i:'CloudOff',t:'Error de sincronización'},
  conflicto:{c:C.ora,i:'AlertCircle',t:'Conflicto entre dispositivos'},
  permiso:{c:C.warn,i:'HardDrive',t:'Reconectar el archivo'}
};
function pintarPill(){
  const el=$('syncPill'); if(!el)return;
  const u=SYNC_UI[SYNCEST.estado]||SYNC_UI.local;
  el.innerHTML=ic(u.i,17,u.c)+(SYNCEST.estado==='sync'?'<span class="spin"></span>':'');
  el.title=u.t+(SYNCEST.msg?' — '+SYNCEST.msg:'');
  el.style.color=u.c;
}

/* ── base64 <-> UTF-8 (nombres con acentos y emojis) ── */
function b64enc(str){
  const b=new TextEncoder().encode(str);let s='';const CH=0x8000;
  for(let i=0;i<b.length;i+=CH)s+=String.fromCharCode.apply(null,b.subarray(i,i+CH));
  return btoa(s);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\s/g,''));
  const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
/* ── Desking (asm_desk_v1) ──
   Vive en su propia clave porque desking.html la lee tal cual y no se toca.
   El CRM la adjunta al subir y la devuelve a su sitio al bajar. */
const DK='asm_desk_v1';
function leerDesk(){try{const r=localStorage.getItem(DK);return r?JSON.parse(r):null;}catch(e){return null;}}
function escribirDesk(d){
  try{ if(d==null)localStorage.removeItem(DK); else localStorage.setItem(DK,JSON.stringify(d)); return true; }
  catch(e){return false;}
}
/* Huella barata para saber si Desking escribió desde la última sincronización */
function deskSig(){
  let s='';try{s=localStorage.getItem(DK)||'';}catch(e){}
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return s.length+':'+h.toString(36);
}
const nDesk=d=>(d&&d.cotizaciones&&d.cotizaciones.length)||0;

/* Lo que viaja a la nube: el CRM + las cotizaciones de Desking */
function snapshot(){
  const o=Object.assign({},S);
  const d=leerDesk();
  if(d)o.desk=d;
  return o;
}
const payload=()=>JSON.stringify(snapshot(),null,1);

/* ═══ GITHUB ═══ */
async function ghFetch(ruta,opts){
  opts=opts||{};
  return fetch('https://api.github.com'+ruta,Object.assign({},opts,{
    headers:Object.assign({
      'Authorization':'Bearer '+SYNC.gh.token,
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'
    },opts.headers||{})
  }));
}
async function ghError(r){
  let d='';try{const j=await r.json();d=j.message||'';}catch(e){}
  if(r.status===401)return 'Token inválido o vencido.';
  if(r.status===403)return 'Sin permiso. ¿El token tiene acceso de escritura (Contents) a este repo?';
  if(r.status===404)return 'No se encontró el repo o la rama. Revisa usuario/repo/rama.';
  if(r.status===409)return 'Conflicto de versión.';
  return 'GitHub '+r.status+(d?': '+d:'');
}
const ghURL=()=>{const g=SYNC.gh;
  return `/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/`+
    String(g.path).split('/').map(encodeURIComponent).join('/');};

async function ghPull(){
  const g=SYNC.gh;
  const r=await ghFetch(ghURL()+'?ref='+encodeURIComponent(g.branch)+'&nc='+Date.now(),{cache:'no-store'});
  if(r.status===404)return {existe:false};
  if(!r.ok)throw new Error(await ghError(r));
  const j=await r.json();
  let txt;
  if(j.content&&j.content.length)txt=b64dec(j.content);
  else{ /* >1 MB: la API devuelve content vacío, hay que leer el blob */
    const rb=await ghFetch(`/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/git/blobs/${j.sha}`);
    if(!rb.ok)throw new Error(await ghError(rb));
    txt=b64dec((await rb.json()).content);
  }
  return {existe:true,sha:j.sha,datos:JSON.parse(txt)};
}
async function ghPush(sha){
  const g=SYNC.gh;
  const body={branch:g.branch,content:b64enc(payload()),
    message:`CRM · ${S.clientes.length} clientes · ${S.leads.length} leads · ${SYNC.device}`};
  if(sha||g.sha)body.sha=sha||g.sha;
  const r=await ghFetch(ghURL(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422){const e=new Error('sha desactualizado');e.conflicto=true;throw e;}
  if(!r.ok)throw new Error(await ghError(r));
  g.sha=(await r.json()).content.sha;
  return true;
}

/* ═══ ARCHIVO EN LA PC (File System Access API) ═══ */
const HAY_FS=typeof window!=='undefined'&&'showSaveFilePicker'in window;
let FH=null; /* FileSystemFileHandle */
function idbKV(op,val){
  return new Promise((res,rej)=>{
    if(!window.indexedDB)return res(null);
    const rq=indexedDB.open('asm_sync',1);
    rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('kv');}catch(e){}};
    rq.onerror=()=>rej(rq.error);
    rq.onsuccess=()=>{
      const db=rq.result;
      let tx;try{tx=db.transaction('kv',op==='get'?'readonly':'readwrite');}catch(e){return res(null);}
      const st=tx.objectStore('kv');
      const r=op==='get'?st.get('handle'):st.put(val,'handle');
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    };
  });
}
async function fsPermiso(pedir){
  if(!FH)return false;
  const o={mode:'readwrite'};
  if((await FH.queryPermission(o))==='granted')return true;
  if(!pedir)return false;
  return (await FH.requestPermission(o))==='granted';
}
async function fsLeer(){
  const f=await FH.getFile();
  const t=await f.text();
  if(!t.trim())return {existe:false};
  return {existe:true,datos:JSON.parse(t)};
}
async function fsEscribir(){
  const w=await FH.createWritable();
  await w.write(payload());
  await w.close();
  return true;
}

/* ═══ ORQUESTADOR ═══ */
let pushTimer=null, sincronizando=false, ultimoPull=0;
function programarPush(){
  setEstado('pendiente');
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{sincronizar();},2500);
}
async function sincronizar(manual){
  if(SYNC.modo==='local'||sincronizando)return;
  clearTimeout(pushTimer);
  sincronizando=true; setEstado('sync');
  try{
    if(SYNC.modo==='archivo'){
      if(!await fsPermiso(!!manual)){sincronizando=false;setEstado('permiso');return;}
    }
    /* Atajo barato: preguntamos SOLO el numero de version. Si nadie cambio
       nada, se acaba aqui sin bajar la cartera. Es el 95% de las veces, y es
       lo que hace que 10 vendedores no se coman la cuota de transferencia. */
    if(SYNC.modo==='supabase'){
      const rv=await sbRev();
      const base0=SYNC.baseRev||0, lRev0=S.meta.rev||0;
      if(rv!==null&&rv<=base0&&lRev0<=base0){
        SYNC.ultima=nowISO(); SYNC.deskSig=deskSig(); saveSync();
        sincronizando=false; setEstado('ok');
        if(manual)toast('Todo al día');
        return;
      }
      if(rv!==null&&rv<=base0&&lRev0>base0){   /* solo yo cambie: subo y ya */
        await enviar(); sincronizando=false;
        if(manual)toast('Guardado en la nube');
        return;
      }
    }
    const rem = SYNC.modo==='supabase' ? await sbPull()
              : SYNC.modo==='github'   ? await ghPull()
                                       : await fsLeer();

    if(!rem.existe){                       /* primera vez: creamos el archivo */
      await enviar(); sincronizando=false; return;
    }
    const rRev=(rem.datos&&rem.datos.meta&&rem.datos.meta.rev)||0;
    const lRev=S.meta.rev||0, base=SYNC.baseRev||0;

    /* Dispositivo nuevo estrenando la conexión: aquí no hay nada que perder,
       así que se adopta la nube sin molestar con un conflicto. */
    if(vacio(snapshot())&&!vacio(rem.datos)){
      adoptar(rem.datos);
      if(SYNC.modo==='github')SYNC.gh.sha=rem.sha;
      SYNC.baseRev=rRev; SYNC.ultima=nowISO(); SYNC.deskSig=deskSig(); saveSync();
      sincronizando=false; setEstado('ok'); render();
      toast('Datos recuperados de la nube');
      return;
    }
    if(rRev>base&&lRev>base&&!iguales(rem.datos,snapshot())){
      sincronizando=false;
      setEstado('conflicto');
      modalConflicto(rem);
      return;
    }
    if(rRev>base){                         /* la nube va adelante: la adoptamos */
      adoptar(rem.datos);
      if(SYNC.modo==='github')SYNC.gh.sha=rem.sha;
      SYNC.baseRev=rRev; SYNC.ultima=nowISO(); SYNC.deskSig=deskSig(); saveSync();
      sincronizando=false; setEstado('ok'); render();
      if(manual)toast('Actualizado desde la nube');
      return;
    }
    if(lRev>base){ await enviar(rem.sha); sincronizando=false; if(manual)toast('Guardado en la nube'); return; }

    if(SYNC.modo==='github')SYNC.gh.sha=rem.sha;
    SYNC.ultima=nowISO(); SYNC.deskSig=deskSig(); saveSync();
    sincronizando=false; setEstado('ok');
    if(manual)toast('Todo al día');
  }catch(e){
    sincronizando=false;
    if(e&&e.conflicto){setEstado('pendiente');setTimeout(()=>sincronizar(),800);return;}
    setEstado('error',e&&e.message?e.message:String(e));
    if(manual)alert('No se pudo sincronizar.\n\n'+(e&&e.message?e.message:e)+
      '\n\nTus datos siguen guardados en este dispositivo.');
  }
}
async function enviar(sha){
  if(SYNC.modo==='supabase')await sbPush();
  else if(SYNC.modo==='github')await ghPush(sha);
  else await fsEscribir();
  SYNC.baseRev=S.meta.rev; SYNC.ultima=nowISO(); SYNC.deskSig=deskSig(); saveSync();
  setEstado('ok');
}
/* "Vacío" = sin nada que perder: solo el perfil del onboarding.
   Un dispositivo con cotizaciones de Desking NO está vacío. */
function vacio(d){
  if(!d)return true;
  return !((d.clientes||[]).length||(d.leads||[]).length||
           (d.promos||[]).length||(d.tareas||[]).length||nDesk(d.desk));
}
function iguales(a,b){
  try{
    const limpia=o=>{const c=JSON.parse(JSON.stringify(o));delete c.meta;return JSON.stringify(c);};
    return limpia(a)===limpia(b);
  }catch(e){return false;}
}
function adoptar(d){
  if(d&&d.desk)escribirDesk(d.desk);      /* las cotizaciones vuelven a su clave */
  const limpio=Object.assign({},d); delete limpio.desk;
  S=Object.assign(BLANK(),limpio);
  S.cfg=Object.assign(BLANK().cfg,(d&&d.cfg)||{});
  ['clientes','leads','promos','tareas'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];});
  if(!S.meta)S.meta={rev:0,updatedAt:'',device:''};
  saveLocal();
}
function resumen(d){
  const m=(d&&d.meta)||{}, q=nDesk(d&&d.desk);
  return `${(d.clientes||[]).length} clientes · ${(d.leads||[]).length} leads · ${(d.promos||[]).length} programas`+
    (q?` · ${q} negocio${q>1?'s':''}`:'')+
    (m.updatedAt?`<br><span style="color:var(--tx3)">${fDateTime(m.updatedAt)}${m.device?' · '+esc(m.device):''}</span>`:'');
}
function modalConflicto(rem){
  window.__CONF=rem;
  openModal('Dos versiones distintas',
   `<p style="font-size:14.5px;color:var(--tx2);line-height:1.6;margin-bottom:14px">
      Este dispositivo y la nube cambiaron por separado. Elige cuál se queda —
      la otra no se pierde: se descarga como respaldo antes de reemplazarla.</p>
    <div class="card" style="background:var(--bg3);margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px;margin-bottom:6px">
        ${ic('Cloud',14,C.info)}En la nube</div>
      <div style="font-size:14.5px;color:var(--tx2);line-height:1.6">${resumen(rem.datos)}</div></div>
    <div class="card" style="background:var(--bg3)">
      <div style="display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px;margin-bottom:6px">
        ${ic('HardDrive',14,C.p)}En este dispositivo (${esc(SYNC.device)})</div>
      <div style="font-size:14.5px;color:var(--tx2);line-height:1.6">${resumen(snapshot())}</div></div>`,
   `<button class="btn sec" onclick="resolver('nube')">${ic('Cloud')}Usar la nube</button>
    <button class="btn" onclick="resolver('local')">${ic('HardDrive')}Usar este</button>`);
}
async function resolver(cual){
  const rem=window.__CONF; if(!rem)return;
  closeModal();
  bajarJSON(cual==='nube'?snapshot():rem.datos, 'respaldo-descartado-'+today()+'.json');
  try{
    if(cual==='nube'){
      adoptar(rem.datos);
      if(SYNC.modo==='github')SYNC.gh.sha=rem.sha;
      SYNC.baseRev=(rem.datos.meta&&rem.datos.meta.rev)||0;
      SYNC.ultima=nowISO(); SYNC.deskSig=deskSig(); saveSync(); setEstado('ok'); render();
      toast('Se quedó la versión de la nube');
    }else{
      S.meta.rev=Math.max(S.meta.rev||0,(rem.datos.meta&&rem.datos.meta.rev)||0)+1;
      S.meta.updatedAt=nowISO(); S.meta.device=SYNC.device; saveLocal();
      await enviar(rem.sha);
      toast('Se quedó la versión de este dispositivo');
    }
  }catch(e){setEstado('error',e.message);alert('No se pudo aplicar: '+e.message);}
}
function bajarJSON(obj,nombre){
  try{
    const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  }catch(e){}
}

/* ── Cambios hechos por Desking ──
   Desking guarda en su pestaña y no llama a save() del CRM, así que
   comparamos su huella y, si cambió, marcamos el estado como pendiente. */
function revisarDesk(){
  if(SYNC.modo==='local')return false;
  const sig=deskSig();
  if(SYNC.deskSig===undefined||SYNC.deskSig===null){SYNC.deskSig=sig;saveSync();return false;}
  if(sig===SYNC.deskSig)return false;
  S.meta.rev=(S.meta.rev||0)+1;
  S.meta.updatedAt=nowISO();
  S.meta.device=SYNC.device;
  saveLocal();
  programarPush();
  return true;
}
/* El evento 'storage' llega a las OTRAS pestañas del mismo origen:
   cuando Desking guarda, el CRM se entera aquí. */
window.addEventListener('storage',e=>{
  if(!e||e.key!==DK)return;
  if(revisarDesk()&&TAB==='nube')render();
});

/* ── Arranque y disparadores automáticos ── */
async function iniciarSync(){
  if(SYNC.modo==='archivo'){
    try{FH=await idbKV('get');}catch(e){FH=null;}
    if(!FH){SYNC.modo='local';saveSync();setEstado('local');return;}
    if(!await fsPermiso(false)){setEstado('permiso');return;}
  }
  if(SYNC.modo!=='local'){revisarDesk();sincronizar();}
}
document.addEventListener('visibilitychange',()=>{
  if(SYNC.modo==='local')return;
  if(document.visibilityState==='hidden'){ revisarDesk(); if(S.meta.rev>SYNC.baseRev)sincronizar(); }
  else{
    /* Al volver de la pestaña de Desking, recogemos lo que haya guardado */
    revisarDesk();
    if(Date.now()-ultimoPull>20000){ ultimoPull=Date.now(); sincronizar(); }
    revisarTasas();
  }
});
window.addEventListener('online',()=>{if(SYNC.modo!=='local')sincronizar();});
setInterval(()=>{
  if(SYNC.modo!=='local'&&document.visibilityState==='visible'&&!sincronizando){
    revisarDesk();
    ultimoPull=Date.now(); sincronizar();
  }
},120000);
window.addEventListener('beforeunload',e=>{
  if(SYNC.modo!=='local'&&S.meta.rev>SYNC.baseRev){
    e.preventDefault();e.returnValue='Hay cambios sin enviar a la nube.';return e.returnValue;
  }
});

═══════════════════════════════════════════════════════════ */
const SB_URL='https://hecobttjclvtgblincuh.supabase.co';
const SB_KEY='sb_publishable_h27ZCXVeeO7ffcvX7x6JpA_hqDJ3iZU';
const SESK='asm_sesion_v1';

let SES=null;   /* {access_token, refresh_token, expires_at, user:{id,email}, perfil:{}} */
try{const r=localStorage.getItem(SESK);if(r)SES=JSON.parse(r);}catch(e){SES=null;}

/* ── Mensajes del servidor, en cristiano ── */
function msgAuth(j,status){
  const code=(j&&(j.error_code||j.code))||'';
  const m=(j&&(j.msg||j.error_description||j.message||j.error))||'';
  const M={
    invalid_credentials:'Correo o contraseña incorrectos.',
    email_not_confirmed:'Falta confirmar tu correo. Abre el enlace que te mandamos y vuelve a entrar.',
    user_already_exists:'Ese correo ya tiene cuenta. Entra con tu contraseña.',
    email_exists:'Ese correo ya tiene cuenta. Entra con tu contraseña.',
    weak_password:'La contraseña es muy corta. Usa 8 caracteres o más.',
    over_email_send_rate_limit:'Muchos correos seguidos. Espera unos minutos y reintenta.',
    over_request_rate_limit:'Demasiados intentos. Espera un minuto.',
    signup_disabled:'El registro está cerrado. Pídele a Eduardo que te dé de alta.',
    user_banned:'Esta cuenta está bloqueada. Habla con Eduardo.'
  };
  if(M[code])return M[code];
  if(/already registered|already been registered/i.test(m))return 'Ese correo ya tiene cuenta. Entra con tu contraseña.';
  if(/password should be at least/i.test(m))return 'La contraseña es muy corta. Usa 8 caracteres o más.';
  if(/invalid.*email|email.*invalid/i.test(m))return 'Ese correo no parece válido.';
  return m||('Error del servidor ('+status+').');
}

/* ── /auth/v1 ── */
async function sbAuth(ruta,body,metodo){

  return j;
}

/* ── Token vivo (refresca solo, una vez a la vez) ── */
let refrescando=null;
async function sbToken(){
  if(!SES||!SES.refresh_token)return null;
  if(SES.access_token&&SES.expires_at&&Date.now()<SES.expires_at-60000)return SES.access_token;
  if(!refrescando){
    refrescando=(async()=>{
      try{
        const j=await sbAuth('/token?grant_type=refresh_token',{refresh_token:SES.refresh_token});
        adoptarSesion(j);
        return SES.access_token;
      }catch(e){
        /* Solo se mata la sesión si el SERVIDOR la rechazó. Si fue falta de
           internet, la sesión sigue viva y la app trabaja con la caché. */
        if(e&&e.status&&e.status<500)sesionMuerta();
        throw e;
      }finally{refrescando=null;}
    })();
  }
  return refrescando;
}
function adoptarSesion(j){
  if(!j||!j.access_token)return false;
  const antes=SES||{};
  SES={
    access_token:j.access_token,
    refresh_token:j.refresh_token||antes.refresh_token||'',
    expires_at:Date.now()+((num(j.expires_in)||3600)*1000),
    user:{id:(j.user&&j.user.id)||(antes.user&&antes.user.id)||'',
          email:(j.user&&j.user.email)||(antes.user&&antes.user.email)||''},
    perfil:antes.perfil||null
  };
  guardarSes();
  return true;
}

/* ── /rest/v1 ── */
async function sbRest(ruta,opts){
  opts=opts||{};
  const tk=await sbToken();
  if(!tk)throw new Error('Sesión cerrada. Entra otra vez.');
  const pide=async(token)=>{
    const h={'apikey':SB_KEY,'Authorization':'Bearer '+token};
    if(opts.prefer)h['Prefer']=opts.prefer;
    if(opts.body)h['Content-Type']='application/json';
    try{
      return await fetch(SB_URL+'/rest/v1'+ruta,{method:opts.method||'GET',headers:h,
        body:opts.body?JSON.stringify(opts.body):undefined,cache:'no-store'});
    }catch(e){throw errRed();}
  };
  let r=await pide(tk);
  if(r.status===401&&SES){                 /* venció antes de tiempo */
    SES.expires_at=0;guardarSes();
    const tk2=await sbToken();
    if(!tk2)throw new Error('Sesión cerrada. Entra otra vez.');
    r=await pide(tk2);
  }
  if(!r.ok){
    let d='';try{const j=await r.json();d=j.message||j.msg||j.hint||'';}catch(e){}
    throw new Error('Servidor '+r.status+(d?': '+d:''));
  }
  if(r.status===204)return null;
  const t=await r.text();
  return t?JSON.parse(t):null;
}

/* ═══ SINCRONIZACIÓN CON LAS TABLAS ═══
   books.data ← asm_libro_v1   ·   desks.data ← asm_desk_v1
   Las dos filas comparten el contador S.meta.rev, el mismo que el
   orquestador ya usaba para detectar conflictos entre dispositivos. */
/* Solo el numero de version: unos pocos bytes en vez del libro entero.
   Con esto la comprobacion cada 2 minutos deja de descargar toda la cartera. */
async function sbRev(){
  const r=await sbRest('/books?select=rev&user_id=eq.'+encodeURIComponent(miId()));
  return (r&&r[0])?num(r[0].rev):null;
}
async function sbPull(){
  const id=encodeURIComponent(miId());
  const [b,d]=await Promise.all([
    sbRest('/books?select=data,rev,updated_at&user_id=eq.'+id),
    sbRest('/desks?select=data,rev&user_id=eq.'+id)
  ]);
  const fb=(b&&b[0])||null, fd=(d&&d[0])||null;
  const libro=fb&&fb.data&&Object.keys(fb.data).length?fb.data:null;
  if(!libro)return {existe:false};
  const datos=JSON.parse(JSON.stringify(libro));
  if(fd&&fd.data&&Object.keys(fd.data).length)datos.desk=fd.data;
  if(!datos.meta||typeof datos.meta!=='object')datos.meta={rev:0,updatedAt:'',device:''};
  /* La columna rev manda: es lo que se compara contra baseRev. */
  datos.meta.rev=Math.max(num(fb.rev),num(datos.meta.rev));
  return {existe:true,rev:num(fb.rev),datos:datos};
}
async function sbPush(){

/* ── Volver de un enlace de correo: el token llega en el # ── */
async function revisarEnlace(){
  const h=String(location.hash||'').replace(/^#/,'');
  if(!h||(h.indexOf('access_token')<0&&h.indexOf('error')<0))return false;
  const p={};
  h.split('&').forEach(kv=>{const i=kv.indexOf('=');
    if(i>0)p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));});
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(p.error_description||p.error){
    const T={otp_expired:'Ese enlace ya venció. Pide otro con "Olvidé mi contraseña".',
             access_denied:'Ese enlace ya se usó o venció. Pide otro con "Olvidé mi contraseña".'};
    AUERR=T[p.error_code]||T[p.error]||p.error_description||p.error;
    return false;
  }
  if(!p.access_token||!p.refresh_token)return false;
  adoptarSesion({access_token:p.access_token,refresh_token:p.refresh_token,
    expires_in:num(p.expires_in)||3600});
  return p.type||'sesion';
}

/* ═══ TASAS DE BANCOS — centralizadas ═══
   Eduardo las publica cada ~15 días y todos los vendedores las reciben
   solas. El vendedor no tiene que hacer nada: al entrar, las tasas
   aparecen ya puestas en su Desking.
   Se escriben en la misma clave que Desking ya lee (asm_desk_v1),
   así que Desking no cambia por dentro. */
const DIAS_TASAS=15;
let TASAS={data:[],fecha:'',actualizado:null,cargado:false,err:''};

/* Chequeo silencioso: cada 2 días y cada vez que vuelve del segundo plano,
   sin decir nada ni mostrar nada. Si cambió algo, se refresca solo. */
const TASAS_CADA=2*24*60*60*1000;
function tocaRevisarTasas(){
  const u=num(localStorage.getItem('asm_tasas_chk')||0);
  return !u || (Date.now()-u)>TASAS_CADA;
}
async function revisarTasas(forzar){
  if(!SES||(!forzar&&!tocaRevisarTasas()))return false;
  try{localStorage.setItem('asm_tasas_chk',String(Date.now()));}catch(e){}
  return await bajarTasas();
}

async function bajarTasas(){
  try{
    const r=await sbRest('/tasas?select=data,fecha,actualizado&id=eq.1');
    const t=(r&&r[0])||null;
    if(!t)return false;
    TASAS={data:t.data||[],fecha:t.fecha||'',actualizado:t.actualizado,cargado:true,err:''};
    if(!TASAS.data.length)return false;
    /* MEZCLA, nunca reemplazo. Solo se actualizan las tasas de los bancos
       que ya tiene y se agregan los que falten. Un banco que el vendedor
       tenga en su lista NUNCA se le quita desde el servidor. */
    const d=leerDesk()||{};
    const local=Array.isArray(d.bancos)?d.bancos:[];
    const clave=b=>String(b&&b.n||'').trim().toLowerCase();
    const porNombre={};
    local.forEach(b=>{porNombre[clave(b)]=b;});
    TASAS.data.forEach(srv=>{
      const k=clave(srv); if(!k)return;
      const mio=porNombre[k];
      if(mio){ mio.an=srv.an; mio.au=srv.au;
        if(srv.nota)mio.nota=srv.nota; if(srv.w)mio.w=srv.w; if(srv.g)mio.g=srv.g; }
      else { local.push(JSON.parse(JSON.stringify(srv))); porNombre[k]=srv; }
    });
    d.bancos=local;
    if(TASAS.fecha)d.bancosFecha=TASAS.fecha;
    escribirDesk(d);
    /* no es un cambio del vendedor: que no dispare una subida */
    SYNC.deskSig=deskSig();saveSync();
    return true;
  }catch(e){TASAS.err=e&&e.message?e.message:String(e);return false;}
}
function diasDesdeTasas(){
  if(!TASAS.actualizado)return null;
  return dias(hoy(),new Date(String(TASAS.actualizado).slice(0,10)+'T00:00:00'));
}

/* ═══ EQUIPO ═══
   Asociarse es opcional. Uno queda de jefe y ve el desempeño de los suyos:
   unidades, leads, cierre y tareas. El dinero de cada vendedor NO sale del
   servidor — la función equipo_resumen() ni siquiera lo devuelve.
   Cada vendedor sigue siendo dueño de su libro y se lo lleva si se va. */
const PODIO=['#f5c518','#c0c7d0','#cd7f32'];
let EQ={cargado:false,equipo:null,miRol:null,miembros:[],resumen:[],invitaciones:[],err:''};

async function cargarEquipo(forzar){
  if(EQ.cargado&&!forzar)return;
  EQ.err='';
  try{
    const correo=(SES&&SES.user&&SES.user.email)||'';
    const [mios,invs]=await Promise.all([
      sbRest('/team_members?select=id,team_id,rol,estado,teams(id,nombre,manager_id)&user_id=eq.'+encodeURIComponent(miId())+'&estado=eq.activo'),
      correo?sbRest('/team_members?select=id,team_id,correo,rol,estado,teams(id,nombre,manager_id)&estado=eq.invitado&correo=ilike.'+encodeURIComponent(correo)):Promise.resolve([])
    ]);
    EQ.invitaciones=invs||[];
    const mio=(mios&&mios[0])||null;
    if(!mio){EQ.equipo=null;EQ.miRol=null;EQ.miembros=[];EQ.resumen=[];EQ.cargado=true;return;}
    EQ.equipo=mio.teams||{id:mio.team_id,nombre:'Mi equipo'};
    EQ.miRol=mio.rol;
    const [ms,rs]=await Promise.all([
      sbRest('/team_members?select=id,user_id,correo,rol,estado&team_id=eq.'+encodeURIComponent(mio.team_id)),
      sbRest('/rpc/equipo_resumen',{method:'POST',body:{}})
    ]);
    EQ.miembros=ms||[]; EQ.resumen=rs||[];
  }catch(e){EQ.err=e&&e.message?e.message:String(e);}
  EQ.cargado=true;
}

function modalCrearEquipo(){
  openModal('Crear tu equipo',
   `<div class="fr"><label class="f">Nombre del equipo</label>
      <input class="inp" id="eqNombre" placeholder="Equipo Carlos" value="${esc((SES&&SES.perfil&&SES.perfil.nombre)?'Equipo '+SES.perfil.nombre.split(' ')[0]:'Mi equipo')}"></div>
    <p style="font-size:14.5px;color:var(--tx2);line-height:1.7;margin-top:12px">
      Quedas como <b style="color:var(--tx)">jefe de equipo</b>. Podrás ver las unidades, leads,
      cierre y tareas de quien acepte tu invitación — nunca su dinero ni sus clientes.</p>`,
   `<button class="btn sec" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="crearEquipo()">${ic('Plus')}Crear</button>`);
}
async function crearEquipo(){
  const nombre=$('eqNombre').value.trim()||'Mi equipo';
  try{
    const t=await sbRest('/teams',{method:'POST',prefer:'return=representation',
      body:{nombre:nombre,manager_id:miId()}});
    const eq=t&&t[0];
    if(!eq)throw new Error('El servidor no creó el equipo.');
    await sbRest('/team_members',{method:'POST',prefer:'return=minimal',
      body:{team_id:eq.id,user_id:miId(),correo:(SES.user&&SES.user.email)||'',
            rol:'manager',estado:'activo',unido_en:nowISO()}});
    closeModal();EQ.cargado=false;toast('Equipo creado');render();
  }catch(e){alert('No se pudo crear:\n\n'+(e&&e.message?e.message:e));}
}
async function invitarAlEquipo(){
  const correo=$('eqMail').value.trim().toLowerCase();
  const nom=$('eqNom').value.trim(), wa=$('eqWa').value.trim();
  if(!correo||correo.indexOf('@')<1){alert('Pon el correo con el que entra al CRM.');return;}
  try{
    await sbRest('/team_members',{method:'POST',prefer:'return=minimal',
      body:{team_id:EQ.equipo.id,correo:correo,rol:'vendedor',estado:'invitado'}});
    EQ.cargado=false;
    if(wa&&tel10(wa).length>=11){
      const jefe=(SES&&SES.perfil&&SES.perfil.nombre)?SES.perfil.nombre.split(' ')[0]:'';
      openMsg('Invitar a '+(nom||correo), wa,
        'Hola '+(nom||'')+' 👋'+(jefe?' Soy '+jefe+'.':'')+'\n\n'+
        'Te invité a mi equipo en el CRM. Entra con '+correo+' y acepta la invitación en la sección Equipo:\n'+
        LINK_APP+'\n\n'+
        'Tu libro sigue siendo tuyo — yo solo veo unidades, leads y tareas, no tu dinero.');
    }else{
      toast('Invitación enviada');
    }
    render();
  }catch(e){
    const m=(e&&e.message)||'';
    alert(/duplicate|unique/i.test(m)
      ? 'Ya invitaste a ese correo a este equipo.'
      : 'No se pudo invitar:\n\n'+m);
  }
}
async function aceptarInvitacion(id){
  try{
    const r=await sbRest('/team_members?id=eq.'+encodeURIComponent(id),
      {method:'PATCH',prefer:'return=representation',
       body:{user_id:miId(),estado:'activo',unido_en:nowISO()}});
    if(!r||!r.length)throw new Error('El servidor no aceptó la invitación.');
    EQ.cargado=false;toast('Bienvenido al equipo');render();
  }catch(e){
    const m=(e&&e.message)||'';
    alert(/duplicate|unique|tm_un_equipo/i.test(m)
      ? 'Ya estás en otro equipo.\n\nSálete de ese primero y vuelve a aceptar.'
      : 'No se pudo aceptar:\n\n'+m);
  }
}
async function rechazarInvitacion(id){
  if(!confirm('¿Rechazar la invitación?'))return;
  try{ await sbRest('/team_members?id=eq.'+encodeURIComponent(id),{method:'DELETE',prefer:'return=minimal'});}
  catch(e){}
  EQ.cargado=false;toast('Invitación rechazada');render();
}
async function cancelarInvitacion(id){
  try{ await sbRest('/team_members?id=eq.'+encodeURIComponent(id),{method:'DELETE',prefer:'return=minimal'});}
  catch(e){alert('No se pudo cancelar: '+(e&&e.message?e.message:e));return;}
  EQ.cargado=false;toast('Invitación cancelada');render();
}
async function sacarDelEquipo(uid,nombre){
  if(!confirm('¿Sacar a '+(nombre||'este vendedor')+' del equipo?\n\nSe lleva su libro completo y dejas de ver sus números. No se borra nada suyo.'))return;
  try{
    await sbRest('/team_members?team_id=eq.'+encodeURIComponent(EQ.equipo.id)+'&user_id=eq.'+encodeURIComponent(uid),
      {method:'DELETE',prefer:'return=minimal'});
    EQ.cargado=false;toast('Fuera del equipo');render();
  }catch(e){alert('No se pudo: '+(e&&e.message?e.message:e));}
}
async function pedirSalida(retirar){
  if(!retirar&&!confirm(`¿Pedirle al jefe que te deje salir del equipo?

Cuando lo autorice, te llevas tu libro completo.`))return;
  try{
    const r=await sbRest('/team_members?team_id=eq.'+encodeURIComponent(EQ.equipo.id)+'&user_id=eq.'+encodeURIComponent(miId()),
      {method:'PATCH',prefer:'return=representation',body:{salida_pedida:retirar?null:nowISO()}});
    if(!r||!r.length)throw new Error('El servidor no registró la solicitud.');
    EQ.cargado=false;toast(retirar?'Solicitud retirada':'Solicitud enviada al jefe');render();
  }catch(e){alert('No se pudo: '+(e&&e.message?e.message:e));}
}
async function negarSalida(uid){
  try{
    await sbRest('/team_members?team_id=eq.'+encodeURIComponent(EQ.equipo.id)+'&user_id=eq.'+encodeURIComponent(uid),
      {method:'PATCH',prefer:'return=minimal',body:{salida_pedida:null}});
    EQ.cargado=false;toast('Solicitud negada');render();
  }catch(e){alert('No se pudo: '+(e&&e.message?e.message:e));}
}
async function salirDelEquipo(){
  const soyJefe=EQ.miRol==='manager';
  if(!confirm(soyJefe
    ? '¿Disolver el equipo?\n\nSe deshace para todos. Cada quien se queda con su libro completo — no se borra nada de nadie.'
    : '¿Salirte del equipo?\n\nTe llevas tu libro entero y el jefe deja de ver tus números.'))return;
  try{
    if(soyJefe){ await sbRest('/teams?id=eq.'+encodeURIComponent(EQ.equipo.id),{method:'DELETE',prefer:'return=minimal'}); }
    else { await sbRest('/team_members?team_id=eq.'+encodeURIComponent(EQ.equipo.id)+'&user_id=eq.'+encodeURIComponent(miId()),
      {method:'DELETE',prefer:'return=minimal'}); }
    EQ.cargado=false;toast(soyJefe?'Equipo disuelto':'Saliste del equipo');render();
  }catch(e){alert('No se pudo: '+(e&&e.message?e.message:e));}
}

/* ═══ IMPORTAR CLIENTES DESDE EXCEL / CSV ═══
   El vendedor sube lo que exportó de su CRM viejo. La app reconoce las
   columnas sola, deja corregirlas, avisa de los repetidos y solo entonces
   importa. Nada entra sin que lo vea antes. */

/* ── Los campos nuestros y cómo se llaman en otros sistemas ── */
const CAMPOS_IMP=[
  {k:'',      t:'— no importar —'},
  {k:'nom',   t:'Nombre',        a:['nombre','first name','firstname','first','primer nombre','cliente','customer','nombre del cliente','name']},
  {k:'nombreCompleto',t:'Nombre completo (se parte)',a:['nombre completo','full name','fullname','nombre y apellido','customer name','client name']},
  {k:'apellido',t:'Apellidos',   a:['apellido','apellidos','last name','lastname','last','surname','apellido paterno']},
  {k:'tel',   t:'Teléfono',      a:['telefono','teléfono','phone','cell','cellphone','mobile','celular','tel','phone number','cell phone','movil','móvil','contacto']},
  {k:'email', t:'Correo',        a:['correo','email','e-mail','mail','correo electronico','correo electrónico','email address']},
  {k:'dir',   t:'Dirección',     a:['direccion','dirección','address','street','domicilio','address 1','street address','calle']},
  {k:'marca', t:'Marca',         a:['marca','make','brand','fabricante']},
  {k:'mod',   t:'Modelo',        a:['modelo','model','vehiculo','vehículo','vehicle']},
  {k:'ano',   t:'Año',           a:['año','ano','year','yr','model year']},
  {k:'stock', t:'Stock #',       a:['stock','stock #','stock number','stock no','inventario']},
  {k:'vin',   t:'VIN',           a:['vin','vin number','vin #','serial','numero de serie','número de serie']},
  {k:'agencia',t:'Agencia de seguro',a:['agencia','seguro','insurance','aseguradora','insurance agency','agencia de seguro']},
  {k:'tipo',  t:'Tipo (lease/finance/cash)',a:['tipo','type','deal type','tipo de negocio','financing','financiamiento']},
  {k:'fecha', t:'Mes de venta',  a:['fecha','fecha de venta','sale date','sold date','delivery date','date sold','fecha entrega','date','deal date','purchase date']},
  {k:'plazo', t:'Plazo (meses)', a:['plazo','term','meses','months','term months','plazo meses']},
  {k:'cumple',t:'Cumpleaños',    a:['cumpleaños','cumpleanos','birthday','dob','date of birth','fecha de nacimiento','nacimiento']},
  {k:'notas', t:'Notas',         a:['notas','notes','comments','comentarios','observaciones','remarks','comment']}
];
const normCab=s=>String(s||'').trim().toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

function adivinarCampo(cabecera){
  const c=normCab(cabecera); if(!c)return '';
  for(const f of CAMPOS_IMP){
    if(!f.a)continue;
    if(f.a.some(x=>normCab(x)===c))return f.k;
  }
  for(const f of CAMPOS_IMP){
    if(!f.a)continue;
    if(f.a.some(x=>{const n=normCab(x);return n.length>3&&(c.includes(n)||n.includes(c));}))return f.k;
  }
  return '';
}

/* ── Lector de CSV que aguanta comillas, comas dentro y saltos de línea ── */
function leerCSV(txt){
  txt=String(txt||'').replace(/^﻿/,'');
  const cand=[',',';','\t','|'];
  const primera=txt.split(/\r?\n/)[0]||'';
  let sep=',',mejor=-1;
  cand.forEach(s=>{const n=(primera.split(s).length-1);if(n>mejor){mejor=n;sep=s;}});
  const filas=[];let campo='',fila=[],comillas=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(comillas){
      if(ch==='"'){ if(txt[i+1]==='"'){campo+='"';i++;} else comillas=false; }
      else campo+=ch;
    }else{
      if(ch==='"')comillas=true;
      else if(ch===sep){fila.push(campo);campo='';}
      else if(ch==='\n'){fila.push(campo);filas.push(fila);fila=[];campo='';}
      else if(ch==='\r'){/* nada */}
      else campo+=ch;
    }
  }
  if(campo!==''||fila.length){fila.push(campo);filas.push(fila);}
  return filas.filter(f=>f.some(c=>String(c).trim()!==''));
}

/* ── Excel de verdad: se carga la librería solo si hace falta ── */
function cargarXLSX(){
  if(window.XLSX)return Promise.resolve(true);
  return new Promise(res=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>res(!!window.XLSX);
    s.onerror=()=>res(false);
    document.head.appendChild(s);
  });
}

let IMP=null;   /* {cabeceras, filas, mapa, nombreArchivo} */

function abrirImportador(){ $('impCsv').click(); }

async function importarArchivo(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f)return;
  ev.target.value='';
  try{
    let filas=null;
    if(/\.(xlsx|xls)$/i.test(f.name)){
      toast('Leyendo el Excel…');
      const listo=await cargarXLSX();
      if(!listo){
        alert(['No pude cargar el lector de Excel (¿sin internet?).','',
          'Solución rápida: en Excel usa Archivo → Guardar como → CSV y sube ese archivo.'].join('\n'));
        return;
      }
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const hoja=wb.Sheets[wb.SheetNames[0]];
      filas=XLSX.utils.sheet_to_json(hoja,{header:1,raw:false,defval:''});
      filas=filas.filter(r=>r.some(c=>String(c).trim()!==''));
    }else{
      const txt=await f.text();
      filas=leerCSV(txt);
    }
    if(!filas||filas.length<2){
      alert('El archivo no tiene filas que importar.\n\nNecesita una fila de títulos y al menos un cliente.');
      return;
    }
    const cabeceras=filas[0].map(c=>String(c).trim());
    IMP={nombreArchivo:f.name, cabeceras:cabeceras, filas:filas.slice(1),
         mapa:cabeceras.map(c=>adivinarCampo(c))};
    /* si no hay nombre pero sí nombre completo, ya está resuelto */
    modalImportar();
  }catch(e){
    alert('No pude leer el archivo:\n\n'+(e&&e.message?e.message:e));
  }
}

function filaAcliente(fila){
  const d={};
  IMP.mapa.forEach((k,i)=>{
    if(!k)return;
    const v=String(fila[i]==null?'':fila[i]).trim();
    if(!v)return;
    if(k==='nombreCompleto'){
      const p=v.split(/\s+/);
      d.nom=d.nom||p[0]||'';
      if(p.length>1)d.apellido=d.apellido||p.slice(1).join(' ');
    }else d[k]=v;
  });
  if(d.tel)d.tel=String(d.tel).replace(/[^\d+]/g,'');
  if(d.email)d.email=d.email.toLowerCase();
  if(d.vin)d.vin=d.vin.toUpperCase().replace(/\s/g,'');
  if(d.stock)d.stock=d.stock.toUpperCase();
  if(d.plazo)d.plazo=num(d.plazo);
  if(d.ano)d.ano=String(num(d.ano)||'');
  if(d.tipo){
    const t=normCab(d.tipo);
    d.tipo=/lease|arrend/.test(t)?'lease':/cash|contado|efectivo/.test(t)?'cash':'finance';
  }
  if(d.fecha)d.fecha=aMesVenta(d.fecha);
  if(d.cumple)d.cumple=aFechaISO(d.cumple);
  return d;
}
function aMesVenta(v){
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-/](\d{1,2})/);            if(m)return m[1]+'-'+String(m[2]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);   if(m)return m[3]+'-'+String(m[1]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[-/](\d{4})$/);               if(m)return m[2]+'-'+String(m[1]).padStart(2,'0');
  const d=new Date(s);
  return isNaN(d)?'':mesLocal(d);
}
function aFechaISO(v){
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
  if(m)return m[3]+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
  const d=new Date(s);
  return isNaN(d)?'':fechaLocal(d);
}

function analizarImport(){
  const buenos=[],sinDatos=[],repetidosArchivo=[],yaEnLibro=[];
  const vistos=[];
  IMP.filas.forEach((fila,idx)=>{
    const d=filaAcliente(fila);
    if(!d.nom&&!d.apellido){sinDatos.push({idx,motivo:'sin nombre'});return;}
    if(!d.tel){sinDatos.push({idx,motivo:'sin teléfono',nom:(d.nom||'')+' '+(d.apellido||'')});return;}
    const enLibro=buscarDuplicado(S.clientes,d,null);
    if(enLibro){yaEnLibro.push({d,campo:enLibro.campo});return;}
    const enArchivo=buscarDuplicado(vistos,d,null);
    if(enArchivo){repetidosArchivo.push({d,campo:enArchivo.campo});return;}
    d.id=uid('c'); d.createdAt=nowISO();
    vistos.push(d); buenos.push(d);
  });
  return {buenos,sinDatos,repetidosArchivo,yaEnLibro};
}

  return (d>=0&&d<=7)?d:null;
}

/* El texto que el vendedor pega en sus redes, con SU número */
function textoRedes(n,en){
  const d=n.data||{};
  const veh=[d.ano,d.marca,d.modelo,d.trim].filter(Boolean).join(' ');
  const wa=miWa();
  const L=[];
  L.push('🚗 '+(veh||n.titulo));
  if(en){
    if(d.tipo==='lease'){
      if(d.pago)L.push(fm(d.pago)+'/mo + tax');
      if(d.alFirmar)L.push(fm(d.alFirmar)+' due at signing');
      const t=[]; if(d.plazo)t.push(d.plazo+' months');
      if(d.millas)t.push(Number(d.millas).toLocaleString('en-US')+' miles/year');
      if(t.length)L.push(t.join(' · '));
    }else if(d.tipo==='finance'){
      if(d.pago)L.push(fm(d.pago)+'/mo');
      if(d.alFirmar)L.push(fm(d.alFirmar)+' down');
      if(d.plazo)L.push(d.plazo+' months');
      if(d.apr)L.push(d.apr+'% APR');
    }else if(d.precio){L.push(fm(d.precio)+' cash');}
    if(d.condiciones)L.push(d.condiciones);
    if(n.vence)L.push('Through '+fDateEN(String(n.vence).slice(0,10)));
    L.push('');
    L.push(wa?'Message me and I will tell you if you qualify 👉 wa.me/'+wa
             :'Message me and I will tell you if you qualify');
    return L.join(String.fromCharCode(10));
  }
  if(d.tipo==='lease'){
    if(d.pago)L.push(fm(d.pago)+'/mes + tax');
    if(d.alFirmar)L.push(fm(d.alFirmar)+' al firmar');
    const t=[]; if(d.plazo)t.push(d.plazo+' meses');
    if(d.millas)t.push(Number(d.millas).toLocaleString('en-US')+' millas/año');
    if(t.length)L.push(t.join(' · '));
  }else if(d.tipo==='finance'){
    if(d.pago)L.push(fm(d.pago)+'/mes');
    if(d.alFirmar)L.push(fm(d.alFirmar)+' de entrada');
    if(d.plazo)L.push(d.plazo+' meses');
    if(d.apr)L.push(d.apr+'% APR');
  }else if(d.precio){L.push(fm(d.precio)+' de contado');}
  if(d.condiciones)L.push(d.condiciones);
  if(n.vence)L.push('Hasta el '+fDate(String(n.vence).slice(0,10)));
  L.push('');
  L.push('Escríbeme y te digo si calificas 👉 wa.me/'+wa);
  return L.join('\n');
}

async function publicarNovedad(){
  const tipo=$('nvTipo').value;
  const alcance=$('nvAlcance').value;
  const titulo=$('nvTitulo').value.trim();
  const v=id=>$(id)?$(id).value.trim():'';
  const data={};
  if(tipo==='tasas'||tipo==='aviso'){ data.condiciones=v('nvCond'); }
  else{
    data.ano=v('nvAno'); data.marca=v('nvMarca'); data.modelo=v('nvModelo'); data.trim=v('nvTrim');
    data.tipo=$('nvNeg')?$('nvNeg').value:'lease';
    if(data.tipo==='cash')data.precio=num(v('nvPrecio'));
    else{
      data.pago=num(v('nvPago')); data.alFirmar=num(v('nvFirmar')); data.plazo=num(v('nvPlazo'));
      if(data.tipo==='lease')data.millas=num(v('nvMillas')); else data.apr=v('nvApr');
    }
    data.condiciones=v('nvCond');
    /* la regla de la casa: el numero completo */
    if(data.tipo==='lease'&&data.pago&&(!data.alFirmar||!data.plazo||!data.millas)){
      if(!confirm(['Falta parte del número: al firmar, plazo o millas.','',
        'La regla de la casa es dar el número completo — es lo que evita que el cliente se sienta engañado.','',
        '¿Publicar así de todos modos?'].join('\n')))return;
    }
  }
  if(!titulo&&!data.marca){alert('Ponle al menos un título o el vehículo.');return;}
  const body={alcance:alcance, autor:miId(), tipo:tipo, titulo:titulo,
    data:data, vence:v('nvVence')||null};
  if(alcance==='equipo'){
    if(!EQ.equipo){alert('No tienes equipo al que publicar.');return;}
    body.team_id=EQ.equipo.id;
  }
  try{
    const r=await sbRest('/comunicados',{method:'POST',prefer:'return=representation',body:body});
    if(!r||!r.length)throw new Error('El servidor no aceptó la publicación.');
    closeModal();NOVBASE=null;NOV.cargado=false;toast('Publicado — ya lo ve tu gente');render();
  }catch(e){
    alert('No se pudo publicar:\n\n'+(e&&e.message?e.message:e)+
      '\n\nSi dice 403: solo el jefe de equipo publica para su equipo, y solo el admin para todos.');
  }
}

function formatoSSN(i){
  let d=String(i.value||'').replace(/\D/g,'').slice(0,9);
  i.value = d.length>5 ? d.slice(0,3)+'-'+d.slice(3,5)+'-'+d.slice(5)
          : d.length>3 ? d.slice(0,3)+'-'+d.slice(3)
          : d;
}

/* ── El documento ── */
function imprimirCredito(){
  const l=L(); if(!l)return;
  const ssn1=$('ssn1')?$('ssn1').value.trim():'';
  const ssn2=$('ssn2')?$('ssn2').value.trim():'';
  const dob=$('dob1')?$('dob1').value:'';
  if(ssn1&&ssn1.replace(/\D/g,'').length!==9){
    alert('El Social necesita 9 dígitos, o déjalo en blanco para llenarlo a mano.');return;}
  /* la fecha de nacimiento sí se guarda; el Social no toca S en ningún momento */
  if(dob&&(!l.perfil.nacimiento||l.perfil.nacimiento!==dob)){
    l.perfil.nacimiento=dob; l.updatedAt=nowISO(); save();
  }
  const html=docCredito(l,ssn1,ssn2);
  const cont=$('impresion');
  cont.innerHTML=html;
  closeModal();
  const limpiar=()=>{cont.innerHTML='';window.removeEventListener('afterprint',limpiar);};
  window.addEventListener('afterprint',limpiar);
  setTimeout(()=>{window.print();
    /* por si el navegador no dispara afterprint (iOS a veces) */
    setTimeout(limpiar,60000);},120);
}

function docCredito(l,ssn1,ssn2){
  const p=l.perfil||{}, co=p.co||{}, f=finanzas(l);
  const veh=[l.veh&&l.veh.ano,l.veh&&l.veh.marca,l.veh&&l.veh.mod].filter(Boolean).join(' ');

  const fila=(a,b)=>`<tr><td class="et">${esc(a)}</td><td class="va">${b==null||b===''?'&nbsp;':esc(String(b))}</td></tr>`;
  const persona=(nom,ape,ssn,dob,tel,mail,lic)=>`
    <table class="t">
      ${fila('Nombre completo',[nom,ape].filter(Boolean).join(' '))}
