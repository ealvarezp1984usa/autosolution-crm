      ${kpi('TrendingUp','Conversión',rate+'%','Cierre sobre leads',C.p)}
      ${kpi('DollarSign','Gross total',fm(gross),'Front + back',C.warn)}
      ${kpi('AlertCircle','Tareas vencidas',venc.length,'Requieren acción',venc.length?C.dan:C.tx3)}
    </div>
    <div class="grid1">
      <div class="card">
        <div style="font-weight:700;font-size:13px;margin-bottom:13px">Conversión por canal de origen</div>
        ${src.length?src.map(x=>`<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
            <span style="color:var(--tx2)">${x.o}</span>
            <span><span style="color:var(--tx3)">${x.sc}/${x.c}</span> · <span style="color:var(--p);font-weight:700">${x.r}%</span></span></div>
          <div style="height:6px;border-radius:99px;background:var(--bg3);overflow:hidden">
            <div style="height:100%;background:var(--p);border-radius:99px;width:${Math.max(2,x.r)}%"></div></div></div>`).join('')
          :`<div style="color:var(--tx3);font-size:12px">Sin datos todavía. Aparece cuando registres leads.</div>`}
      </div>
      <div class="card">
        <div style="font-weight:700;font-size:13px;margin-bottom:13px">Embudo de conversión</div>
        ${ETAPAS.map(e=>{const n=vis.filter(l=>ETAPAS[l.etapa]===e).length;
          return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">

            <div style="flex:1;height:6px;background:var(--bg3);border-radius:99px;overflow:hidden">
              <div style="height:100%;background:${ETAPA_C[e]};border-radius:99px;width:${vis.length?n/vis.length*100:0}%"></div></div>
            <span style="font-size:11px;font-weight:700;color:${ETAPA_C[e]};min-width:18px;text-align:right">${n}</span></div>`;}).join('')}
      </div>
    </div>
    <div class="card">
      <div style="font-weight:700;font-size:13px;margin-bottom:13px">Composición de tu libro</div>
      ${S.clientes.length?[['Lease',lease,'#F87171'],['Financiado',fin,C.warn],['Cash',cash,C.ok]].map(r=>
        `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="font-size:12px;color:var(--tx2);min-width:78px">${r[0]}</span>
          <div style="flex:1;height:6px;background:var(--bg3);border-radius:99px;overflow:hidden">

          <span style="font-size:11px;font-weight:700;color:${r[2]};min-width:18px;text-align:right">${r[1]}</span></div>`).join('')

};

/* ═══ VISTA · ADMIN (solo rol=admin) — vista admin_resumen ═══ */
VIEWS.admin=function(){
  if(!esAdmin())return soonView('admin');
  if(ADM.estado==='')setTimeout(()=>cargarAdmin(),0);

  const F=ADM.filas||[];
  const dHoy=hoy();
  const dGratis=f=>f.gratis_hasta?dias(new Date(String(f.gratis_hasta).slice(0,10)+'T00:00:00'),dHoy):null;
  const planUI=f=>{
    if(f.plan==='activo')return{c:C.ok,t:'Activo'};
    if(f.plan==='pausado')return{c:C.dan,t:'Pausado'};
    const d=dGratis(f);
    if(d===null)return{c:C.tx3,t:'Gratis'};
    if(d<0)return{c:C.dan,t:'Prueba vencida'};
    return{c:d<=7?C.warn:C.info,t:'Prueba · '+d+'d'};
  };
  const vend=F.filter(f=>f.rol!=='admin');
  const nAct=F.filter(f=>f.plan==='activo').length;
  const nPrueba=F.filter(f=>f.plan==='gratis'&&dGratis(f)!==null&&dGratis(f)>=0).length;
  const nVenc=F.filter(f=>f.plan==='gratis'&&dGratis(f)!==null&&dGratis(f)<0).length;
  const totCli=F.reduce((s,f)=>s+num(f.clientes),0);

  let cuerpo;
  if(ADM.estado==='cargando'||ADM.estado===''){
    cuerpo=`<div class="card" style="text-align:center;padding:28px;color:var(--tx3);font-size:12.5px">
      Cargando cuentas…<span class="spin"></span></div>`;

async function conectarGitHub(){
  const g={owner:$('ghOwner').value.trim(),repo:$('ghRepo').value.trim(),
    branch:$('ghBranch').value.trim()||'main',path:$('ghPath').value.trim()||'datos/autosolution-crm.json',
    token:$('ghToken').value.trim(),sha:''};
  if(!g.owner||!g.repo||!g.token){alert('Usuario, repositorio y token son obligatorios.');return;}
  g.path=g.path.replace(/^\/+/,'');
  const prev=JSON.parse(JSON.stringify(SYNC.gh));
  SYNC.gh=g;
  setEstado('sync');
  try{
    const r=await ghFetch(`/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}`);
    if(!r.ok)throw new Error(await ghError(r));
    const info=await r.json();
    if(!info.permissions||!info.permissions.push)
      throw new Error('El token no tiene permiso de escritura en este repo (necesita Contents: Read and write).');
    if(!info.private&&!confirm('⚠️ El repo "'+g.owner+'/'+g.repo+'" es PÚBLICO.\n\nLos datos de tus clientes (nombres, teléfonos, direcciones) quedarían visibles para cualquiera.\n\n¿Continuar de todos modos?')){
      SYNC.gh=prev;setEstado('local');return;
    }
    SYNC.modo='github'; SYNC.baseRev=0; saveSync();
    await sincronizar(true);
    render();
  }catch(e){
    SYNC.gh=prev; SYNC.modo='local'; saveSync();
    setEstado('local');
    alert('No se pudo conectar.\n\n'+(e&&e.message?e.message:e));
    render();
  }
}
async function crearArchivo(){
  try{
    FH=await window.showSaveFilePicker({suggestedName:'autosolution-crm.json',
      types:[{description:'Datos del CRM',accept:{'application/json':['.json']}}]});
    await usarArchivo();
  }catch(e){if(e&&e.name!=='AbortError')alert('No se pudo crear el archivo: '+e.message);}
}
async function abrirArchivo(){
  try{
    const [h]=await window.showOpenFilePicker({
      types:[{description:'Datos del CRM',accept:{'application/json':['.json']}}]});
    FH=h; await usarArchivo();
  }catch(e){if(e&&e.name!=='AbortError')alert('No se pudo abrir el archivo: '+e.message);}
}
async function usarArchivo(){
  if(!await fsPermiso(true)){alert('Sin permiso de escritura sobre el archivo.');return;}
  await idbKV('put',FH);
  SYNC.modo='archivo'; SYNC.archivo.nombre=FH.name; SYNC.baseRev=0; saveSync();
  await sincronizar(true);
  render();
}
function desconectar(){
  if(!confirm('¿Desconectar? Los datos siguen en este dispositivo y en el destino, pero dejan de sincronizarse.'))return;
  SYNC.modo='local'; SYNC.gh.token=''; SYNC.gh.sha=''; SYNC.baseRev=0; SYNC.ultima='';
  SYNC.archivo.nombre=''; FH=null;
  try{idbKV('put',null);}catch(e){}
  saveSync(); setEstado('local'); toast('Desconectado'); render();
}

function importar(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||(!Array.isArray(d.clientes)&&!Array.isArray(d.leads))){alert('Archivo no válido.');return;}
      const n=(d.clientes||[]).length, m=(d.leads||[]).length, q=nDesk(d.desk);
      if(!confirm(`Importar ${n} cliente(s), ${m} lead(s)${q?` y ${q} negocio(s) de Desking`:''}? Reemplaza todo lo que hay ahora.`))return;
      const revPrev=S.meta.rev||0;
      if(d.desk)escribirDesk(d.desk);
      const limpio=Object.assign({},d); delete limpio.desk;
      S=Object.assign(BLANK(),limpio);

     ['refiDate','TrendingUp',C.vio,'Alerta de Refinanciamiento','Fecha para ofrecer mejor tasa'],

    .map(r=>{const d=dl(l.post[r[0]]);

/* ═══════════════════════════════════════════
   ARRANQUE
═══════════════════════════════════════════ */
render();
pintarPill();
arrancar();

/* Nadie ve el CRM sin cuenta. Con sesión guardada la app abre YA con la
   caché local y sincroniza detrás: sin internet se sigue trabajando. */
async function arrancar(){
  let tipo=false;
  try{tipo=await revisarEnlace();}catch(e){AUERR=e&&e.message?e.message:String(e);}
  if(tipo){
    try{
      await completarUsuario();
      await entrarConSesion();
      if(tipo==='recovery')setTimeout(modalClave,450);
      else toast('Correo confirmado — bienvenido');
      return;
    }catch(e){AUERR=e&&e.message?e.message:String(e);}
  }
  if(!SES||!SES.refresh_token){mostrarAuth();return;}

  SYNC.modo='supabase'; if(!SYNC.uid)SYNC.uid=miId(); saveSync();
  aplicarPerfil(); render(); setEstado('pendiente');
  try{await sbToken();}
  catch(e){
    if(!SES)return;                 /* el servidor rechazó la sesión: ya se pidió entrar */
    setEstado('error','Sin conexión — trabajando con la copia de este dispositivo');
    return;
  }
  await entrarConSesion();
}
</script>
