<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#080808"/>
<title>AutoSolution Miami — CRM</title>
<link rel="manifest" href="./manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AutoSolution"/>
<link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080808;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;
  --bd:#2a2a2a;--bd2:#363636;
  --tx:#efefef;--tx2:#999999;--tx3:#555555;
  --p:#e31c1c;--pd:#b91c1c;--ps:rgba(227,28,28,.1);
  --ok:#22c55e;--warn:#eab308;--info:#3b82f6;--dan:#ef4444;
  --vio:#8b5cf6;--ora:#f97316;--wa:#25D366;
  --r:9px;--r2:13px;
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);
  font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;font-feature-settings:'tnum'}
.bebas{font-family:'Bebas Neue','Archivo Black',sans-serif;letter-spacing:.04em}
button{cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#333;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
.sh{-ms-overflow-style:none;scrollbar-width:none}
.sh::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.fi{animation:fadeUp .16s ease forwards}
.spin{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;
  margin-left:-3px;vertical-align:top;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ═══ SHELL ═══ */
.app{display:flex;height:100%;overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:none}
.scrim.on{display:block}
aside{position:fixed;top:0;left:0;bottom:0;width:230px;background:#070707;border-right:1px solid var(--bd);
  display:flex;flex-direction:column;z-index:90;transform:translateX(-100%);transition:transform .2s ease}
aside.on{transform:none}
.sbhead{padding:14px 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--bd);min-height:54px}
.sbuser{padding:10px}
.sbuser .pill{display:flex;align-items:center;gap:8px;padding:8px;border-radius:9px;background:var(--bg3)}
.sbav{width:28px;height:28px;border-radius:50%;background:var(--p);display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:10px;flex-shrink:0;letter-spacing:-.02em}
.sbnav{flex:1;overflow-y:auto;padding:6px}
.nvi{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:12px;
  border:none;background:transparent;color:var(--tx3);text-align:left;margin-bottom:1px;position:relative}
.nvi.on{background:var(--ps);color:var(--p);font-weight:700}
.nvi .lb{flex:1}
.nvi .bdg{font-size:9px;font-weight:800;background:var(--p);color:#fff;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center}
.nvi .soon{font-size:8px;font-weight:800;color:var(--tx3);border:1px solid var(--bd2);border-radius:99px;padding:1px 5px;letter-spacing:.04em}
.nvsec{font-size:9px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;padding:12px 10px 5px}
.sbfoot{padding:8px;border-top:1px solid var(--bd)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd);
  background:var(--bg2);flex-shrink:0;min-height:52px}
.tbtitle{font-size:13px;font-weight:700;color:var(--tx);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:none;border:none;color:var(--tx3);padding:6px;border-radius:7px;line-height:0;display:flex}
.content{flex:1;overflow-y:auto;padding:16px 14px calc(78px + var(--sb));}
.content.flush{padding:0}
.inner{max-width:1180px;margin:0 auto}

.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--bd);display:flex;z-index:70;padding-bottom:var(--sb)}
.bn{flex:1;background:none;border:none;color:var(--tx3);font-size:9px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.bn svg.ic{width:19px;height:19px}
.bn.on{color:var(--tx)}
.bn.on svg.ic{stroke:var(--p)}
.bn .dot{position:absolute;top:6px;right:calc(50% - 16px);width:6px;height:6px;border-radius:50%;background:var(--p)}

/* ═══ PRIMITIVES ═══ */
h2.vh{font-size:18px;font-weight:800;color:var(--tx);letter-spacing:-.02em}
.vsub{font-size:12px;color:var(--tx3);margin-top:3px;line-height:1.5}
.stack{display:flex;flex-direction:column;gap:14px}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);padding:15px 16px}
.card.pad0{padding:0;overflow:hidden}
.chead{padding:13px 16px;border-bottom:1px solid var(--bd);font-weight:700;font-size:13px;color:var(--tx)}
.chead .s{font-size:11px;color:var(--tx3);font-weight:400;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid1{display:grid;grid-template-columns:1fr;gap:10px}
.divider{height:1px;background:var(--bd);margin:12px 0}

.btn{border-radius:8px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  letter-spacing:.01em;white-space:nowrap;font-size:12px;padding:9px 16px;background:var(--p);color:#fff;border:none;transition:opacity .12s}
.btn:active{opacity:.75}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--tx2);border:1px solid var(--bd2)}
.btn.ghost{background:transparent;color:var(--tx3);border:none}
.btn.ok{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.25)}
.btn.dan{background:rgba(239,68,68,.1);color:var(--dan);border:1px solid rgba(239,68,68,.25)}
.btn.wa{background:var(--wa);color:#07130A;font-weight:700}
.btn.sm{font-size:11px;padding:6px 12px;gap:5px}
.btn.xs{font-size:10px;padding:5px 9px;gap:4px}
.btn.lg{font-size:13px;padding:12px 22px}
.btn.full{width:100%}
.btn svg.ic{width:13px;height:13px}

.bdg2{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:10px;
  font-weight:700;letter-spacing:.03em;white-space:nowrap;border:1px solid}
label.f{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);
  margin-bottom:5px;display:flex;gap:4px;align-items:center}
label.f .h{color:var(--tx3);font-weight:400;text-transform:none;letter-spacing:normal;font-size:10px}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--bd);
  background:var(--bg3);color:var(--tx);font-size:14px;outline:none;line-height:1.4;transition:border-color .12s}
.inp:focus{border-color:var(--p)}
.inp::placeholder{color:var(--tx3)}
textarea.inp{resize:vertical;min-height:88px;font-size:14px;line-height:1.55}
select.inp{-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%23555' stroke-width='2' stroke-linecap='round'><path d='M3 5l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
.fr{display:flex;flex-direction:column}
.check{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--tx2);padding:4px 0}
.check input{accent-color:var(--p);width:16px;height:16px}

.kpi{background:var(--bg2);border-radius:12px;padding:14px;display:flex;align-items:flex-start;gap:11px;border:1px solid var(--bd)}
.kpi .ib{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi .v{font-size:21px;font-weight:800;color:var(--tx);line-height:1.1;letter-spacing:-.04em}
.kpi .l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-top:3px}
.kpi .s{font-size:10px;color:var(--tx3);margin-top:2px}

.empty{display:flex;flex-direction:column;align-items:center;padding:40px 20px;text-align:center}
.empty .eb{width:44px;height:44px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;
  justify-content:center;margin-bottom:12px;color:var(--tx3)}
.empty .t{font-weight:700;color:var(--tx2);font-size:13px}
.empty .s{font-size:12px;color:var(--tx3);margin-top:5px;max-width:280px;line-height:1.55}

/* ═══ LIST ROWS ═══ */
.lrow{width:100%;display:flex;align-items:stretch;background:none;border:none;border-bottom:1px solid var(--bd);
  text-align:left;padding:0;color:inherit}
.lrow:last-child{border-bottom:none}
.lrow .heat{width:3px;flex-shrink:0;align-self:stretch;opacity:.75}
.lrow .body{flex:1;padding:12px 14px;min-width:0;display:flex;align-items:center;gap:10px}
.lname{font-size:13px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta{font-size:11px;color:var(--tx3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagrow{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;align-items:center}

/* ═══ ALERTAS ═══ */
.arow{position:relative;padding-left:16px}
.arow::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--warn)}
.arow.hot::before{background:var(--p)}
.atag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.arow.hot .atag{color:var(--p)}
.aact{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}

/* ═══ PIPELINE ═══ */
.kan{display:flex;gap:11px;overflow-x:auto;padding-bottom:10px}
.kcol{min-width:208px;flex-shrink:0}
.khead{background:var(--bg2);border:1px solid var(--bd);border-radius:0 0 10px 10px;padding:9px 12px;margin-bottom:8px}
.kcard{background:var(--bg2);border-radius:10px;border:1px solid var(--bd);overflow:hidden}
.kcard .hb{height:3px;opacity:.75}

/* ═══ DEAL ROOM ═══ */
.steps{display:flex;gap:7px;overflow-x:auto;padding:11px 14px;border-bottom:1px solid var(--bd);background:#0d0d0d}
.stp{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:99px;border:1px solid var(--bd);
  background:transparent;color:var(--tx3);font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0}
.stp.on{background:var(--ps);border-color:var(--p);color:var(--p)}
.stp.done{border-color:rgba(34,197,94,.4);color:var(--ok)}
.stp .n{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:flex;
  align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.fbar{border-top:1px solid var(--bd);background:#0a0a0a;padding:9px 0;
  position:fixed;bottom:calc(56px + var(--sb));left:0;right:0;z-index:60;
  display:flex;align-items:center;gap:14px;overflow-x:auto}
.fbar .f{flex-shrink:0;padding-left:14px}
.fbar .f:last-child{padding-right:14px}
.fbar .fl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3)}
.fbar .fv{font-size:14px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.tl{padding-left:16px;border-left:2px solid var(--bd);margin-top:12px}
.tli{position:relative;margin-bottom:12px}
.tli .dot{position:absolute;left:-25px;top:2px;width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:1.5px solid}
.tli .dot svg.ic{width:9px;height:9px}
.actgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.actbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:8px;
  border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:9px;font-weight:700;text-transform:uppercase}
.sumrow{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}
.sumrow.b{border-top:1px solid var(--bd);font-weight:700;color:var(--tx);margin-top:2px;padding-top:7px}

/* ═══ PROGRAMAS ═══ */
.promo{border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;background:var(--bg2)}
.phead{background:linear-gradient(135deg,#1a1a1e,#141416);padding:14px 16px;border-bottom:1px solid var(--bd)}
.pbrand{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--p)}
.pmodel{font-weight:800;font-size:18px;letter-spacing:-.03em;margin-top:2px}
.ppay{font-weight:800;font-size:15px;margin-top:3px}
.ppay small{color:var(--tx3);font-weight:500;font-size:11px}
.pfine{padding:10px 16px;color:var(--tx3);font-size:11.5px;line-height:1.55;border-bottom:1px solid var(--bd)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--bd);font-size:12.5px;color:var(--tx2)}
.mrow:last-child{border-bottom:none}
.mlab{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:12px 0 2px}

/* ═══ MODAL ═══ */
.mask{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd2);border-radius:16px 16px 0 0;width:100%;
  max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .2s ease}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;
  border-bottom:1px solid var(--bd);flex-shrink:0}
.mhead b{font-weight:700;font-size:15px}
.mbody{padding:16px 18px calc(16px + var(--sb));overflow-y:auto;flex:1}
.mfoot{padding:12px 18px calc(12px + var(--sb));border-top:1px solid var(--bd);display:flex;gap:8px;flex-shrink:0}
.mfoot .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--bg2);
  border:1px solid rgba(34,197,94,.35);color:var(--ok);font-size:12.5px;font-weight:600;padding:11px 20px;
  border-radius:99px;z-index:300;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:88vw;text-align:center}
.toast.on{opacity:1;bottom:106px}

/* ═══ ONBOARDING ═══ */
.onb{position:fixed;inset:0;z-index:400;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.onbhero{background:#0d0909;border-bottom:1px solid var(--bd);padding:34px 22px 30px;position:relative;overflow:hidden}
.onbhero .glow{position:absolute;bottom:-90px;right:-60px;width:240px;height:240px;
  background:rgba(227,28,28,.06);border-radius:50%}
.onbtag{display:inline-flex;align-items:center;gap:6px;background:var(--ps);border:1px solid rgba(227,28,28,.19);
  border-radius:99px;padding:4px 12px;margin:20px 0 16px;font-size:10px;font-weight:700;color:var(--p);
  text-transform:uppercase;letter-spacing:.08em}
.onbform{padding:26px 22px calc(30px + var(--sb));max-width:440px;width:100%;margin:0 auto}

/* ═══ ENTRADA (login / registro) ═══ */
.auh{font-size:23px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
.aup{color:var(--tx3);font-size:13px;margin-bottom:20px;line-height:1.6}
.aunota{font-size:11px;color:var(--tx3);text-align:center;margin-top:14px;line-height:1.6}
.aumsg{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:9px;
  font-size:12px;line-height:1.55;margin-bottom:14px}
.aumsg.dan{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
.aumsg.ok{background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.25);color:#86efac}
.aumsg svg.ic{flex-shrink:0;margin-top:1px}
.inp.au{font-size:15px;padding:12px 14px}
.ausep{display:flex;align-items:center;gap:10px;margin:20px 0 12px;color:var(--tx3);font-size:11px}
.ausep:before,.ausep:after{content:'';flex:1;height:1px;background:var(--bd)}
.sbacc{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:9px;
  background:var(--bg3);margin-bottom:7px}

/* ═══ DASH DE ADMIN ═══ */
.admrow{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--bd);align-items:flex-start}
.admrow:last-child{border-bottom:none}
.admav{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.admnom{font-size:13px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.admsub{font-size:11px;color:var(--tx3);line-height:1.5}

/* ═══ DESKTOP ═══ */
@media(min-width:1000px){
  aside{position:static;transform:none;width:212px}
  .scrim{display:none!important}
  .bottomnav{display:none}
  .content{padding:20px 24px 30px}
  .menubtn{display:none}
  .grid2{grid-template-columns:repeat(4,1fr)}
  .grid1{grid-template-columns:1fr 1fr}
  .mask{align-items:center;padding:20px}
  .modal{border-radius:16px;max-height:88vh}
  .mfoot{justify-content:flex-end}
  .mfoot .btn{flex:0 0 auto}
  .fbar{left:212px;bottom:0}
  .toast{left:auto;right:24px;transform:none;bottom:24px}
  .onb{flex-direction:row}
  .onbhero{width:44%;border-bottom:none;border-right:1px solid var(--bd);padding:48px;
    display:flex;flex-direction:column;justify-content:space-between}
  .onbwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
}
@media(max-width:999px){ .dtonly{display:none!important} }
</style>
</head>
<body>

<div class="app">
  <div class="scrim" id="scrim" onclick="drawer(false)"></div>

  <aside id="aside">
    <div class="sbhead">
      <span id="sbLogo"></span>
      <button class="iconbtn menubtn" onclick="drawer(false)" aria-label="Cerrar">
        <svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sbuser">
      <div class="pill">
        <div class="sbav" id="sbAv">AS</div>
        <div style="min-width:0;flex:1">
          <div id="sbName" style="font-size:11.5px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Mi cartera</div>
          <div id="sbRol" style="font-size:9px;color:var(--p);font-weight:700;text-transform:uppercase;letter-spacing:.06em">Vendedor</div>
        </div>
      </div>
    </div>
    <nav class="sbnav sh" id="sbNav"></nav>

<script>
/* ═══════════ ESTADO Y PERSISTENCIA ═══════════ */
const K='asm_libro_v1';
const BLANK=()=>({cfg:{nombre:'',wa:'',dealer:'AutoSolution Miami',onboarded:false},
  clientes:[],leads:[],promos:[],tareas:[],
  meta:{rev:0,updatedAt:'',device:''}});
let S=BLANK();
try{
  const raw=localStorage.getItem(K);
  if(raw){const d=JSON.parse(raw); S=Object.assign(BLANK(),d); S.cfg=Object.assign(BLANK().cfg,d.cfg||{});}
}catch(e){console.warn('Estado ilegible, se arranca vacío.',e);}
['clientes','leads','promos','tareas'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];});
if(!S.meta||typeof S.meta!=='object')S.meta={rev:0,updatedAt:'',device:''};

let saveErr=false;
function saveLocal(){
  try{localStorage.setItem(K,JSON.stringify(S));saveErr=false;return true;}
  catch(e){
    if(!saveErr){saveErr=true;
      alert('No se pudo guardar en este navegador (¿modo privado o disco lleno?). Conecta GitHub o un archivo desde Config › Nube para no perder nada.');}
    return false;
  }
}
/* save() = guarda ya en local (rápido) y agenda el envío a la nube (con retraso). */
function save(opts){
  if(!(opts&&opts.silent)){
    S.meta.rev=(S.meta.rev||0)+1;
    S.meta.updatedAt=nowISO();
    S.meta.device=SYNC.device;
  }
  saveLocal();
  if(SYNC.modo!=='local')programarPush();
}

/* ═══════════ HELPERS ═══════════ */
const $=id=>document.getElementById(id);
const uid=p=>(p||'x')+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO=()=>new Date().toISOString();
const today=()=>new Date().toISOString().slice(0,10);
const thisMonth=()=>new Date().toISOString().slice(0,7);
const num=v=>{const n=Number(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const fm=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(num(n));
const fmN=n=>new Intl.NumberFormat('en-US').format(Math.round(num(n)));
const ini=s=>String(s||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'AS';
function fDate(iso){if(!iso)return'—';const d=new Date(iso.length===10?iso+'T00:00:00':iso);
  return isNaN(d)?iso:d.toLocaleDateString('es-US',{month:'short',day:'numeric',year:'numeric'});}
function fDateTime(iso){const d=new Date(iso);return isNaN(d)?'—':
  d.toLocaleDateString('es-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtM(d){return d.toLocaleDateString('es-US',{month:'short',year:'numeric'});}
function addMonths(ym,n){if(!ym)return null;const a=String(ym).split('-');const y=+a[0],m=+a[1];
  if(!y||!m)return null;return new Date(y,(m-1)+n,1);}
function hoy(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dias(a,b){return Math.round((a-b)/864e5);}
function tel10(t){let d=String(t||'').replace(/\D/g,'');
  if(d.length===10)d='1'+d;
  if(d.length===11&&d[0]==='1')return d;
  return d;}
const firma=()=>S.cfg.nombre?', soy '+S.cfg.nombre:'';
function calcPmt(amt,apr,mo){if(!amt||!mo)return 0;const r=(apr/100)/12;
  return r>0?amt*(r*Math.pow(1+r,mo))/(Math.pow(1+r,mo)-1):amt/mo;}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');
  clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600);}
const jsq=x=>esc(JSON.stringify(x));
function badge(txt,color){return `<span class="bdg2" style="color:${color};background:${color}20;border-color:${color}30">${esc(txt)}</span>`;}
function empty(icon,t,s){return `<div class="empty"><div class="eb">${ic(icon,19)}</div>
  <div class="t">${esc(t)}</div>${s?`<div class="s">${s}</div>`:''}</div>`;}
function kpi(icon,label,value,sub,accent){
  return `<div class="kpi"><div class="ib" style="background:${accent}18;color:${accent}">${ic(icon,17,accent)}</div>
    <div style="min-width:0;flex:1"><div class="v mono">${value}</div><div class="l">${esc(label)}</div>
    ${sub?`<div class="s">${esc(sub)}</div>`:''}</div></div>`;}

/* ── vehículo / etiquetas ── */
const vehLead=l=>[l.veh&&l.veh.ano,l.veh&&l.veh.marca,l.veh&&l.veh.mod].filter(Boolean).join(' ')||'Sin vehículo';
const vehCli=c=>[c.ano,c.marca,c.mod].filter(Boolean).join(' ')||'—';
const tipoLbl=t=>t==='lease'?'Lease':t==='finance'?'Financiado':'Cash';
const tipoCol=t=>t==='lease'?'#F87171':t==='finance'?C.warn:C.ok;

/* ═══════════ MOTOR DE URGENCIA (del diseño) ═══════════ */
function getUrgency(l){
  const et=ETAPAS[l.etapa]||'Nuevo';
  if(et==='Vendido'||et==='Perdido')return{score:0,color:C.bd2,label:'Cerrado'};
  const dsU=(Date.now()-new Date(l.updatedAt||l.createdAt))/864e5;
  const dsC=(Date.now()-new Date(l.createdAt))/864e5;
  let s=30;
  if(et==='Nuevo'){ if(dsC<.25)s+=45; else if(dsC<1)s+=30; else if(dsC<3)s+=10; else s-=10; }
  else if(et==='Negociación')s+=40;
  else if(et==='Cita')s+=30;
  else if(et==='Contactado')s+=10;
  if(dsU<.5)s+=15; else if(dsU<1)s+=5; else if(dsU>7)s-=25; else if(dsU>3)s-=12;
  const b=num(l.veh&&l.veh.pres);
  if(b>70000)s+=10; else if(b>35000)s+=5;
  s=Math.max(0,Math.min(100,Math.round(s)));
  if(s>=75)return{score:s,color:C.p,label:'🔴 Urgente'};
  if(s>=55)return{score:s,color:C.warn,label:'🟡 Caliente'};
  if(s>=35)return{score:s,color:C.info,label:'🔵 Tibio'};
  return{score:s,color:C.tx3,label:'⚫ Frío'};
}

/* ═══════════ MOTOR DE ALERTAS (del libro) ═══════════ */
function calcAlertas(){
  const H=hoy(),out=[];
  for(const c of S.clientes){
    if(!c.fecha)continue;
    const base=addMonths(c.fecha,0); if(!base)continue;

    if(c.tipo==='lease'&&num(c.plazo)){
      const fin=addMonths(c.fecha,num(c.plazo)),d=dias(fin,H);
      if(d<=200){
        let tag,hot=false;
        if(d<0){tag='Lease vencido hace '+Math.abs(d)+' días';hot=true;}
        else if(d<=60){tag='Lease vence en '+d+' días';hot=true;}
        else if(d<=125){tag='Lease vence en ~'+Math.round(d/30)+' meses';}
        else{tag='Lease vence en ~6 meses';}
        out.push({cid:c.id,nom:c.nom,tel:c.tel,veh:vehCli(c),tag,hot,ord:d,tipo:'lease',
          msg:`Hola ${c.nom}${firma()} 👋 Te aviso con tiempo: el lease de tu ${vehCli(c)} ${d<0?'ya se venció':'se vence en unos '+Math.max(1,Math.round(d/30))+' meses'}. Los que empiezan a ver opciones con tiempo consiguen mucho mejor deal que los que esperan al final. ¿Quieres que te vaya buscando opciones?`});
      }
    }
    if(c.tipo==='finance'){
      const refi=addMonths(c.fecha,12),d=dias(refi,H);
      if(d<=30&&d>=-180){
        out.push({cid:c.id,nom:c.nom,tel:c.tel,veh:vehCli(c),hot:false,ord:d+1000,tipo:'refi',
          tag:d<=0?'Cumplió 1 año · revisar refi':'Cumple 1 año en '+d+' días',
          msg:`Hola ${c.nom}${firma()} 👋 Ya ${d<=0?'llevas':'casi llevas'} un año con tu ${vehCli(c)}. A veces a esta altura conviene revisar la tasa — hay casos donde baja el pago. Si quieres le doy un vistazo sin compromiso.`});
      }
    }
    const H2=hoy();
    let aniv=new Date(H2.getFullYear(),base.getMonth(),1);
    if(dias(aniv,H2)<-30)aniv=new Date(H2.getFullYear()+1,base.getMonth(),1);
    const da=dias(aniv,H2),years=aniv.getFullYear()-base.getFullYear();
    if(da>=0&&da<=30&&years>=1&&!(c.tipo==='finance'&&years===1)){
      out.push({cid:c.id,nom:c.nom,tel:c.tel,veh:vehCli(c),hot:false,ord:da+2000,tipo:'aniv',
        tag:'Aniversario · '+years+' año'+(years>1?'s':''),
        msg:`¡Hola ${c.nom}! 🎉 Ya se cumple${years>1?'n':''} ${years} año${years>1?'s':''} de tu ${vehCli(c)}. ¿Cómo te ha tratado? Cualquier cosa que necesites — o si alguien cercano anda buscando carro — aquí estoy.`});
    }
  }
  /* Alertas de post-venta cargadas en el paso 8 del Deal Room */
  const PS=[['equityDate','Equity','equity',c=>`Hola ${c} 👋 Te escribo por algo puntual: tu carro está en un punto donde puede tener equity a tu favor. Si quieres reviso los números sin compromiso y te digo qué opciones tienes.`],
            ['refiDate','Refinanciamiento','refi',c=>`Hola ${c} 👋 Se abrió ventana para revisar tu tasa. En varios casos baja el pago mensual. ¿Te lo reviso sin compromiso?`],
            ['renewDate','Renovación','renov',c=>`Hola ${c} 👋 Ya viene el momento de renovar. Si empezamos ahora te consigo mejores números que esperando al final. ¿Miramos opciones?`]];
  for(const l of S.leads){
    if(!l.post)continue;
    for(const row of PS){
      const f=l.post[row[0]]; if(!f)continue;
      const d=dias(new Date(f+'T00:00:00'),hoy());
      if(d<=45){
        out.push({lid:l.id,nom:l.nom,tel:l.tel,veh:vehLead(l),hot:d<=14,ord:d+3000,tipo:row[2],
          tag:'Post-venta · '+row[1]+(d<0?' (hace '+Math.abs(d)+' días)':d===0?' — hoy':' en '+d+' días'),
          msg:row[3](l.nom)});
      }
    }
  }
  out.sort((a,b)=>a.ord-b.ord);
  return out;
}

/* ═══════════ FÁBRICAS ═══════════ */
function nuevoLead(o){
  return{id:uid('l'),nom:o.nom,tel:o.tel||'',email:o.email||'',origen:o.origen||'Manual',etapa:0,
    createdAt:nowISO(),updatedAt:nowISO(),notas:o.notas||'',
    veh:{ano:o.ano||'',marca:o.marca||'',mod:o.mod||'',pres:num(o.pres),cond:o.cond||'Nuevo'},
    trade:{has:false,vin:'',ano:'',marca:'',mod:'',millas:0,payoff:0,acv:0,allowance:0},
    oferta:{stock:'',precio:0,msrp:0,fees:0,tax:0,rebates:0,desc:0,down:0},
    perfil:{dir:'',ciudad:'',estado:'FL',zip:'',empleador:'',cargo:'',ingreso:0,licencia:'',seguro:''},
    deal:{banco:'',tipo:'Financiado',apr:0,plazo:60},
    recap:{fni:[],finalizado:false,firmado:false},
    post:{resena:false,referidos:[],equityDate:'',refiDate:'',renewDate:''},
    acts:[]};
}
function finanzas(l){
  const o=l.oferta||{},t=l.trade||{},d=l.deal||{};
  const precio=num(o.precio),msrp=num(o.msrp),fees=num(o.fees),tax=num(o.tax),
    rebates=num(o.rebates),desc=num(o.desc),down=num(o.down);
  const allowance=t.has?num(t.allowance):0, payoff=t.has?num(t.payoff):0, acv=t.has?num(t.acv):0;
  const totalDue=precio+fees+tax-rebates-desc-allowance;
  const amtFin=Math.max(0,totalDue-down);
  const equity=allowance-payoff;
  const over=Math.max(0,allowance-acv);
  const frontGross=precio-msrp-over;
  const backGross=(l.recap&&l.recap.fni||[]).reduce((s,f)=>s+num(f.profit),0);
  const apr=num(d.apr),plazo=num(d.plazo)||60;
  return{precio,msrp,fees,tax,rebates,desc,down,allowance,payoff,acv,totalDue,amtFin,equity,over,
    frontGross,backGross,totalGross:frontGross+backGross,apr,plazo,
    pago:Math.round(calcPmt(amtFin,apr,plazo))};
}

<script>
/* ═══════════════════════════════════════════════════════════
   SINCRONIZACIÓN — GitHub (nube) o archivo en la PC
   localStorage queda como caché rápida; la fuente de verdad
   es el remoto. La config vive en su propia clave: el token
   NUNCA entra en el respaldo JSON.
═══════════════════════════════════════════════════════════ */
const SK='asm_sync_v1';
const SYNC_BLANK=()=>({
  modo:'local',            /* 'local' | 'supabase' | 'github' | 'archivo' */
  device:'',
  uid:'',                  /* de quién es el libro guardado en este navegador */
  baseRev:0,               /* rev ya confirmada en el remoto */
  ultima:'',
  gh:{owner:'',repo:'',path:'datos/autosolution-crm.json',branch:'main',token:'',sha:''},
  archivo:{nombre:''}
});
let SYNC=SYNC_BLANK();
try{const r=localStorage.getItem(SK);if(r){const d=JSON.parse(r);
  SYNC=Object.assign(SYNC_BLANK(),d);
  SYNC.gh=Object.assign(SYNC_BLANK().gh,d.gh||{});
  SYNC.archivo=Object.assign(SYNC_BLANK().archivo,d.archivo||{});}}catch(e){}
if(!SYNC.device){
  const ua=navigator.userAgent;
  SYNC.device=/iPhone|iPad/.test(ua)?'iPhone':/Android/.test(ua)?'Android':
              /Mac/.test(ua)?'Mac':/Windows/.test(ua)?'PC':'Navegador';
}
function saveSync(){try{localStorage.setItem(SK,JSON.stringify(SYNC));}catch(e){}}

/* Estado visible: 'local'|'ok'|'pendiente'|'sync'|'error'|'conflicto'|'permiso' */
let SYNCEST={estado:SYNC.modo==='local'?'local':'pendiente',msg:''};
function setEstado(e,msg){
  SYNCEST={estado:e,msg:msg||''};
  pintarPill();
  if(TAB==='nube')render();
}
const SYNC_UI={
  local:{c:C.tx3,i:'CloudOff',t:'Solo este dispositivo'},
  ok:{c:C.ok,i:'Cloud',t:'Guardado en la nube'},
  pendiente:{c:C.warn,i:'Cloud',t:'Cambios sin enviar'},
  sync:{c:C.info,i:'Loader',t:'Sincronizando…'},
  error:{c:C.dan,i:'CloudOff',t:'Error de sincronización'},
  conflicto:{c:C.ora,i:'AlertCircle',t:'Conflicto entre dispositivos'},
  permiso:{c:C.warn,i:'HardDrive',t:'Reconectar el archivo'}
};
function pintarPill(){
  const el=$('syncPill'); if(!el)return;
  const u=SYNC_UI[SYNCEST.estado]||SYNC_UI.local;
  el.innerHTML=ic(u.i,17,u.c)+(SYNCEST.estado==='sync'?'<span class="spin"></span>':'');
  el.title=u.t+(SYNCEST.msg?' — '+SYNCEST.msg:'');
  el.style.color=u.c;
}

/* ── base64 <-> UTF-8 (nombres con acentos y emojis) ── */
function b64enc(str){
  const b=new TextEncoder().encode(str);let s='';const CH=0x8000;
  for(let i=0;i<b.length;i+=CH)s+=String.fromCharCode.apply(null,b.subarray(i,i+CH));
  return btoa(s);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\s/g,''));
  const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
/* ── Desking (asm_desk_v1) ──
   Vive en su propia clave porque desking.html la lee tal cual y no se toca.
   El CRM la adjunta al subir y la devuelve a su sitio al bajar. */
const DK='asm_desk_v1';
function leerDesk(){try{const r=localStorage.getItem(DK);return r?JSON.parse(r):null;}catch(e){return null;}}
function escribirDesk(d){
  try{ if(d==null)localStorage.removeItem(DK); else localStorage.setItem(DK,JSON.stringify(d)); return true; }
  catch(e){return false;}
}
/* Huella barata para saber si Desking escribió desde la última sincronización */
function deskSig(){
  let s='';try{s=localStorage.getItem(DK)||'';}catch(e){}
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return s.length+':'+h.toString(36);
}
const nDesk=d=>(d&&d.cotizaciones&&d.cotizaciones.length)||0;

/* Lo que viaja a la nube: el CRM + las cotizaciones de Desking */
function snapshot(){
  const o=Object.assign({},S);
  const d=leerDesk();
  if(d)o.desk=d;
  return o;
}
const payload=()=>JSON.stringify(snapshot(),null,1);

/* ═══ GITHUB ═══ */
async function ghFetch(ruta,opts){
  opts=opts||{};
  return fetch('https://api.github.com'+ruta,Object.assign({},opts,{
    headers:Object.assign({
      'Authorization':'Bearer '+SYNC.gh.token,
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'
    },opts.headers||{})
  }));
}
async function ghError(r){
  let d='';try{const j=await r.json();d=j.message||'';}catch(e){}
  if(r.status===401)return 'Token inválido o vencido.';
  if(r.status===403)return 'Sin permiso. ¿El token tiene acceso de escritura (Contents) a este repo?';
  if(r.status===404)return 'No se encontró el repo o la rama. Revisa usuario/repo/rama.';
  if(r.status===409)return 'Conflicto de versión.';
  return 'GitHub '+r.status+(d?': '+d:'');
}
const ghURL=()=>{const g=SYNC.gh;
  return `/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/`+
    String(g.path).split('/').map(encodeURIComponent).join('/');};

async function ghPull(){
  const g=SYNC.gh;
  const r=await ghFetch(ghURL()+'?ref='+encodeURIComponent(g.branch)+'&nc='+Date.now(),{cache:'no-store'});
  if(r.status===404)return {existe:false};
  if(!r.ok)throw new Error(await ghError(r));
  const j=await r.json();
  let txt;
  if(j.content&&j.content.length)txt=b64dec(j.content);
  else{ /* >1 MB: la API devuelve content vacío, hay que leer el blob */
    const rb=await ghFetch(`/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/git/blobs/${j.sha}`);
    if(!rb.ok)throw new Error(await ghError(rb));
    txt=b64dec((await rb.json()).content);
  }
  return {existe:true,sha:j.sha,datos:JSON.parse(txt)};
}
async function ghPush(sha){
  const g=SYNC.gh;
  const body={branch:g.branch,content:b64enc(payload()),
    message:`CRM · ${S.clientes.length} clientes · ${S.leads.length} leads · ${SYNC.device}`};
  if(sha||g.sha)body.sha=sha||g.sha;
  const r=await ghFetch(ghURL(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422){const e=new Error('sha desactualizado');e.conflicto=true;throw e;}
  if(!r.ok)throw new Error(await ghError(r));
  g.sha=(await r.json()).content.sha;
  return true;
}

/* ═══ ARCHIVO EN LA PC (File System Access API) ═══ */
const HAY_FS=typeof window!=='undefined'&&'showSaveFilePicker'in window;
let FH=null; /* FileSystemFileHandle */
function idbKV(op,val){
  return new Promise((res,rej)=>{
    if(!window.indexedDB)return res(null);
    const rq=indexedDB.open('asm_sync',1);
    rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('kv');}catch(e){}};
    rq.onerror=()=>rej(rq.error);
    rq.onsuccess=()=>{
      const db=rq.result;
      let tx;try{tx=db.transaction('kv',op==='get'?'readonly':'readwrite');}catch(e){return res(null);}
      const st=tx.objectStore('kv');
      const r=op==='get'?st.get('handle'):st.put(val,'handle');
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    };
  });
}
async function fsPermiso(pedir){
  if(!FH)return false;
  const o={mode:'readwrite'};
  if((await FH.queryPermission(o))==='granted')return true;
  if(!pedir)return false;
  return (await FH.requestPermission(o))==='granted';
}
async function fsLeer(){
  const f=await FH.getFile();
  const t=await f.text();
  if(!t.trim())return {existe:false};
  return {existe:true,datos:JSON.parse(t)};
}
async function fsEscribir(){
  const w=await FH.createWritable();
  await w.write(payload());
  await w.close();
  return true;
}

/* ═══ ORQUESTADOR ═══ */
let pushTimer=null, sincronizando=false, ultimoPull=0;
function programarPush(){
  setEstado('pendiente');
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{sincronizar();},2500);
}
async function sincronizar(manual){
  if(SYNC.modo==='local'||sincronizando)return;
  clearTimeout(pushTimer);
  sincronizando=true; setEstado('sync');
  try{
    if(SYNC.modo==='archivo'){
      if(!await fsPermiso(!!manual)){sincronizando=false;setEstado('permiso');return;}
    }
    const rem = SYNC.modo==='supabase' ? await sbPull()
              : SYNC.modo==='github'   ? await ghPull()
                                       : await fsLeer();

    if(!rem.existe){                       /* primera vez: creamos el archivo */
      await enviar(); sincronizando=false; return;
    }
    const rRev=(rem.datos&&rem.datos.meta&&rem.datos.meta.rev)||0;
    const lRev=S.meta.rev||0, base=SYNC.baseRev||0;

    /* Dispositivo nuevo estrenando la conexión: aquí no hay nada que perder,
       así que se adopta la nube sin molestar con un conflicto. */
    if(vacio(snapshot())&&!vacio(rem.datos)){
      adoptar(rem.datos);
      if(SYNC.modo==='github')SYNC.gh.sha=rem.sha;
      SYNC.baseRev=rRev; SYNC.ultima=nowISO(); SYNC.deskSig=deskSig(); saveSync();
      sincronizando=false; setEstado('ok'); render();
      toast('Datos recuperados de la nube');
      return;
    }
    if(rRev>base&&lRev>base&&!iguales(rem.datos,snapshot())){
      sincronizando=false;
      setEstado('conflicto');
      modalConflicto(rem);
      return;
    }
    if(rRev>base){                         /* la nube va adelante: la adoptamos */
      adoptar(rem.datos);
      if(SYNC.modo==='github')SYNC.gh.sha=rem.sha;
      SYNC.baseRev=rRev; SYNC.ultima=nowISO(); SYNC.deskSig=deskSig(); saveSync();
      sincronizando=false; setEstado('ok'); render();
      if(manual)toast('Actualizado desde la nube');
      return;
    }
    if(lRev>base){ await enviar(rem.sha); sincronizando=false; if(manual)toast('Guardado en la nube'); return; }

    if(SYNC.modo==='github')SYNC.gh.sha=rem.sha;
    SYNC.ultima=nowISO(); SYNC.deskSig=deskSig(); saveSync();
    sincronizando=false; setEstado('ok');
    if(manual)toast('Todo al día');
  }catch(e){
    sincronizando=false;
    if(e&&e.conflicto){setEstado('pendiente');setTimeout(()=>sincronizar(),800);return;}
    setEstado('error',e&&e.message?e.message:String(e));
    if(manual)alert('No se pudo sincronizar.\n\n'+(e&&e.message?e.message:e)+
      '\n\nTus datos siguen guardados en este dispositivo.');
  }
}
async function enviar(sha){
  if(SYNC.modo==='supabase')await sbPush();
  else if(SYNC.modo==='github')await ghPush(sha);
  else await fsEscribir();
  SYNC.baseRev=S.meta.rev; SYNC.ultima=nowISO(); SYNC.deskSig=deskSig(); saveSync();
  setEstado('ok');
}
/* "Vacío" = sin nada que perder: solo el perfil del onboarding.
   Un dispositivo con cotizaciones de Desking NO está vacío. */
function vacio(d){
  if(!d)return true;
  return !((d.clientes||[]).length||(d.leads||[]).length||
           (d.promos||[]).length||(d.tareas||[]).length||nDesk(d.desk));
}
function iguales(a,b){
  try{
    const limpia=o=>{const c=JSON.parse(JSON.stringify(o));delete c.meta;return JSON.stringify(c);};
    return limpia(a)===limpia(b);
  }catch(e){return false;}
}
function adoptar(d){
  if(d&&d.desk)escribirDesk(d.desk);      /* las cotizaciones vuelven a su clave */
  const limpio=Object.assign({},d); delete limpio.desk;
  S=Object.assign(BLANK(),limpio);
  S.cfg=Object.assign(BLANK().cfg,(d&&d.cfg)||{});
  ['clientes','leads','promos','tareas'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];});
  if(!S.meta)S.meta={rev:0,updatedAt:'',device:''};
  saveLocal();
}

function msgAuth(j,status){
  const code=(j&&(j.error_code||j.code))||'';
  const m=(j&&(j.msg||j.error_description||j.message||j.error))||'';
  const M={
    invalid_credentials:'Correo o contraseña incorrectos.',
    email_not_confirmed:'Falta confirmar tu correo. Abre el enlace que te mandamos y vuelve a entrar.',
    user_already_exists:'Ese correo ya tiene cuenta. Entra con tu contraseña.',
    email_exists:'Ese correo ya tiene cuenta. Entra con tu contraseña.',
    weak_password:'La contraseña es muy corta. Usa 8 caracteres o más.',
    over_email_send_rate_limit:'Muchos correos seguidos. Espera unos minutos y reintenta.',
    over_request_rate_limit:'Demasiados intentos. Espera un minuto.',
    signup_disabled:'El registro está cerrado. Pídele a Eduardo que te dé de alta.',
    user_banned:'Esta cuenta está bloqueada. Habla con Eduardo.'
  };
  if(M[code])return M[code];
  if(/already registered|already been registered/i.test(m))return 'Ese correo ya tiene cuenta. Entra con tu contraseña.';
  if(/password should be at least/i.test(m))return 'La contraseña es muy corta. Usa 8 caracteres o más.';
  if(/invalid.*email|email.*invalid/i.test(m))return 'Ese correo no parece válido.';
  return m||('Error del servidor ('+status+').');
}

/* ── /auth/v1 ── */
async function sbAuth(ruta,body,metodo){
  let r;

    });

  const t=await r.text();
  let j=null;try{j=t?JSON.parse(t):null;}catch(e){}
  if(!r.ok){const err=new Error(msgAuth(j,r.status));err.status=r.status;throw err;}
  return j;
}

/* ── Token vivo (refresca solo, una vez a la vez) ── */
let refrescando=null;
async function sbToken(){
  if(!SES||!SES.refresh_token)return null;
  if(SES.access_token&&SES.expires_at&&Date.now()<SES.expires_at-60000)return SES.access_token;
  if(!refrescando){
    refrescando=(async()=>{
      try{
        const j=await sbAuth('/token?grant_type=refresh_token',{refresh_token:SES.refresh_token});
        adoptarSesion(j);
        return SES.access_token;
      }catch(e){
        /* Solo se mata la sesión si el SERVIDOR la rechazó. Si fue falta de
           internet, la sesión sigue viva y la app trabaja con la caché. */
        if(e&&e.status&&e.status<500)sesionMuerta();
        throw e;
      }finally{refrescando=null;}
    })();
  }
  return refrescando;
}
function adoptarSesion(j){
  if(!j||!j.access_token)return false;
  const antes=SES||{};
  SES={
    access_token:j.access_token,
    refresh_token:j.refresh_token||antes.refresh_token||'',
    expires_at:Date.now()+((num(j.expires_in)||3600)*1000),
    user:{id:(j.user&&j.user.id)||(antes.user&&antes.user.id)||'',
          email:(j.user&&j.user.email)||(antes.user&&antes.user.email)||''},
    perfil:antes.perfil||null
  };
  guardarSes();
  return true;
}

/* ── /rest/v1 ── */
async function sbRest(ruta,opts){
  opts=opts||{};
  const tk=await sbToken();
  if(!tk)throw new Error('Sesión cerrada. Entra otra vez.');
  const pide=async(token)=>{
    const h={'apikey':SB_KEY,'Authorization':'Bearer '+token};
    if(opts.prefer)h['Prefer']=opts.prefer;
    if(opts.body)h['Content-Type']='application/json';
    try{
      return await fetch(SB_URL+'/rest/v1'+ruta,{method:opts.method||'GET',headers:h,
        body:opts.body?JSON.stringify(opts.body):undefined,cache:'no-store'});
    }catch(e){throw errRed();}
  };
  let r=await pide(tk);
  if(r.status===401&&SES){                 /* venció antes de tiempo */
    SES.expires_at=0;guardarSes();
    const tk2=await sbToken();
    if(!tk2)throw new Error('Sesión cerrada. Entra otra vez.');
    r=await pide(tk2);
  }
  if(!r.ok){
    let d='';try{const j=await r.json();d=j.message||j.msg||j.hint||'';}catch(e){}
    throw new Error('Servidor '+r.status+(d?': '+d:''));
  }
  if(r.status===204)return null;
  const t=await r.text();
  return t?JSON.parse(t):null;
}

/* ═══ SINCRONIZACIÓN CON LAS TABLAS ═══
   books.data ← asm_libro_v1   ·   desks.data ← asm_desk_v1
   Las dos filas comparten el contador S.meta.rev, el mismo que el
   orquestador ya usaba para detectar conflictos entre dispositivos. */
async function sbPull(){
  const id=encodeURIComponent(miId());
  const [b,d]=await Promise.all([
    sbRest('/books?select=data,rev,updated_at&user_id=eq.'+id),
    sbRest('/desks?select=data,rev&user_id=eq.'+id)
  ]);
  const fb=(b&&b[0])||null, fd=(d&&d[0])||null;
  const libro=fb&&fb.data&&Object.keys(fb.data).length?fb.data:null;
  if(!libro)return {existe:false};
  const datos=JSON.parse(JSON.stringify(libro));
  if(fd&&fd.data&&Object.keys(fd.data).length)datos.desk=fd.data;
  if(!datos.meta||typeof datos.meta!=='object')datos.meta={rev:0,updatedAt:'',device:''};
  /* La columna rev manda: es lo que se compara contra baseRev. */
  datos.meta.rev=Math.max(num(fb.rev),num(datos.meta.rev));
  return {existe:true,rev:num(fb.rev),datos:datos};
}
async function sbPush(){
  const id=miId();

/* ── Volver de un enlace de correo: el token llega en el # ── */
async function revisarEnlace(){
  const h=String(location.hash||'').replace(/^#/,'');
  if(!h||(h.indexOf('access_token')<0&&h.indexOf('error')<0))return false;
  const p={};
  h.split('&').forEach(kv=>{const i=kv.indexOf('=');
    if(i>0)p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));});
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(p.error_description||p.error){
    const T={otp_expired:'Ese enlace ya venció. Pide otro con "Olvidé mi contraseña".',
             access_denied:'Ese enlace ya se usó o venció. Pide otro con "Olvidé mi contraseña".'};
    AUERR=T[p.error_code]||T[p.error]||p.error_description||p.error;
    return false;
  }
  if(!p.access_token||!p.refresh_token)return false;
  adoptarSesion({access_token:p.access_token,refresh_token:p.refresh_token,
    expires_in:num(p.expires_in)||3600});
  return p.type||'sesion';
}
/* Con el token del enlace todavía no sabemos el user_id: lo pide a /auth/v1/user */
async function completarUsuario(){
  const tk=await sbToken();
  if(!tk)return false;
  let r;
  try{
    r=await fetch(SB_URL+'/auth/v1/user',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tk}});
  }catch(e){throw errRed();}
  if(!r.ok){let j=null;try{j=await r.json();}catch(e){}throw new Error(msgAuth(j,r.status));}
  const u=await r.json();
  if(!u||!u.id)return false;
  SES.user={id:u.id,email:u.email||''};
  guardarSes();
  return true;
}

async function guardarClave(){
  const v=$('pwNueva').value;
  if(!v||v.length<8){alert('La contraseña necesita 8 caracteres o más.');return;}
  try{

      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},

/* ── Plan y período gratis ── */
function diasGratis(){
  const p=SES&&SES.perfil;
  if(!p||!p.gratis_hasta)return null;
  return dias(new Date(String(p.gratis_hasta).slice(0,10)+'T00:00:00'),hoy());
}
function planTxt(){
  const p=SES&&SES.perfil;if(!p)return '—';
  if(p.plan==='activo')return 'Activo';
  if(p.plan==='pausado')return 'Pausado';
  const d=diasGratis();
  if(d===null)return 'Gratis';
  const hasta=fDate(String(p.gratis_hasta).slice(0,10));
  if(d<0)return 'Prueba vencida el '+hasta;
  return 'Prueba gratis · '+d+' día'+(d===1?'':'s')+' (hasta '+hasta+')';
}
function bannerPlan(){
  const p=SES&&SES.perfil;if(!p)return '';
  const caja=(color,icon,titulo,texto)=>`<div class="card" style="border-color:${color}38;background:${color}0d;margin-bottom:14px">

      <div style="font-size:11.5px;color:var(--tx2);line-height:1.6;margin-top:3px">${esc(texto)}</div></div></div></div>`;
  if(p.plan==='pausado')
    return caja(C.dan,'AlertCircle','Cuenta pausada',
      'Sigues viendo tu libro, pero la cuenta está pausada. Habla con Eduardo para reactivarla.');
  if(p.plan==='activo')return '';
  const d=diasGratis();

function copiarTexto(txt){
  const done=()=>toast('Copiado');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());}
  else fallback();
  function fallback(){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('Selecciona y copia el texto a mano');}
    document.body.removeChild(ta);
  }
}

      const n=S.leads.filter(l=>ETAPAS[l.etapa]===e).length;
      const pct=activos.length?Math.min(100,n/Math.max(1,activos.length)*100):0;
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:11.5px;color:var(--tx2)">${e}</span>
          <span style="font-size:11.5px;font-weight:700;color:${ETAPA_C[e]}">${n}</span></div>
        <div style="height:5px;border-radius:99px;background:var(--bg3);overflow:hidden">
          <div style="height:100%;border-radius:99px;background:${ETAPA_C[e]};width:${pct}%"></div></div></div>`;}).join('')}
  </div></div>`;
  return out;
};

<script>
/* ═══════════ CLIENTE · alta / edición / ficha ═══════════ */
function openCliente(id){
  const c=id?S.clientes.find(x=>x.id===id):null;
  const g=k=>c?esc(c[k]==null?'':c[k]):'';
  openModal(c?'Editar cliente':'Nuevo cliente',
   `<div class="grid2" style="grid-template-columns:1fr 1fr;gap:11px">
      <div class="fr" style="grid-column:1/-1"><label class="f">Nombre *</label><input class="inp" id="cNom" value="${g('nom')}" placeholder="Nombre del cliente"></div>
      <div class="fr" style="grid-column:1/-1"><label class="f">Teléfono *</label><input class="inp" id="cTel" inputmode="tel" value="${g('tel')}" placeholder="3055551234"></div>
      <div class="fr"><label class="f">Marca</label><input class="inp" id="cMarca" value="${g('marca')}" placeholder="Toyota"></div>
      <div class="fr"><label class="f">Modelo</label><input class="inp" id="cMod" value="${g('mod')}" placeholder="Corolla"></div>
      <div class="fr"><label class="f">Año</label><input class="inp" id="cAno" inputmode="numeric" value="${g('ano')}" placeholder="2024"></div>
      <div class="fr"><label class="f">Tipo</label><select class="inp" id="cTipo">
        ${['lease','finance','cash'].map(t=>`<option value="${t}" ${c&&c.tipo===t?'selected':''}>${tipoLbl(t)}</option>`).join('')}
      </select></div>
      <div class="fr"><label class="f">Mes de venta</label><input class="inp" id="cFecha" type="month" value="${g('fecha')}"></div>
      <div class="fr"><label class="f">Plazo <span class="h">meses</span></label><input class="inp" id="cPlazo" inputmode="numeric" value="${c?esc(c.plazo||''):'36'}" placeholder="36"></div>
      <div class="fr" style="grid-column:1/-1"><label class="f">Notas</label><input class="inp" id="cNotas" value="${g('notas')}" placeholder="Referido de…, cumpleaños…"></div>
      <p style="grid-column:1/-1;font-size:11px;color:var(--tx3);line-height:1.55;margin-top:2px">

    </div>
    ${c?`<button class="btn dan full" style="margin-top:16px" onclick="delCliente('${c.id}')">${ic('Trash2')}Eliminar cliente</button>`:''}`,
   `<button class="btn sec" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveCliente()">${ic('Save')}Guardar</button>`,
   {id:id||null});
}
function saveCliente(){
  const nom=$('cNom').value.trim(), tel=$('cTel').value.trim();
  if(!nom||!tel){alert('Nombre y teléfono son obligatorios.');return;}
  const data={nom,tel,marca:$('cMarca').value.trim(),mod:$('cMod').value.trim(),ano:$('cAno').value.trim(),
    tipo:$('cTipo').value,fecha:$('cFecha').value,plazo:num($('cPlazo').value),notas:$('cNotas').value.trim()};
  if(MODAL_CTX.id){
    const i=S.clientes.findIndex(x=>x.id===MODAL_CTX.id);
    if(i>=0)S.clientes[i]=Object.assign({},S.clientes[i],data);
  }else{
    S.clientes.unshift(Object.assign({id:uid('c'),createdAt:nowISO()},data));
  }
  save();closeModal();toast('Cliente guardado');render();
}
function delCliente(id){
  if(!confirm('¿Eliminar este cliente del libro?'))return;
  S.clientes=S.clientes.filter(x=>x.id!==id);
  save();closeModal();toast('Cliente eliminado');render();
}
function openFicha(id){
  const c=S.clientes.find(x=>x.id===id); if(!c)return;
  const vence=(c.tipo==='lease'&&c.fecha&&num(c.plazo))?addMonths(c.fecha,num(c.plazo)):null;
  const mine=calcAlertas().filter(a=>a.cid===c.id);
  const negs=negociosDe('cliente',c.id);
  openModal(c.nom,
   `<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">
      ${badge(tipoLbl(c.tipo),tipoCol(c.tipo))}${c.fecha?badge('Vendido '+fmtM(addMonths(c.fecha,0)),C.tx3):''}
      ${vence?badge('Vence '+fmtM(vence),C.warn):''}</div>
    <div class="card" style="background:var(--bg3)">
      ${[['Teléfono',esc(c.tel)],['Vehículo',esc(vehCli(c))],['Plazo',c.plazo?c.plazo+' meses':'—'],
         ['Notas',c.notas?esc(c.notas):'—']].map(r=>`<div class="sumrow"><span style="color:var(--tx3)">${r[0]}</span>
         <span style="color:var(--tx2);text-align:right;max-width:60%">${r[1]}</span></div>`).join('')}
    </div>
    <button class="btn full" style="margin-top:12px" onclick="armarNegocio('cliente','${c.id}')">
      🧮 Armar negocio</button>
    ${negs.length?`<div class="card" style="background:var(--bg3);margin-top:10px">
      <div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:7px">
        Negocios armados (${negs.length})</div>
      ${negs.slice(0,3).map(q=>`<div class="sumrow" style="border-bottom:1px solid var(--bd);padding:6px 0">
        <span style="color:var(--tx2)">${esc(q.fecha||'—')} · ${esc(tipoDesk(q.w&&q.w.tipo))}</span>
        <span style="color:var(--tx3);text-align:right;max-width:55%">${esc([q.w&&q.w.marca,q.w&&q.w.modelo].filter(Boolean).join(' ')||'—')}</span>
      </div>`).join('')}
      ${negs.length>3?`<div style="font-size:10.5px;color:var(--tx3);margin-top:7px">+${negs.length-3} más — se ven en Desking</div>`:''}
    </div>`:''}
    ${mine.length?`<div class="mlab">Alertas activas</div>`+mine.map(a=>`<div class="card arow ${a.hot?'hot':''}" style="margin-top:8px">
        <div class="atag">${esc(a.tag)}</div>
        <button class="btn wa sm" style="margin-top:9px" onclick="openMsg(${jsq(c.nom)},${jsq(c.tel)},${jsq(a.msg)})">${ic('Wa')}Escribirle</button>
      </div>`).join(''):''}`,
   `<button class="btn sec" onclick="openCliente('${c.id}')">${ic('Edit2')}Editar</button>
    <button class="btn wa" onclick="msgReconectar('${c.id}')">${ic('Wa')}Reconectar</button>`);
}
function msgReconectar(id){
  const c=S.clientes.find(x=>x.id===id); if(!c)return;
  openMsg(c.nom,c.tel,`Hola ${c.nom}${firma()} 👋 ¿Cómo te ha ido con el ${vehCli(c)}? Te escribo para saludarte y que sepas que aquí sigo para lo que necesites. Y si alguien cercano anda buscando carro, me lo pasas con confianza — lo trato igual que a ti.`);
}

   VISTA · ALERTAS

  const al=calcAlertas();
  let out=`<div class="stack">
    <div><h2 class="vh">Alertas</h2>
      <div class="vsub">Fin de lease, refinanciación, aniversarios y post-venta — calculados solos desde tus datos reales.</div></div>`;

    out+=`<div class="card pad0">${empty('Bell','Sin alertas por ahora',

<script>
/* ═══════════════════════════════════════════
   VISTA · LEADS
═══════════════════════════════════════════ */
VIEWS.leads=function(){
  return `<div class="stack">
    <div class="rowb"><div><h2 class="vh">Leads</h2>
      <div class="vsub">Ordenados por urgencia real: etapa, antigüedad y presupuesto.</div></div>
      <button class="btn sm" onclick="openQuick()">${ic('UserPlus')}Nuevo</button></div>
    <input class="inp" placeholder="Nombre, vehículo, teléfono…" value="${esc(Q)}"
      oninput="Q=this.value;document.getElementById('leadList').innerHTML=leadList()">
    <div style="display:flex;gap:8px">
      <select class="inp" onchange="FSRC=this.value;document.getElementById('leadList').innerHTML=leadList()">
        ${['Todos'].concat(ORIGENES).map(o=>`<option ${FSRC===o?'selected':''}>${o}</option>`).join('')}</select>
      <select class="inp" onchange="FEST=this.value;document.getElementById('leadList').innerHTML=leadList()">
        ${['Todos'].concat(ETAPAS).map(o=>`<option ${FEST===o?'selected':''}>${o}</option>`).join('')}</select>
    </div>
    <div id="leadList">${leadList()}</div></div>`;
};
function leadList(){
  const q=Q.toLowerCase();
  const vis=S.leads
    .filter(l=>FSRC==='Todos'||l.origen===FSRC)
    .filter(l=>FEST==='Todos'||ETAPAS[l.etapa]===FEST)
    .filter(l=>!q||[l.nom,l.tel,l.email,l.veh&&l.veh.marca,l.veh&&l.veh.mod].join(' ').toLowerCase().includes(q))
    .map(l=>({l,u:getUrgency(l)})).sort((a,b)=>b.u.score-a.u.score);
  if(!vis.length)return `<div class="card pad0">${S.leads.length
    ? empty('Search','Sin resultados','Cambia los filtros o el término de búsqueda.')
    : empty('Users','Sin leads todavía','Toca <b style="color:var(--p)">Nuevo</b> y captura tu primer prospecto. Del captador, de Instagram, de donde llegue.')}</div>`;
  return `<div class="card pad0">`+vis.map(x=>{
    const l=x.l,u=x.u,f=finanzas(l);
    const tar=S.tareas.filter(t=>t.leadId===l.id&&!t.hecha).length;
    return `<button class="lrow" onclick="openDeal('${l.id}')">
      <div class="heat" style="background:${u.color}"></div>
      <div class="body"><div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
          <span class="lname">${esc(l.nom)}</span>${badge(ETAPAS[l.etapa],ETAPA_C[ETAPAS[l.etapa]])}</div>
        <div class="lmeta">${esc(vehLead(l))}</div>
        <div class="tagrow">
          <span style="font-size:10.5px;color:var(--p);font-weight:700">${fm(f.precio||num(l.veh&&l.veh.pres))}</span>
          <span style="font-size:10px;color:var(--tx3)">${esc(l.origen)}</span>
          ${tar?badge(tar+' tarea'+(tar>1?'s':''),C.warn):''}
          ${l.trade&&l.trade.has?badge('Trade-In',C.info):''}
        </div></div>
      <div style="text-align:right;flex-shrink:0"><div style="font-size:10px;font-weight:800;color:${u.color}">${u.label}</div>
        <div class="mono" style="font-size:10px;color:var(--tx3);margin-top:2px">${u.score}</div></div>
      ${ic('ChevronRight',14,C.tx3)}</div></button>`;}).join('')+`</div>`;

/* ── Captura rápida ── */
function openQuick(){
  openModal('Captura rápida de lead',
   `<div class="grid2" style="grid-template-columns:1fr 1fr;gap:11px">
      <div class="fr" style="grid-column:1/-1"><label class="f">Nombre *</label><input class="inp" id="qNom" placeholder="Nombre del prospecto"></div>
      <div class="fr" style="grid-column:1/-1"><label class="f">Teléfono *</label><input class="inp" id="qTel" inputmode="tel" placeholder="3055551234"></div>
      <div class="fr"><label class="f">Marca</label><input class="inp" id="qMarca" placeholder="Toyota"></div>
      <div class="fr"><label class="f">Modelo</label><input class="inp" id="qMod" placeholder="RAV4"></div>
      <div class="fr"><label class="f">Presupuesto $</label><input class="inp" id="qPres" inputmode="numeric" placeholder="35000"></div>
      <div class="fr"><label class="f">Origen</label><select class="inp" id="qOrigen">
        ${ORIGENES.map(o=>`<option${o==='Walk-in'?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="fr" style="grid-column:1/-1"><label class="f">Interés / nota</label><input class="inp" id="qNota" placeholder="SUV, crédito bueno, este mes…"></div>
    </div>`,
   `<button class="btn sec" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveQuick()">${ic('UserPlus')}Crear y abrir</button>`);
}
function saveQuick(){
  const nom=$('qNom').value.trim(), tel=$('qTel').value.trim();
  if(!nom||!tel){alert('Nombre y teléfono son obligatorios.');return;}
  const l=nuevoLead({nom,tel,marca:$('qMarca').value.trim(),mod:$('qMod').value.trim(),
    pres:$('qPres').value,origen:$('qOrigen').value,notas:$('qNota').value.trim(),ano:new Date().getFullYear()});
  S.leads.unshift(l);save();closeModal();toast('Lead "'+nom+'" creado');openDeal(l.id,1);
}

/* ═══════════════════════════════════════════
   VISTA · PIPELINE (kanban)
═══════════════════════════════════════════ */
VIEWS.pipeline=function(){
  const total=S.leads.filter(l=>ETAPAS[l.etapa]!=='Perdido')
    .reduce((s,l)=>s+(finanzas(l).precio||num(l.veh&&l.veh.pres)),0);
  let out=`<div class="stack">
    <div class="rowb"><div><h2 class="vh">Sales Pipeline</h2>
      <div class="vsub">Valor total: <span style="color:var(--p);font-weight:700">${fm(total)}</span> · al llegar a <b style="color:var(--ok)">Vendido</b> pasa a tu libro.</div></div>
      <button class="btn sm" onclick="openQuick()">${ic('Plus')}Lead</button></div>`;
  if(!S.leads.length){out+=`<div class="card pad0">${empty('Briefcase','Pipeline vacío','Los leads nuevos aparecen en la columna <b style="color:var(--info)">Nuevo</b> y avanzan con las flechas.')}</div></div>`;return out;}
  out+=`<div class="kan sh">`+ETAPAS.map(e=>{
    const col=ETAPA_C[e], items=S.leads.filter(l=>ETAPAS[l.etapa]===e);
    const st=items.reduce((s,l)=>s+(finanzas(l).precio||num(l.veh&&l.veh.pres)),0);
    return `<div class="kcol">
      <div class="khead" style="border-top:3px solid ${col}">
        <div class="rowb"><span style="font-size:12px;font-weight:700">${e}</span>
          <span style="font-size:10px;font-weight:800;background:${col}22;color:${col};padding:2px 7px;border-radius:99px">${items.length}</span></div>
        <div class="mono" style="font-size:10px;color:var(--tx3);margin-top:2px">${fm(st)}</div></div>
      <div style="display:flex;flex-direction:column;gap:8px;min-height:120px">
        ${items.length?items.map(l=>{const u=getUrgency(l);return `<div class="kcard">
          <div class="hb" style="background:${u.color}"></div>
          <div style="padding:10px 12px" onclick="openDeal('${l.id}')">
            <div style="font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.nom)}</div>
            <div style="font-size:11px;color:var(--tx3);margin-top:2px">${esc(vehLead(l))}</div>
            <div class="mono" style="font-size:12px;font-weight:700;color:var(--p);margin-top:4px">${fm(finanzas(l).precio||num(l.veh&&l.veh.pres))}</div>
          </div>
          <div style="display:flex;gap:5px;padding:6px 10px;border-top:1px solid var(--bd);justify-content:flex-end">
            <button class="btn ghost xs" style="border:1px solid var(--bd);background:var(--bg3)" onclick="mover('${l.id}',-1)">◀</button>
            <button class="btn ghost xs" style="border:1px solid var(--bd);background:var(--bg3)" onclick="mover('${l.id}',1)">▶</button>
          </div></div>`;}).join('')
        :`<div style="text-align:center;color:var(--tx3);font-size:11px;padding:22px 0;border:1px dashed var(--bd);border-radius:10px">Sin tratos</div>`}
      </div></div>`;}).join('')+`</div></div>`;
  return out;
};
function mover(id,dir){
  const l=S.leads.find(x=>x.id===id); if(!l)return;
  const ni=Math.max(0,Math.min(ETAPAS.length-1,l.etapa+dir));
  if(ni===l.etapa)return;
  l.etapa=ni; l.updatedAt=nowISO();
  l.acts.unshift({id:uid('a'),tipo:'stage_change',autor:S.cfg.nombre||'Yo',
    txt:'Fase actualizada: "'+ETAPAS[ni]+'"',fecha:nowISO()});
  save();
  if(ETAPAS[ni]==='Vendido')pasarAlLibro(l.id);
  else render();
}
/* ── Pipeline → Libro (motor del libro) ── */
function pasarAlLibro(id){
  const l=S.leads.find(x=>x.id===id); if(!l)return;
  if(S.clientes.some(c=>c.leadId===l.id)){render();toast('Ya está en tu libro');return;}
  const tipoDeal=(l.deal&&l.deal.tipo)||'Financiado';
  const tipo=tipoDeal==='Lease'?'lease':tipoDeal==='Contado'?'cash':'finance';
  openModal('🎉 ¡Cerrado!',
   `<p style="font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:14px">
      Pasa a <b style="color:var(--tx)">${esc(l.nom)}</b> a tu libro de clientes. Con estos dos datos, las alertas de fin de lease, refi y aniversario se calculan solas.</p>
    <div class="grid2" style="grid-template-columns:1fr 1fr;gap:11px">
      <div class="fr"><label class="f">Tipo</label><select class="inp" id="pbTipo">
        ${['lease','finance','cash'].map(t=>`<option value="${t}"${t===tipo?' selected':''}>${tipoLbl(t)}</option>`).join('')}</select></div>
      <div class="fr"><label class="f">Plazo <span class="h">meses</span></label><input class="inp" id="pbPlazo" inputmode="numeric" value="${esc(num(l.deal&&l.deal.plazo)||36)}"></div>
      <div class="fr" style="grid-column:1/-1"><label class="f">Mes de venta</label><input class="inp" id="pbFecha" type="month" value="${thisMonth()}"></div>
    </div>`,
   `<button class="btn sec" onclick="closeModal();render()">Ahora no</button>
    <button class="btn ok" onclick="confirmarLibro('${l.id}')">${ic('BookOpen')}Pasar al libro</button>`);
}
function confirmarLibro(id){
  const l=S.leads.find(x=>x.id===id); if(!l)return;
  S.clientes.unshift({id:uid('c'),leadId:l.id,nom:l.nom,tel:l.tel,
    marca:(l.veh&&l.veh.marca)||'',mod:(l.veh&&l.veh.mod)||'',ano:(l.veh&&l.veh.ano)||'',
    tipo:$('pbTipo').value,fecha:$('pbFecha').value,plazo:num($('pbPlazo').value),

VIEWS.tasks=function(){
  const vis=S.tareas.slice().sort((a,b)=>
    (!a.hecha&&b.hecha)?-1:(a.hecha&&!b.hecha)?1:String(a.vence||'').localeCompare(String(b.vence||'')));

  return `<div class="stack">
    <div class="rowb"><div><h2 class="vh">Tareas y compromisos</h2>
      <div class="vsub">${pend.length} pendiente${pend.length===1?'':'s'} · ${venc.length} vencida${venc.length===1?'':'s'}</div></div>
      <button class="btn sm" onclick="openTarea()">${ic('Plus')}Nueva</button></div>
    ${vis.length?`<div style="display:flex;flex-direction:column;gap:8px">`+vis.map(t=>{
      const ov=!t.hecha&&t.vence&&t.vence<today();
      return `<div class="card" style="display:flex;align-items:center;gap:11px;padding:12px 14px;border-color:${ov?'rgba(239,68,68,.3)':'var(--bd)'}">
        <input type="checkbox" ${t.hecha?'checked':''} onchange="toggleTarea('${t.id}')" style="accent-color:${C.ok};width:17px;height:17px;flex-shrink:0">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:600;color:${t.hecha?C.tx3:C.tx};${t.hecha?'text-decoration:line-through':''}">${esc(t.titulo)}</span>
            ${ov?badge('Vencida',C.dan):''}${badge(t.prio,t.prio==='Alta'?C.p:t.prio==='Media'?C.warn:C.tx3)}</div>
          <div style="font-size:11px;color:var(--tx3);margin-top:3px">${esc(t.leadNom||'General')} · ${fDate(t.vence)}</div></div>
        <button class="iconbtn" onclick="delTarea('${t.id}')">${ic('Trash2',14,C.tx3)}</button>
      </div>`;}).join('')+`</div>`
    :`<div class="card pad0">${empty('CheckSquare','Sin tareas','Agrega compromisos de seguimiento — o créalos desde el paso <b style="color:var(--tx2)">Workspace</b> de cada lead.')}</div>`}
  </div>`;
};
function openTarea(leadId){
  const l=leadId?S.leads.find(x=>x.id===leadId):null;
  openModal('Nueva tarea',
   `<div class="grid2" style="grid-template-columns:1fr 1fr;gap:11px">
      <div class="fr" style="grid-column:1/-1"><label class="f">Título *</label><input class="inp" id="tTit" placeholder="Llamar al cliente…"></div>
      <div class="fr" style="grid-column:1/-1"><label class="f">Prospecto asociado</label><input class="inp" id="tLead" value="${l?esc(l.nom):''}" placeholder="Nombre del cliente"></div>
      <div class="fr"><label class="f">Vence</label><input class="inp" id="tVence" type="date" value="${today()}"></div>
      <div class="fr"><label class="f">Prioridad</label><select class="inp" id="tPrio">
        <option>Alta</option><option>Media</option><option>Baja</option></select></div>
    </div>`,
   `<button class="btn sec" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveTarea()">${ic('Save')}Guardar</button>`,{leadId:leadId||''});
}
function saveTarea(){
  const t=$('tTit').value.trim(); if(!t){alert('Escribe el título de la tarea.');return;}
  S.tareas.unshift({id:uid('t'),leadId:MODAL_CTX.leadId||'',leadNom:$('tLead').value.trim()||'General',
    titulo:t,vence:$('tVence').value,prio:$('tPrio').value,hecha:false});

}
function toggleTarea(id){const t=S.tareas.find(x=>x.id===id);if(t){t.hecha=!t.hecha;save();render();}}
function delTarea(id){S.tareas=S.tareas.filter(x=>x.id!==id);save();render();}

   VISTA · TRADE-INS
═══════════════════════════════════════════ */
VIEWS.tradeins=function(){
  const vis=S.leads.filter(l=>l.trade&&l.trade.has);
  const acv=vis.reduce((s,l)=>s+num(l.trade.acv),0);
  const mi=vis.length?Math.round(vis.reduce((s,l)=>s+num(l.trade.millas),0)/vis.length):0;
  let out=`<div class="stack"><h2 class="vh">Retomas / Trade-Ins</h2>
    <div class="grid2">
      ${kpi('RefreshCw','Total retomas',vis.length,'',C.p)}
      ${kpi('DollarSign','ACV acumulado',fm(acv),'',C.ok)}
      ${kpi('Activity','Millas promedio',fmN(mi)+' mi','',C.warn)}
      ${kpi('TrendingUp','Equity total',fm(vis.reduce((s,l)=>s+(num(l.trade.allowance)-num(l.trade.payoff)),0)),'',C.info)}
    </div>`;
  if(!vis.length){out+=`<div class="card pad0">${empty('RefreshCw','Sin retomas','Marca <b style="color:var(--tx2)">"El cliente tiene trade-in"</b> en el paso 4 del Deal Room y aparecerán aquí.')}</div>`;}
  else out+=`<div class="grid1">`+vis.map(l=>{const t=l.trade,eq=num(t.allowance)-num(t.payoff);
    return `<div class="card">
      <div class="rowb" style="margin-bottom:10px">${badge('Trade-In',C.info)}
        <span class="mono" style="font-size:9.5px;color:var(--tx3)">${esc((t.vin||'').slice(-8)||'—')}</span></div>
      <div style="font-size:15px;font-weight:800">${esc([t.ano,t.marca,t.mod].filter(Boolean).join(' ')||'Vehículo sin datos')}</div>
      <div style="font-size:11px;color:var(--tx3);margin-top:2px">Propietario: <span style="color:var(--tx2)">${esc(l.nom)}</span></div>
      <div class="grid2" style="grid-template-columns:1fr 1fr;gap:9px;margin-top:12px">
        ${[['ACV',fm(t.acv),C.ok],['Allowance',fm(t.allowance),C.tx2],['Payoff',fm(t.payoff),C.warn],['Millaje',fmN(t.millas)+' mi',C.tx3]]
          .map(r=>`<div><div style="font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px">${r[0]}</div>
          <div class="mono" style="font-size:13px;font-weight:700;color:${r[2]}">${r[1]}</div></div>`).join('')}
      </div>
      <div class="rowb" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--bd)">
        <div><div style="font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em">Equity</div>
          <div class="mono" style="font-size:15px;font-weight:800;color:${eq>=0?C.ok:C.dan}">${fm(eq)}</div></div>
        <button class="btn sec sm" onclick="openDeal('${l.id}',4)">Ver →</button></div>
    </div>`;}).join('')+`</div>`;

};

<script>
/* ═══════════════════════════════════════════

═══════════════════════════════════════════ */
VIEWS.promos=function(){
  let out=`<div class="stack">
    <div><h2 class="vh">Programas del mes</h2>
      <div class="vsub">Carga el programa con sus números reales. Te genera el post para redes y te dice a qué clientes tuyos enviárselo.</div></div>
    <div class="card">
      <div class="grid2" style="grid-template-columns:1fr 1fr;gap:10px">
        <div class="fr"><label class="f">Marca *</label><input class="inp" id="pMarca" placeholder="Toyota"></div>
        <div class="fr"><label class="f">Modelo *</label><input class="inp" id="pModelo" placeholder="Corolla LE"></div>
        <div class="fr"><label class="f">$ / mes</label><input class="inp" id="pPago" inputmode="numeric" placeholder="199"></div>
        <div class="fr"><label class="f">Al firmar</label><input class="inp" id="pDas" inputmode="numeric" placeholder="3999"></div>
        <div class="fr"><label class="f">Meses</label><input class="inp" id="pPlazo" inputmode="numeric" placeholder="36"></div>
        <div class="fr"><label class="f">Millas/año</label><input class="inp" id="pMillas" inputmode="numeric" placeholder="10000"></div>
        <div class="fr" style="grid-column:1/-1"><label class="f">Expira</label><input class="inp" id="pExp" placeholder="8/31"></div>
        <div class="fr" style="grid-column:1/-1"><label class="f">Nota / letra chica</label><input class="inp" id="pNota" placeholder="Tier 1, excluye tax y tags…"></div>
      </div>
      <button class="btn full" style="margin-top:12px" onclick="addPromo()">${ic('Save')}Guardar programa</button>
    </div>`;
  if(!S.promos.length){out+=`<div class="card pad0">${empty('Tag','Sin programas cargados','Carga aquí los programas de lease de todas tus marcas, mes a mes.')}</div>`;}
  else out+=S.promos.map(p=>{
    const mismos=S.clientes.filter(c=>(c.marca||'').toLowerCase()===p.marca.toLowerCase());
    const otros=S.clientes.filter(c=>c.marca&&(c.marca||'').toLowerCase()!==p.marca.toLowerCase());
    return `<div class="promo">
      <div class="phead">
        <div class="pbrand">${esc(p.marca)}</div>
        <div class="pmodel">${esc(p.modelo||'')}</div>
        ${p.pago?`<div class="ppay mono">${fm(p.pago)}<small> /mes · ${fm(p.das)} al firmar · ${esc(p.plazo)}m · ${fmN(p.millas)} mi</small></div>`:''}
      </div>
      ${(p.nota||p.exp)?`<div class="pfine">${esc(p.nota||'')}${p.exp?(p.nota?' · ':'')+'Expira '+esc(p.exp):''}</div>`:''}
      <div style="padding:12px 16px 14px">
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn sm" onclick="copiarPost('${p.id}')">${ic('Copy')}Copiar post</button>
          <button class="btn sec sm" onclick="togMatch('${p.id}')">Clientes (${mismos.length})</button>
          <button class="btn ghost sm" onclick="delPromo('${p.id}')">${ic('Trash2')}</button>
        </div>
        <div id="match-${p.id}" style="display:none;margin-top:11px;border-top:1px solid var(--bd);padding-top:4px">
          ${mismos.length?`<div class="mlab">Tienen ${esc(p.marca)}</div>`+mismos.map(c=>
            `<div class="mrow"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.nom)} · ${esc(vehCli(c))}</span>
             <button class="btn wa xs" onclick="promoMsg('${c.id}','${p.id}',1)">${ic('Wa')}WA</button></div>`).join('')
            :`<p style="font-size:12px;color:var(--tx3);margin-top:10px">Nadie con esta marca en tu libro todavía.</p>`}
          ${otros.length?`<div class="mlab">Otras marcas — ofrecer cambio</div>`+otros.slice(0,15).map(c=>
            `<div class="mrow"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.nom)} · ${esc(c.marca)}</span>
             <button class="btn wa xs" onclick="promoMsg('${c.id}','${p.id}',0)">${ic('Wa')}WA</button></div>`).join(''):''}
        </div>
      </div></div>`;}).join('');
  return out+'</div>';
};
function addPromo(){
  const marca=$('pMarca').value.trim(), modelo=$('pModelo').value.trim();
  if(!marca||!modelo){alert('Marca y modelo son obligatorios.');return;}
  S.promos.unshift({id:uid('p'),marca,modelo,pago:num($('pPago').value),das:num($('pDas').value),
    plazo:$('pPlazo').value.trim()||'36',millas:num($('pMillas').value)||10000,
    exp:$('pExp').value.trim(),nota:$('pNota').value.trim(),
    mes:new Date().toLocaleDateString('es-US',{month:'long',year:'numeric'})});
  save();toast('Programa guardado');render();
}
function delPromo(id){if(confirm('¿Eliminar este programa?')){S.promos=S.promos.filter(p=>p.id!==id);save();render();}}
function togMatch(id){const e=$('match-'+id);e.style.display=e.style.display==='none'?'block':'none';}
function promoLinea(p){
  return `${p.marca} ${p.modelo} — ${fm(p.pago)}/mes · ${fm(p.das)} al firmar · ${p.plazo} meses · ${fmN(p.millas)} mi/año`;
}
function promoMsg(cid,pid,misma){
  const c=S.clientes.find(x=>x.id===cid), p=S.promos.find(x=>x.id===pid);
  if(!c||!p)return;
  const linea=promoLinea(p);
  const t=misma
   ? `Hola ${c.nom}${firma()} 👋 Salió el programa de ${p.marca} este mes y me acordé de ti: ${linea}. ${p.nota?p.nota+'. ':''}Si te interesa te paso los números completos, sin compromiso.`
   : `Hola ${c.nom}${firma()} 👋 ¿Cómo va todo con tu ${vehCli(c)}? Este mes salió un programa fuerte: ${linea}. Si alguna vez pensaste en cambiar, este es buen mes para mirar. Sin compromiso.`;
  openMsg(c.nom,c.tel,t);
}
function copiarPost(pid){
  const p=S.promos.find(x=>x.id===pid); if(!p)return;
  const wa=tel10(S.cfg.wa);
  const post=
`🚗 ${p.marca.toUpperCase()} ${p.modelo||''} — ${p.pago?fm(p.pago)+'/MES':''}

✅ ${fm(p.das)} al firmar (todo claro, sin sorpresas)
✅ ${p.plazo} meses · ${fmN(p.millas)} millas/año
${p.nota?'📋 '+p.nota+'\n':''}${p.exp?'⏰ Válido hasta '+p.exp+'\n':''}
El número COMPLETO, con la letra chica incluida.
Así trabajo yo — sin sorpresas al firmar.

📲 Escríbeme${wa?': wa.me/'+wa:' por DM'}
#autosmiami #lease #${p.marca.toLowerCase()} #miami`;
  openModal('Post para redes',
    `<label class="f">Listo para pegar en IG, Facebook o TikTok</label>
     <textarea class="inp" id="msgTxt" rows="12">${esc(post)}</textarea>`,
    `<button class="btn sec" onclick="closeModal()">Cerrar</button>
     <button class="btn" onclick="copiarTexto(document.getElementById('msgTxt').value)">${ic('Copy')}Copiar post</button>`);
}
</script>
<script>
/* ═══════════════════════════════════════════

VIEWS.reports=function(){
  const vis=S.leads;

  const rate=vis.length?Math.round(vendidos.length/vis.length*100):0;
  const gross=vendidos.reduce((s,l)=>s+finanzas(l).totalGross,0);
  const venc=S.tareas.filter(t=>!t.hecha&&t.vence&&t.vence<today());
  const src=ORIGENES.map(o=>{
    const c=vis.filter(l=>l.origen===o).length, sc=vis.filter(l=>l.origen===o&&ETAPAS[l.etapa]==='Vendido').length;
    return{o,c,sc,r:c?Math.round(sc/c*100):0};}).filter(x=>x.c>0);
  const lease=S.clientes.filter(c=>c.tipo==='lease').length,
        fin=S.clientes.filter(c=>c.tipo==='finance').length,
