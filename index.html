/* ═══ WORKSHEET — la hoja del negocio ═══
   Se imprime, se manda por WhatsApp o por correo. Sin Social: aquí no
   hay nada sensible, así que sí se puede enviar.
   Si el negocio se armó en Desking, se usan SUS números — para lease son
   los buenos (money factor y residual). El Deal Room calcula el pago con
   una fórmula de préstamo, que para lease no aplica. */

/* Mismo cálculo que hace Desking, leyendo la cotización guardada */
function calcDesk(W){
  const N=v=>num(v);
  const precio=N(W.precio), msrp=N(W.msrp)||precio;
  const fees=N(W.docFee)+N(W.tagFee)+N(W.otros);
  const allow=N(W.tradeAllow), payoff=N(W.tradePayoff), equity=allow-payoff;
  const rebates=N(W.rebates), down=N(W.down), taxR=N(W.taxPct)/100;
  if(W.tipo==='finance'||W.tipo==='cash'){
    const taxBase=Math.max(0,precio-allow);
    const tax=taxBase*taxR;
    const otd=precio+fees+tax-rebates;
    const financiar=Math.max(0,otd-equity-down);
    let pago=0;
    if(W.tipo==='finance'){
      const r=N(W.apr)/100/12, n=N(W.plazoF)||60;
      pago=r>0?financiar*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1):financiar/n;
    }
    return {tipo:W.tipo,precio,msrp,fees,tax,otd,financiar,pago,equity,down,rebates,allow,payoff,
      apr:N(W.apr),plazo:N(W.plazoF)||60,
      alFirmar:W.tipo==='cash'?Math.max(0,otd-equity):down};
  }
  const residual=msrp*N(W.residPct)/100;
  const capRed=down+Math.max(0,equity)+rebates;
  const capCost=precio+N(W.acqFee)-capRed+Math.max(0,-equity);
  const n=N(W.plazoL)||36, mf=N(W.mf);
  const dep=(capCost-residual)/n;
  const renta=(capCost+residual)*mf;
  const base=dep+renta;
  const pago=base*(1+taxR);
  return {tipo:'lease',precio,msrp,fees,residual,capCost,pago,base,down,rebates,equity,allow,payoff,
    plazo:n,millas:N(W.millas),mf,aprEq:mf*2400,acqFee:N(W.acqFee),
    alFirmar:pago+down+fees};
}
/* Las cotizaciones que Desking guardó para este lead o cliente */
function cotsDe(kind,id){
  try{
    const r=localStorage.getItem('asm_desk_v1'); if(!r)return [];
    const d=JSON.parse(r);
    return (d&&Array.isArray(d.cotizaciones)?d.cotizaciones:[])
      .filter(q=>q&&q.vinculo&&q.vinculo.kind===kind&&q.vinculo.id===id&&q.w);
  }catch(e){return [];}
}

/* Traer a la Oferta y al Cierre los numeros que se armaron en Desking.
   Desking es el motor; el Deal Room recibe. Se pide confirmacion porque
   pisa lo que haya escrito a mano. */
function traerDeDesking(){
  const l=L(); if(!l)return;
  const cots=cotsDe('lead',l.id);
  if(!cots.length){alert('Este negocio no tiene cotizaciones de Desking todavía.');return;}
  const q=cots[0], w=q.w||{};
  const veh=[w.ano,w.marca,w.modelo].filter(Boolean).join(' ');
  const c=calcDesk(w);
  const resumen=[
    'Cotización del '+(q.fecha||'')+(veh?' · '+veh:''),
    '',
    'Tipo: '+(w.tipo==='lease'?'Lease':w.tipo==='cash'?'Contado':'Financiado'),
    'Precio: '+fm(w.precio),
    w.tipo==='lease' ? 'Pago: '+fm(c.pago)+'/mes con tax · '+fm(c.alFirmar)+' al firmar'
                     : 'Pago: '+fm(c.pago)+'/mes · '+fm(c.financiar)+' a financiar',
    '',
    'Esto reemplaza los números que tengas escritos aquí. ¿Seguir?'
  ].join(String.fromCharCode(10));
  if(!confirm(resumen))return;

  l.oferta=l.oferta||{};
  l.oferta.precio=num(w.precio);
  l.oferta.msrp=num(w.msrp)||num(w.precio);
  l.oferta.fees=num(w.docFee)+num(w.tagFee)+num(w.otros);
  l.oferta.rebates=num(w.rebates);
  l.oferta.down=num(w.down);
  if(w.tipo!=='lease')l.oferta.tax=Math.round(c.tax||0);
  if(w.stock)l.oferta.stock=w.stock;
  if(w.vin)l.oferta.vin=w.vin;

  l.trade=l.trade||{};
  if(num(w.tradeAllow)||num(w.tradePayoff)){
    l.trade.has=true;
    l.trade.allowance=num(w.tradeAllow);
    l.trade.payoff=num(w.tradePayoff);
    if(!num(l.trade.acv))l.trade.acv=num(w.tradeAllow);
  }

  l.deal=l.deal||{};
  l.deal.tipo = w.tipo==='lease'?'Lease' : w.tipo==='cash'?'Contado' : 'Financiado';
  l.deal.taxPct=num(w.taxPct)||TAX_FL;
  if(w.tipo==='lease'){
    l.deal.plazo=num(w.plazoL)||36;
    l.deal.residPct=num(w.residPct);
    l.deal.mf=w.mf;
    l.deal.acqFee=num(w.acqFee);
    l.deal.millas=num(w.millas);
  }else{
    l.deal.plazo=num(w.plazoF)||60;
    l.deal.apr=num(w.apr);
  }
  if(!l.veh)l.veh={};
  if(w.ano)l.veh.ano=w.ano;
  if(w.marca)l.veh.marca=w.marca;
  if(w.modelo)l.veh.mod=w.modelo;

  l.updatedAt=nowISO(); save();
  toast('Números traídos de Desking');
  render();
}

  if(cots.length&&sel>=0&&cots[sel])return {c:calcDesk(cots[sel].w), w:cots[sel].w, fuente:'desking'};
  const f=finanzas(l);
  const tipo=String((l.deal&&l.deal.tipo)||'').toLowerCase();
  return {c:{tipo:tipo==='lease'?'lease':tipo==='contado'?'cash':'finance',
    precio:f.precio,msrp:f.msrp,fees:f.fees,tax:f.tax,rebates:f.rebates,down:f.down,

    pago:f.pago,apr:f.apr,plazo:f.plazo,alFirmar:f.down},
    w:null, fuente:'crm'};
}

/* ═══════════ WHATSAPP ═══════════ */
function openMsg(titulo,tel,texto,alt,idioma){
  window.__msgES = idioma==='en' ? (alt||texto) : texto;
  window.__msgEN = idioma==='en' ? texto : (alt||'');
  const t=tel10(tel);
  openModal(titulo,
    `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px">
       <label class="f" style="margin:0">Mensaje — edítalo si quieres</label>
       ${window.__msgEN?`<div style="display:flex;gap:4px">
         <button class="btn ${idioma==='en'?'sec':''} xs" id="btES" onclick="cambiarIdiomaMsg('es')">Español</button>
         <button class="btn ${idioma==='en'?'':'sec'} xs" id="btEN" onclick="cambiarIdiomaMsg('en')">English</button>
       </div>`:''}
     </div>
     <textarea class="inp" id="msgTxt" rows="7">${esc(texto)}</textarea>
     <p style="font-size:13px;color:var(--tx3);margin-top:10px;line-height:1.6">
     ${t?`Se abre TU WhatsApp con el mensaje listo para <b style="color:var(--tx2)">+${esc(t)}</b>. Uno por uno, natural — sin riesgo de bloqueo.`
        :'<span style="color:#eab308">Este contacto no tiene teléfono válido.</span> Agrégalo en su ficha para poder escribirle.'}</p>`,
    `<button class="btn sec" onclick="copiarTexto(document.getElementById('msgTxt').value)">${ic('Copy')}Copiar</button>
     <button class="btn wa" ${t?'':'disabled'} onclick="mandarWa()">${ic('Wa')}Abrir WhatsApp</button>`,
    {tel:t});
}
function cambiarIdiomaMsg(l){
  const t=$('msgTxt'); if(!t)return;
  t.value = l==='en' ? (window.__msgEN||t.value) : (window.__msgES||t.value);
  const es=$('btES'), en=$('btEN');
  if(es)es.className='btn '+(l==='en'?'sec ':'')+'xs';
  if(en)en.className='btn '+(l==='en'?'':'sec ')+'xs';
}
function mandarWa(){
  const t=MODAL_CTX.tel; if(!t)return;
  const txt=$('msgTxt')?$('msgTxt').value:'';
  window.open('https://wa.me/'+t+'?text='+encodeURIComponent(txt),'_blank');
  closeModal();
}
function copiarTexto(txt){
  const done=()=>toast('Copiado');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());}
  else fallback();
  function fallback(){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('Selecciona y copia el texto a mano');}
    document.body.removeChild(ta);
  }
}
function msgAlerta(i){
  const a=calcAlertas()[i]; if(!a)return;
  openMsg(a.nom,a.tel,enIngles(a)?(a.msgEN||a.msg):a.msg,enIngles(a)?a.msg:a.msgEN,a.idioma||'es');
}

<script>
/* ═══════════ CLIENTE · alta / edición / ficha ═══════════ */
/* ═══ Agencias de seguro conocidas (el campo queda editable) ═══ */
const AGENCIAS=['El Toro Insurance','Univista Insurance','Caley Insurance','Insurance Nation'];

/* ═══ ANTI-DUPLICADOS ═══
   Dentro del libro de un vendedor no puede haber dos veces la misma
   persona. Se compara telefono, correo, nombre+apellido y direccion,
   normalizando: "305-555-1234" y "13055551234" son el mismo numero. */
const normTel=t=>{let d=String(t||'').replace(/\D/g,'');return d.length===11&&d[0]==='1'?d.slice(1):d;};
const normTxt=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const nombreCompleto=o=>normTxt((o.nom||'')+' '+(o.apellido||''));

function buscarDuplicado(lista,d,exceptoId){
  const tel=normTel(d.tel), em=normTxt(d.email), dir=normTxt(d.dir), nc=nombreCompleto(d);
  for(const x of lista){
    if(exceptoId&&x.id===exceptoId)continue;
    if(tel&&tel.length>=10&&normTel(x.tel)===tel)return{x,campo:'el mismo teléfono'};
    if(em&&normTxt(x.email)===em)return{x,campo:'el mismo correo'};
    if(nc&&nc.length>4&&nombreCompleto(x)===nc)return{x,campo:'el mismo nombre y apellido'};
    if(dir&&dir.length>8&&normTxt(x.dir)===dir)return{x,campo:'la misma dirección'};
  }
  return null;
}
function avisoDuplicado(dup,queEs){
  alert('Ya tienes a esta persona en tu '+queEs+'.\n\n'+
    (dup.x.nom||'')+' '+(dup.x.apellido||'')+'  ·  '+(dup.x.tel||'')+
    '\n\nCoincide '+dup.campo+'.\n\n'+
    'No se crea por duplicado: abre la ficha que ya existe y actualízala.');
}

      <div class="fr" style="grid-column:1/-1"><label class="f">En qué idioma le escribes
        <span class="h">todos sus mensajes salen así</span></label>
        <select class="inp" id="cIdioma">
          <option value="es" ${(!c||c.idioma!=='en')?'selected':''}>Español</option>
          <option value="en" ${(c&&c.idioma==='en')?'selected':''}>English</option>
        </select></div>

        autocapitalize="characters" placeholder="T24519"></div>

          spellcheck="false" placeholder="1HGCM82633A004352" oninput="this.value=this.value.toUpperCase()"></div>

    <div class="mlab">Seguro</div>
    <div class="fr"><label class="f">Agencia <span class="h">quién se lo vendió, no la aseguradora</span></label>
      <input class="inp" id="cAgencia" list="dlAgencias" value="${g('agencia')}" placeholder="El Toro, Univista, Caley…"></div>

    <div class="mlab">El negocio</div>
    <div class="grid2" style="grid-template-columns:1fr 1fr;gap:11px">
      <div class="fr"><label class="f">Tipo</label><select class="inp" id="cTipo">
        ${['lease','finance','cash'].map(t=>`<option value="${t}" ${c&&c.tipo===t?'selected':''}>${tipoLbl(t)}</option>`).join('')}
      </select></div>
      <div class="fr"><label class="f">Mes de venta</label><input class="inp" id="cFecha" type="month" value="${g('fecha')}"></div>
      <div class="fr"><label class="f">Plazo <span class="h">meses</span></label>
        <input class="inp" id="cPlazo" inputmode="numeric" value="${c?esc(c.plazo||''):'36'}" placeholder="36"></div>
      <div class="fr"><label class="f">Cumpleaños</label><input class="inp" id="cCumple" type="date" value="${g('cumple')}"></div>
      <div class="fr" style="grid-column:1/-1"><label class="f">Notas</label>
        <input class="inp" id="cNotas" value="${g('notas')}" placeholder="Referido de…, prefiere que le llamen por la tarde…"></div>
    </div>
    <p style="font-size:13px;color:var(--tx3);line-height:1.55;margin-top:10px">

      las alertas de fin de lease, refi y aniversario.</p>
    ${c?`<button class="btn dan full" style="margin-top:16px" onclick="delCliente('${c.id}')">${ic('Trash2')}Eliminar cliente</button>`:''}`,
   `<button class="btn sec" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveCliente()">${ic('Save')}Guardar</button>`,
   {id:id||null});
}
function saveCliente(){
  const nom=$('cNom').value.trim(), tel=$('cTel').value.trim();
  if(!nom||!tel){alert('Nombre y teléfono son obligatorios.');return;}
  const vin=$('cVin').value.trim().toUpperCase();
  if(vin&&vin.length!==17){
    if(!confirm('El VIN tiene '+vin.length+' caracteres y deberían ser 17.\n\n¿Guardar así de todos modos?'))return;
  }
  const data={nom, apellido:$('cApe').value.trim(), tel, email:$('cEmail').value.trim().toLowerCase(),
    idioma:$('cIdioma')?$('cIdioma').value:'es',
    dir:$('cDir').value.trim(), marca:$('cMarca').value.trim(), mod:$('cMod').value.trim(),
    ano:$('cAno').value.trim(), stock:$('cStock').value.trim().toUpperCase(), vin:vin,
    agencia:$('cAgencia').value.trim(), tipo:$('cTipo').value, fecha:$('cFecha').value,
    plazo:num($('cPlazo').value), cumple:$('cCumple').value, notas:$('cNotas').value.trim()};

  const dup=buscarDuplicado(S.clientes,data,MODAL_CTX.id);
  if(dup){avisoDuplicado(dup,'libro');return;}

  if(MODAL_CTX.id){
    const i=S.clientes.findIndex(x=>x.id===MODAL_CTX.id);
    if(i>=0)S.clientes[i]=Object.assign({},S.clientes[i],data);
  }else{
    /* ¿ya está como lead? no bloqueamos, pero se avisa: es la misma persona */
    const enLeads=buscarDuplicado(S.leads,data,null);
    S.clientes.unshift(Object.assign({id:uid('c'),createdAt:nowISO()},data));
    if(enLeads)setTimeout(()=>toast('Ojo: esta persona también está en tus leads'),700);
  }
  save();closeModal();toast('Cliente guardado');render();
}
function delCliente(id){
  if(!confirm('¿Eliminar este cliente del libro?'))return;
  S.clientes=S.clientes.filter(x=>x.id!==id);
  save();closeModal();toast('Cliente eliminado');render();
}
function openFicha(id){
  const c=S.clientes.find(x=>x.id===id); if(!c)return;
  const vence=(c.tipo==='lease'&&c.fecha&&num(c.plazo))?addMonths(c.fecha,num(c.plazo)):null;
  const mine=calcAlertas().filter(a=>a.cid===c.id);
  const negs=negociosDe('cliente',c.id);
  openModal(c.nom,
   `<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">
      ${badge(tipoLbl(c.tipo),tipoCol(c.tipo))}${c.fecha?badge('Vendido '+fmtM(addMonths(c.fecha,0)),C.tx3):''}
      ${vence?badge('Vence '+fmtM(vence),C.warn):''}</div>
    <div class="card" style="background:var(--bg3)">
      ${[['Teléfono',esc(c.tel)],['Vehículo',esc(vehCli(c))],['Plazo',c.plazo?c.plazo+' meses':'—'],
         ['Notas',c.notas?esc(c.notas):'—']].map(r=>`<div class="sumrow"><span style="color:var(--tx3)">${r[0]}</span>
         <span style="color:var(--tx2);text-align:right;max-width:60%">${r[1]}</span></div>`).join('')}
    </div>
    <button class="btn full" style="margin-top:12px" onclick="armarNegocio('cliente','${c.id}')">
      🧮 Armar negocio</button>
    ${negs.length?`<div class="card" style="background:var(--bg3);margin-top:10px">
      <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:7px">
        Negocios armados (${negs.length})</div>
      ${negs.slice(0,3).map(q=>`<div class="sumrow" style="border-bottom:1px solid var(--bd);padding:6px 0">
        <span style="color:var(--tx2)">${esc(q.fecha||'—')} · ${esc(tipoDesk(q.w&&q.w.tipo))}</span>
        <span style="color:var(--tx3);text-align:right;max-width:55%">${esc([q.w&&q.w.marca,q.w&&q.w.modelo].filter(Boolean).join(' ')||'—')}</span>
      </div>`).join('')}
      ${negs.length>3?`<div style="font-size:11.5px;color:var(--tx3);margin-top:7px">+${negs.length-3} más — se ven en Desking</div>`:''}
    </div>`:''}
    ${mine.length?`<div class="mlab">Alertas activas</div>`+mine.map(a=>`<div class="card arow ${a.hot?'hot':''}" style="margin-top:8px">
        <div class="atag">${esc(a.tag)}</div>
        <button class="btn wa sm" style="margin-top:9px" onclick="openMsg(${jsq(c.nom)},${jsq(c.tel)},${jsq(enIngles(c)?(a.msgEN||a.msg):a.msg)},${jsq(enIngles(c)?a.msg:a.msgEN)},${jsq(c.idioma||'es')})">${ic('Wa')}Escribirle</button>
      </div>`).join(''):''}`,
   `<button class="btn sec" onclick="openCliente('${c.id}')">${ic('Edit2')}Editar</button>
    <button class="btn wa" onclick="msgReconectar('${c.id}')">${ic('Wa')}Reconectar</button>`);
}
function msgReconectar(id){
  const c=S.clientes.find(x=>x.id===id); if(!c)return;
  const esTxt=`Hola ${c.nom}${firma()} 👋 ¿Cómo te ha ido con el ${vehCli(c)}? Te escribo para saludarte y que sepas que aquí sigo para lo que necesites. Y si alguien cercano anda buscando carro, me lo pasas con confianza — lo trato igual que a ti.`;
  const enTxt=`Hi ${c.nom}${firmaEN()} 👋 How's the ${vehCli(c)} treating you? Just checking in so you know I'm still here for whatever you need. And if someone close to you is car shopping, send them my way — I'll take care of them like I did with you.`;
  openMsg(c.nom,c.tel,enIngles(c)?enTxt:esTxt,enIngles(c)?esTxt:enTxt,c.idioma||'es');
}

/* ═══════════════════════════════════════════
   VISTA · ALERTAS
═══════════════════════════════════════════ */
VIEWS.alertas=function(){
  const al=calcAlertas();
  let out=`<div class="stack">
    <div><h2 class="vh">Alertas</h2>
      <div class="vsub">Fin de lease, refinanciación, aniversarios y post-venta — calculados solos desde tus datos reales.</div></div>`;
  if(!al.length){
    out+=`<div class="card pad0">${empty('Bell','Sin alertas por ahora',
      'Cuando agregues clientes al libro con <b style="color:var(--tx2)">mes de venta</b> y <b style="color:var(--tx2)">plazo</b>, o cargues fechas de post-venta en el Deal Room, aparecen aquí solas.')}</div>`;
  }else{
    out+=al.map((a,i)=>`<div class="card arow ${a.hot?'hot':''}">
      <div class="atag">${esc(a.tag)}</div>
      <div class="lname" style="margin-top:5px">${esc(a.nom)}</div>
      <div class="lmeta">${esc(a.veh)}</div>
      <div class="aact">
        <button class="btn wa sm" onclick="msgAlerta(${i})">${ic('Wa')}WhatsApp</button>
        ${a.cid?`<button class="btn sec sm" onclick="openFicha('${a.cid}')">Ficha</button>`:''}
        ${a.lid?`<button class="btn sec sm" onclick="openDeal('${a.lid}',8)">Deal Room</button>`:''}
      </div></div>`).join('');
  }
  return out+'</div>';
};
</script>
<script>
/* ═══════════════════════════════════════════
   VISTA · LEADS
═══════════════════════════════════════════ */
VIEWS.leads=function(){
  return `<div class="stack">
    <div class="rowb"><div><h2 class="vh">Leads</h2>
      <div class="vsub">Ordenados por urgencia real: etapa, antigüedad y presupuesto.</div></div>
      <button class="btn sm" onclick="openQuick()">${ic('UserPlus')}Nuevo</button></div>
    <input class="inp" placeholder="Nombre, vehículo, teléfono…" value="${esc(Q)}"
      oninput="Q=this.value;document.getElementById('leadList').innerHTML=leadList()">
    <div style="display:flex;gap:8px">
      <select class="inp" onchange="FSRC=this.value;document.getElementById('leadList').innerHTML=leadList()">
        ${['Todos'].concat(ORIGENES).map(o=>`<option ${FSRC===o?'selected':''}>${o}</option>`).join('')}</select>
      <select class="inp" onchange="FEST=this.value;document.getElementById('leadList').innerHTML=leadList()">
        ${['Todos'].concat(ETAPAS).map(o=>`<option ${FEST===o?'selected':''}>${o}</option>`).join('')}</select>
    </div>
    <div id="leadList">${leadList()}</div></div>`;
};
function leadList(){
  const q=Q.toLowerCase();
  const vis=S.leads
    .filter(l=>FSRC==='Todos'||l.origen===FSRC)
    .filter(l=>FEST==='Todos'||ETAPAS[l.etapa]===FEST)
    .filter(l=>!q||[l.nom,l.tel,l.email,l.veh&&l.veh.marca,l.veh&&l.veh.mod].join(' ').toLowerCase().includes(q))
    .map(l=>({l,u:getUrgency(l)})).sort((a,b)=>b.u.score-a.u.score);
  if(!vis.length)return `<div class="card pad0">${S.leads.length
    ? empty('Search','Sin resultados','Cambia los filtros o el término de búsqueda.')
    : empty('Users','Sin leads todavía','Toca <b style="color:var(--p)">Nuevo</b> y captura tu primer prospecto. Del captador, de Instagram, de donde llegue.')}</div>`;
  return `<div class="card pad0">`+vis.map(x=>{
    const l=x.l,u=x.u,f=finanzas(l);
    const tar=S.tareas.filter(t=>t.leadId===l.id&&!t.hecha).length;
    return `<button class="lrow" onclick="openDeal('${l.id}')">
      <div class="heat" style="background:${u.color}"></div>
      <div class="body"><div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
          <span class="lname">${esc(l.nom)}</span>${badge(ETAPAS[l.etapa],ETAPA_C[ETAPAS[l.etapa]])}</div>
        <div class="lmeta">${esc(vehLead(l))}</div>
        <div class="tagrow">
          <span style="font-size:11.5px;color:var(--p);font-weight:700">${fm(f.precio||num(l.veh&&l.veh.pres))}</span>
          <span style="font-size:11.5px;color:var(--tx3)">${esc(l.origen)}</span>
          ${tar?badge(tar+' tarea'+(tar>1?'s':''),C.warn):''}
          ${l.trade&&l.trade.has?badge('Trade-In',C.info):''}
        </div></div>
      <div style="text-align:right;flex-shrink:0"><div style="font-size:11.5px;font-weight:800;color:${u.color}">${u.label}</div>
        <div class="mono" style="font-size:11.5px;color:var(--tx3);margin-top:2px">${u.score}</div></div>
      ${ic('ChevronRight',14,C.tx3)}</div></button>`;}).join('')+`</div>`;
}

/* ── Captura rápida ── */
function openQuick(){
  openModal('Captura rápida de lead',
   `<div class="grid2" style="grid-template-columns:1fr 1fr;gap:11px">
      <div class="fr" style="grid-column:1/-1"><label class="f">Nombre *</label><input class="inp" id="qNom" placeholder="Nombre del prospecto"></div>
      <div class="fr" style="grid-column:1/-1"><label class="f">Teléfono *</label><input class="inp" id="qTel" inputmode="tel" placeholder="3055551234"></div>
      <div class="fr"><label class="f">Marca</label><input class="inp" id="qMarca" placeholder="Toyota"></div>
      <div class="fr"><label class="f">Modelo</label><input class="inp" id="qMod" placeholder="RAV4"></div>
      <div class="fr"><label class="f">Presupuesto $</label><input class="inp" id="qPres" inputmode="numeric" placeholder="35000"></div>
      <div class="fr"><label class="f">Origen</label><select class="inp" id="qOrigen">
        ${ORIGENES.map(o=>`<option${o==='Walk-in'?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="fr" style="grid-column:1/-1"><label class="f">Interés / nota</label><input class="inp" id="qNota" placeholder="SUV, crédito bueno, este mes…"></div>
    </div>`,
   `<button class="btn sec" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveQuick()">${ic('UserPlus')}Crear y abrir</button>`);
}
function saveQuick(){
  const nom=$('qNom').value.trim(), tel=$('qTel').value.trim();
  if(!nom||!tel){alert('Nombre y teléfono son obligatorios.');return;}
  const l=nuevoLead({nom,tel,marca:$('qMarca').value.trim(),mod:$('qMod').value.trim(),
    pres:$('qPres').value,origen:$('qOrigen').value,notas:$('qNota').value.trim(),ano:new Date().getFullYear()});
  S.leads.unshift(l);save();closeModal();toast('Lead "'+nom+'" creado');openDeal(l.id,1);
}

/* ═══════════════════════════════════════════
   VISTA · PIPELINE (kanban)
═══════════════════════════════════════════ */
VIEWS.pipeline=function(){
  const total=S.leads.filter(l=>ETAPAS[l.etapa]!=='Perdido')
    .reduce((s,l)=>s+(finanzas(l).precio||num(l.veh&&l.veh.pres)),0);
  let out=`<div class="stack">
    <div class="rowb"><div><h2 class="vh">Sales Pipeline</h2>
      <div class="vsub">Valor total: <span style="color:var(--p);font-weight:700">${fm(total)}</span> · al llegar a <b style="color:var(--ok)">Vendido</b> pasa a tu libro.</div></div>
      <button class="btn sm" onclick="openQuick()">${ic('Plus')}Lead</button></div>`;
  if(!S.leads.length){out+=`<div class="card pad0">${empty('Briefcase','Pipeline vacío','Los leads nuevos aparecen en la columna <b style="color:var(--info)">Nuevo</b> y avanzan con las flechas.')}</div></div>`;return out;}
  out+=`<div class="kan sh">`+ETAPAS.map(e=>{
    const col=ETAPA_C[e], items=S.leads.filter(l=>ETAPAS[l.etapa]===e);
    const st=items.reduce((s,l)=>s+(finanzas(l).precio||num(l.veh&&l.veh.pres)),0);
    return `<div class="kcol">
      <div class="khead" style="border-top:3px solid ${col}">
        <div class="rowb"><span style="font-size:14.5px;font-weight:700">${e}</span>
          <span style="font-size:11.5px;font-weight:800;background:${col}22;color:${col};padding:2px 7px;border-radius:99px">${items.length}</span></div>
        <div class="mono" style="font-size:11.5px;color:var(--tx3);margin-top:2px">${fm(st)}</div></div>
      <div style="display:flex;flex-direction:column;gap:8px;min-height:120px">
        ${items.length?items.map(l=>{const u=getUrgency(l);return `<div class="kcard">
          <div class="hb" style="background:${u.color}"></div>
          <div style="padding:10px 12px" onclick="openDeal('${l.id}')">
            <div style="font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.nom)}</div>
            <div style="font-size:13px;color:var(--tx3);margin-top:2px">${esc(vehLead(l))}</div>
            <div class="mono" style="font-size:14.5px;font-weight:700;color:var(--p);margin-top:4px">${fm(finanzas(l).precio||num(l.veh&&l.veh.pres))}</div>
          </div>
          <div style="display:flex;gap:5px;padding:6px 10px;border-top:1px solid var(--bd);justify-content:flex-end">
            <button class="btn ghost xs" style="border:1px solid var(--bd);background:var(--bg3)" onclick="mover('${l.id}',-1)">◀</button>
            <button class="btn ghost xs" style="border:1px solid var(--bd);background:var(--bg3)" onclick="mover('${l.id}',1)">▶</button>
          </div></div>`;}).join('')
        :`<div style="text-align:center;color:var(--tx3);font-size:13px;padding:22px 0;border:1px dashed var(--bd);border-radius:10px">Sin tratos</div>`}
      </div></div>`;}).join('')+`</div></div>`;
  return out;
};
function mover(id,dir){
  const l=S.leads.find(x=>x.id===id); if(!l)return;
  const ni=Math.max(0,Math.min(ETAPAS.length-1,l.etapa+dir));
  if(ni===l.etapa)return;
  l.etapa=ni; l.updatedAt=nowISO();
  l.acts.unshift({id:uid('a'),tipo:'stage_change',autor:S.cfg.nombre||'Yo',
    txt:'Fase actualizada: "'+ETAPAS[ni]+'"',fecha:nowISO()});
  save();
  if(ETAPAS[ni]==='Vendido')pasarAlLibro(l.id);
  else render();
}
/* ── Pipeline → Libro (motor del libro) ── */
function pasarAlLibro(id){
  const l=S.leads.find(x=>x.id===id); if(!l)return;
  if(S.clientes.some(c=>c.leadId===l.id)){render();toast('Ya está en tu libro');return;}
  const tipoDeal=(l.deal&&l.deal.tipo)||'Financiado';
  const tipo=tipoDeal==='Lease'?'lease':tipoDeal==='Contado'?'cash':'finance';
  openModal('🎉 ¡Cerrado!',
   `<p style="font-size:14.5px;color:var(--tx2);line-height:1.6;margin-bottom:14px">
      Pasa a <b style="color:var(--tx)">${esc(l.nom)}</b> a tu libro de clientes. Con estos dos datos, las alertas de fin de lease, refi y aniversario se calculan solas.</p>
    <div class="grid2" style="grid-template-columns:1fr 1fr;gap:11px">
      <div class="fr"><label class="f">Tipo</label><select class="inp" id="pbTipo">
        ${['lease','finance','cash'].map(t=>`<option value="${t}"${t===tipo?' selected':''}>${tipoLbl(t)}</option>`).join('')}</select></div>
      <div class="fr"><label class="f">Plazo <span class="h">meses</span></label><input class="inp" id="pbPlazo" inputmode="numeric" value="${esc(num(l.deal&&l.deal.plazo)||36)}"></div>
      <div class="fr" style="grid-column:1/-1"><label class="f">Mes de venta</label><input class="inp" id="pbFecha" type="month" value="${thisMonth()}"></div>
    </div>`,
   `<button class="btn sec" onclick="closeModal();render()">Ahora no</button>
    <button class="btn ok" onclick="confirmarLibro('${l.id}')">${ic('BookOpen')}Pasar al libro</button>`);
}
function confirmarLibro(id){
  const l=S.leads.find(x=>x.id===id); if(!l)return;
  S.clientes.unshift({id:uid('c'),leadId:l.id,nom:l.nom,tel:l.tel,
    marca:(l.veh&&l.veh.marca)||'',mod:(l.veh&&l.veh.mod)||'',ano:(l.veh&&l.veh.ano)||'',
    tipo:$('pbTipo').value,fecha:$('pbFecha').value,plazo:num($('pbPlazo').value),
    notas:l.notas||'',createdAt:nowISO()});
  save();closeModal();toast('Pasó a tu libro');go('libro');
}
</script>
<script>
/* ═══════════════════════════════════════════
   VISTA · TAREAS
═══════════════════════════════════════════ */
VIEWS.tasks=function(){
  const vis=S.tareas.slice().sort((a,b)=>
    (!a.hecha&&b.hecha)?-1:(a.hecha&&!b.hecha)?1:String(a.vence||'').localeCompare(String(b.vence||'')));
  const pend=vis.filter(t=>!t.hecha), venc=pend.filter(t=>t.vence&&t.vence<today());
  return `<div class="stack">
    <div class="rowb"><div><h2 class="vh">Tareas y compromisos</h2>
      <div class="vsub">${pend.length} pendiente${pend.length===1?'':'s'} · ${venc.length} vencida${venc.length===1?'':'s'}</div></div>
      <button class="btn sm" onclick="openTarea()">${ic('Plus')}Nueva</button></div>
    ${vis.length?`<div style="display:flex;flex-direction:column;gap:8px">`+vis.map(t=>{
      const ov=!t.hecha&&t.vence&&t.vence<today();
      return `<div class="card" style="display:flex;align-items:center;gap:11px;padding:12px 14px;border-color:${ov?'rgba(239,68,68,.3)':'var(--bd)'}">
        <input type="checkbox" ${t.hecha?'checked':''} onchange="toggleTarea('${t.id}')" style="accent-color:${C.ok};width:17px;height:17px;flex-shrink:0">
        <div style="flex:1;min-width:0">

/* ═══ VISTA · RENDIMIENTO ═══
   Tu mes contra tu meta, y tu historial real. Todo sale de lo que
   ya está en el libro: clientes con fecha de venta y leads cerrados.
   Nada estimado, nada inventado. */
function guardarMetaMes(){
  S.cfg.metaMes={u:Math.max(0,num($('metaU').value)),g:Math.max(0,num($('metaG').value))};
  save();toast('Meta guardada');render();
}
function mesesAtras(n){
  const d=new Date(), out=[];
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);
    out.push({ym:mesLocal(x),d:x});}
  return out;
}
VIEWS.performance=function(){
  const meta=S.cfg.metaMes||{u:0,g:0};
  const ym=thisMonth();

  /* unidades por mes: de los clientes del libro (c.fecha es AAAA-MM) */
  const uMes={};
  S.clientes.forEach(c=>{const m=String(c.fecha||'').slice(0,7);
    if(/^\d{4}-\d{2}$/.test(m))uMes[m]=(uMes[m]||0)+1;});

  /* gross por mes: de los leads que llegaron a Vendido */
  const gMes={}, cerrados=[];
  S.leads.filter(l=>ETAPAS[l.etapa]==='Vendido').forEach(l=>{
    const m=String(l.updatedAt||l.createdAt||'').slice(0,7);
    if(/^\d{4}-\d{2}$/.test(m))gMes[m]=(gMes[m]||0)+finanzas(l).totalGross;
    if(l.createdAt&&l.updatedAt){
      const d=dias(new Date(l.updatedAt),new Date(l.createdAt));
      if(d>=0&&d<400)cerrados.push(d);
    }
  });

  const uHoy=uMes[ym]||0, gHoy=gMes[ym]||0;
  const h=new Date();
  const diasMes=new Date(h.getFullYear(),h.getMonth()+1,0).getDate();
  const diaActual=h.getDate();
  const restan=diasMes-diaActual;
  const proy=diaActual?Math.round(uHoy/diaActual*diasMes*10)/10:0;
  const faltanU=Math.max(0,meta.u-uHoy), faltanG=Math.max(0,meta.g-gHoy);
  const pctU=meta.u?Math.min(100,Math.round(uHoy/meta.u*100)):0;
  const pctG=meta.g?Math.min(100,Math.round(gHoy/meta.g*100)):0;
  /* ¿va en ritmo? el listón del día de hoy */
  const esperado=meta.u?meta.u*(diaActual/diasMes):0;
  const enRitmo=!meta.u||uHoy>=esperado;

  const hist=mesesAtras(12).map(m=>({...m,u:uMes[m.ym]||0,g:gMes[m.ym]||0}));
  const maxU=Math.max(1,...hist.map(x=>x.u));
  const conVentas=hist.filter(x=>x.u>0);
  const mejor=hist.reduce((a,b)=>b.u>((a&&a.u)||0)?b:a,null);
  const prom=conVentas.length?Math.round(conVentas.reduce((s,x)=>s+x.u,0)/conVentas.length*10)/10:0;
  const totalAno=hist.reduce((s,x)=>s+x.u,0);
  const grossAno=hist.reduce((s,x)=>s+x.g,0);
  const cicloProm=cerrados.length?Math.round(cerrados.reduce((a,b)=>a+b,0)/cerrados.length):null;
  const abiertos=S.leads.filter(l=>!['Vendido','Perdido'].includes(ETAPAS[l.etapa])).length;

        <div style="width:38px;height:38px;border-radius:10px;background:${enRitmo?C.ok:C.warn}18;
          display:flex;align-items:center;justify-content:center;flex-shrink:0">
          ${ic(enRitmo?'TrendingUp':'AlertCircle',19,enRitmo?C.ok:C.warn)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:16.5px;color:${enRitmo?C.ok:C.warn}">
            ${enRitmo?'Vas en ritmo':'Vas por debajo del ritmo'}</div>
          <div style="font-size:13px;color:var(--tx3);margin-top:2px">
            Día ${diaActual} de ${diasMes} · ${restan} día${restan===1?'':'s'} para cerrar el mes</div>
        </div>
      </div>
      ${meta.u?`<div style="margin-bottom:13px">
        <div style="display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:5px">
          <span style="color:var(--tx2)">Unidades</span>
          <span><span style="color:var(--tx)">${uHoy}</span><span style="color:var(--tx3)"> / ${meta.u}</span>
          · <span style="color:${enRitmo?C.ok:C.warn};font-weight:700">${pctU}%</span></span></div>
        ${barra(pctU,enRitmo?C.ok:C.warn)}
        <div style="font-size:13px;color:var(--tx3);margin-top:5px">
          ${faltanU?`Faltan <b style="color:var(--tx2)">${faltanU}</b> · proyección al cierre: <b style="color:var(--tx2)">${proy}</b>`
                   :'<b style="color:'+C.ok+'">Meta cumplida.</b> Lo que entre ahora es de más.'}</div>
      </div>`:''}
      ${meta.g?`<div>
        <div style="display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:5px">
          <span style="color:var(--tx2)">Gross</span>
          <span><span style="color:var(--tx)">${fm(gHoy)}</span><span style="color:var(--tx3)"> / ${fm(meta.g)}</span>
          · <span style="color:${C.p};font-weight:700">${pctG}%</span></span></div>
        ${barra(pctG,C.p)}
        ${faltanG?`<div style="font-size:13px;color:var(--tx3);margin-top:5px">
          Faltan <b style="color:var(--tx2)">${fm(faltanG)}</b></div>`:''}
      </div>`:''}
    </div>`}

    <div class="grid2">
      ${kpi('Trophy','Este mes',uHoy,fm(gHoy)+' de gross',C.p)}
      ${kpi('BarChart2','Últimos 12 meses',totalAno,fm(grossAno)+' acumulado',C.info)}
      ${kpi('TrendingUp','Promedio mensual',prom||'—',conVentas.length?'sobre '+conVentas.length+' mes'+(conVentas.length>1?'es':'')+' con ventas':'sin historial',C.vio)}
      ${kpi('Clock','Ciclo de cierre',cicloProm!==null?cicloProm+'d':'—',cicloProm!==null?'de lead a vendido':'sin cierres medidos',C.ora)}
    </div>

    <div class="card pad0">
      <div class="chead"><div style="display:flex;align-items:center;gap:8px">${ic('BarChart2',15,C.tx)}Últimos 12 meses</div>
        <div class="s">Unidades entregadas por mes, contadas desde la fecha de venta de cada cliente del libro.</div></div>
      <div style="padding:15px 16px">
        ${totalAno?hist.map(x=>{
          const act=x.ym===ym;
          return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
            <span style="font-size:13px;color:${act?C.p:'var(--tx3)'};min-width:62px;${act?'font-weight:700':''}">${fmtM(x.d)}</span>
            <div style="flex:1;height:8px;background:var(--bg3);border-radius:99px;overflow:hidden">
              <div style="height:100%;background:${act?C.p:C.info};border-radius:99px;width:${x.u/maxU*100}%"></div></div>
            <span class="mono" style="font-size:13px;font-weight:700;color:${act?C.p:'var(--tx2)'};min-width:20px;text-align:right">${x.u}</span>
            <span class="mono" style="font-size:11.5px;color:var(--tx3);min-width:56px;text-align:right">${x.g?fm(x.g):''}</span>
          </div>`;}).join('')
        :empty('BarChart2','Sin historial todavía',
          'Aparece solo, en cuanto tus clientes del libro tengan fecha de venta.')}
      </div>
    </div>

    ${mejor&&mejor.u>0?`<div class="card">
      <div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:10px">
        ${ic('Trophy',14,C.warn)}Tu mejor mes</div>
      <div class="sumrow"><span style="color:var(--tx3)">Mes</span>
        <span style="color:var(--tx2)">${fmtM(mejor.d)}</span></div>
      <div class="sumrow"><span style="color:var(--tx3)">Unidades</span>
        <span style="color:var(--tx);font-weight:700">${mejor.u}</span></div>
      ${mejor.g?`<div class="sumrow"><span style="color:var(--tx3)">Gross</span>
        <span style="color:var(--tx2)">${fm(mejor.g)}</span></div>`:''}
      <div class="sumrow b"><span style="color:var(--tx3)">Este mes va</span>
        <span style="color:${uHoy>=mejor.u?C.ok:'var(--tx2)'}">${uHoy>=mejor.u?'por encima de tu récord':(mejor.u-uHoy)+' por debajo'}</span></div>
    </div>`:''}

    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:10px">
        ${ic('Activity',14,C.info)}Cómo estás trabajando</div>
      <div class="sumrow"><span style="color:var(--tx3)">Leads en juego</span>
        <span style="color:var(--tx2)">${abiertos} de ${totalLeads}</span></div>
      <div class="sumrow"><span style="color:var(--tx3)">Conversión histórica</span>
        <span style="color:var(--tx2)">${totalLeads?conv+'%':'—'}</span></div>
      <div class="sumrow"><span style="color:var(--tx3)">Ciclo promedio de cierre</span>
        <span style="color:var(--tx2)">${cicloProm!==null?cicloProm+' días':'—'}</span></div>
      ${meta.u&&faltanU&&restan>0?`<div class="sumrow b">
        <span style="color:var(--tx3)">Para llegar a la meta</span>
        <span style="color:${C.p};font-weight:700">${faltanU} en ${restan} día${restan===1?'':'s'}</span></div>`:''}
    </div>

    <div class="card pad0">
      <div class="chead"><div style="display:flex;align-items:center;gap:8px">${ic('Tag',15,C.tx)}Tu meta del mes</div>
        <div class="s">Ponla tú. Se guarda con tu libro y viaja a todos tus dispositivos.</div></div>
      <div style="padding:15px 16px">
        <div class="grid2" style="grid-template-columns:1fr 1fr;gap:10px">
          <div class="fr"><label class="f">Unidades al mes</label>
            <input class="inp" id="metaU" inputmode="numeric" placeholder="12" value="${meta.u||''}"></div>
          <div class="fr"><label class="f">Gross al mes</label>
            <input class="inp" id="metaG" inputmode="numeric" placeholder="30000" value="${meta.g||''}"></div>
        </div>
        <button class="btn full" style="margin-top:12px" onclick="guardarMetaMes()">${ic('Save')}Guardar meta</button>
        <p style="font-size:13px;color:var(--tx3);line-height:1.6;margin-top:10px">
          Deja un campo en cero si no quieres medir esa parte.</p>
      </div>
    </div>
  </div>`;
};

/* ═══ VISTA · ADMIN (solo rol=admin) — vista admin_resumen ═══ */
VIEWS.admin=function(){
  if(!esAdmin())return soonView('admin');
  if(ADM.estado==='')setTimeout(()=>cargarAdmin(),0);

  const F=ADM.filas||[];
  const dHoy=hoy();
  const dGratis=f=>f.gratis_hasta?dias(new Date(String(f.gratis_hasta).slice(0,10)+'T00:00:00'),dHoy):null;
  const planUI=f=>{
    if(f.plan==='activo')return{c:C.ok,t:'Activo'};
    if(f.plan==='pausado')return{c:C.dan,t:'Pausado'};
    const d=dGratis(f);
    if(d===null)return{c:C.tx3,t:'Gratis'};
    if(d<0)return{c:C.dan,t:'Prueba vencida'};
    return{c:d<=7?C.warn:C.info,t:'Prueba · '+d+'d'};
  };
  const vend=F.filter(f=>f.rol!=='admin');
  const nAct=F.filter(f=>f.plan==='activo').length;
  const nPrueba=F.filter(f=>f.plan==='gratis'&&dGratis(f)!==null&&dGratis(f)>=0).length;
  const nVenc=F.filter(f=>f.plan==='gratis'&&dGratis(f)!==null&&dGratis(f)<0).length;
  const totCli=F.reduce((s,f)=>s+num(f.clientes),0);

  let cuerpo;
  if(ADM.estado==='cargando'||ADM.estado===''){
    cuerpo=`<div class="card" style="text-align:center;padding:28px;color:var(--tx3);font-size:14.5px">
      Cargando cuentas…<span class="spin"></span></div>`;
  }else if(ADM.estado==='error'){
    cuerpo=`<div class="card" style="border-color:${C.dan}38;background:${C.dan}0d">
      <div style="display:flex;gap:9px;align-items:flex-start">${ic('AlertCircle',15,C.dan)}
        <div><div style="font-weight:800;font-size:14.5px;color:${C.dan}">No se pudo leer el resumen</div>
        <div style="font-size:13px;color:var(--tx2);line-height:1.6;margin-top:3px">${esc(ADM.err)}</div></div></div>
      <button class="btn sec sm full" style="margin-top:12px" onclick="cargarAdmin(true)">${ic('RefreshCw')}Reintentar</button></div>`;
  }else if(!F.length){
    cuerpo=`<div class="card">${empty('Users','Todavía no hay cuentas','Cuando un vendedor se registre aparece aquí.')}</div>`;
  }else{
    cuerpo=`<div class="card pad0">
      <div class="chead"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <span>Vendedores (${vend.length})</span>
        <button class="btn ghost xs" onclick="cargarAdmin(true)">${ic('RefreshCw')}Actualizar</button></div>
        <div class="s">Ordenados por última actividad. La columna "libro" es lo que ese vendedor tiene cargado ahora mismo.</div></div>
      <div>${F.map(f=>{
        const u=planUI(f);
        const act=f.ultima_actividad?fDateTime(f.ultima_actividad):'nunca';
        const fresco=f.ultima_actividad?dias(dHoy,new Date(String(f.ultima_actividad).slice(0,10)+'T00:00:00')):999;
        return `<div class="admrow">
          <div class="admav" style="background:${u.c}18;color:${u.c}">${esc(ini(f.nombre)||'?')}</div>
          <div style="min-width:0;flex:1">
            <div class="admnom">${esc(f.nombre||'(sin nombre)')}
              ${f.rol==='admin'?`<span class="bdg2" style="color:${C.p};background:${C.ps};border-color:${C.p}40">ADMIN</span>`:''}</div>
            <div class="admsub mono">${esc(f.whatsapp||'sin whatsapp')}${f.dealer?' · '+esc(f.dealer):''}</div>
            <div class="admsub" style="margin-top:4px">
              <b style="color:var(--tx2)">${fmN(f.clientes)}</b> clientes ·
              <b style="color:var(--tx2)">${fmN(f.leads)}</b> leads ·
              <b style="color:var(--tx2)">${fmN(f.negocios_armados)}</b> negocios</div>
            <div class="admsub" style="margin-top:2px;color:${fresco>14?C.tx3:C.tx2}">
              Última actividad: ${esc(act)}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <button class="btn sec xs" style="margin-bottom:6px"
              onclick="gestionarVendedor('${esc(f.user_id)}')">${ic('Settings')}Gestionar</button><br>
            ${badge(u.t,u.c)}
            <div class="admsub" style="margin-top:5px">${f.gratis_hasta?'gratis hasta '+fDate(String(f.gratis_hasta).slice(0,10)):'—'}</div>
            <div class="admsub">alta ${f.registrado?fDate(String(f.registrado).slice(0,10)):'—'}</div>
          </div>
        </div>`;}).join('')}</div></div>`;
  }

  return `<div class="stack">
    <div><h2 class="vh">Consola de administrador</h2>
      <div class="vsub">Todas las cuentas del sistema, en vivo desde el servidor.</div></div>
    <div class="grid2">
      ${kpi('Users','Cuentas',fmN(F.length),vend.length+' vendedores',C.info)}
      ${kpi('CheckCircle2','Activos',fmN(nAct),'plan pagando',C.ok)}
      ${kpi('Clock','En prueba',fmN(nPrueba),nVenc?fmN(nVenc)+' vencida'+(nVenc>1?'s':''):'ninguna vencida',nVenc?C.warn:C.vio)}
      ${kpi('BookOpen','Clientes',fmN(totCli),'en todos los libros',C.p)}
    </div>
    ${cuerpo}
    <div class="card pad0">
      <div class="chead"><div style="display:flex;align-items:center;gap:8px">${ic('UserPlus',15,C.tx)}Invitar a un vendedor</div>
        <div class="s">Le llega el link por tu WhatsApp y crea su cuenta solo, con sus 30 días gratis.</div></div>
      <div style="padding:15px 16px">
        <div class="grid2" style="grid-template-columns:1fr 1fr;gap:10px">
          <div class="fr"><label class="f">Nombre</label><input class="inp" id="invNom" placeholder="Carlos"></div>
          <div class="fr"><label class="f">Su WhatsApp</label><input class="inp" id="invWa" inputmode="tel" placeholder="3055551234"></div>
        </div>
        <button class="btn full" style="margin-top:12px" onclick="invitarVendedor()">${ic('Wa')}Mandarle el link por WhatsApp</button>
      </div></div>

    <div class="card" style="background:rgba(59,130,246,.05);border-color:rgba(59,130,246,.18)">
      <div style="display:flex;gap:9px;align-items:flex-start">${ic('AlertCircle',15,C.info)}
        <p style="font-size:14.5px;color:var(--tx2);line-height:1.6">
          Desde <b>Gestionar</b> cambias plan, período de prueba y rol de cada vendedor, y ves si su
          sincronización está al día. Es lo primero que hay que mirar cuando alguien dice que "no le carga".</p></div></div>
  </div>`;
};

async function conectarGitHub(){
  const g={owner:$('ghOwner').value.trim(),repo:$('ghRepo').value.trim(),
    branch:$('ghBranch').value.trim()||'main',path:$('ghPath').value.trim()||'datos/autosolution-crm.json',
    token:$('ghToken').value.trim(),sha:''};
  if(!g.owner||!g.repo||!g.token){alert('Usuario, repositorio y token son obligatorios.');return;}
  g.path=g.path.replace(/^\/+/,'');
  const prev=JSON.parse(JSON.stringify(SYNC.gh));
  SYNC.gh=g;
  setEstado('sync');
  try{
    const r=await ghFetch(`/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}`);
    if(!r.ok)throw new Error(await ghError(r));
    const info=await r.json();
    if(!info.permissions||!info.permissions.push)
      throw new Error('El token no tiene permiso de escritura en este repo (necesita Contents: Read and write).');
    if(!info.private&&!confirm('⚠️ El repo "'+g.owner+'/'+g.repo+'" es PÚBLICO.\n\nLos datos de tus clientes (nombres, teléfonos, direcciones) quedarían visibles para cualquiera.\n\n¿Continuar de todos modos?')){
      SYNC.gh=prev;setEstado('local');return;
    }
    SYNC.modo='github'; SYNC.baseRev=0; saveSync();
    await sincronizar(true);
    render();
  }catch(e){
    SYNC.gh=prev; SYNC.modo='local'; saveSync();
    setEstado('local');
    alert('No se pudo conectar.\n\n'+(e&&e.message?e.message:e));
    render();
  }
}

function importar(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||(!Array.isArray(d.clientes)&&!Array.isArray(d.leads))){alert('Archivo no válido.');return;}
      const n=(d.clientes||[]).length, m=(d.leads||[]).length, q=nDesk(d.desk);
      if(!confirm(`Importar ${n} cliente(s), ${m} lead(s)${q?` y ${q} negocio(s) de Desking`:''}? Reemplaza todo lo que hay ahora.`))return;
      const revPrev=S.meta.rev||0;
      if(d.desk)escribirDesk(d.desk);
      const limpio=Object.assign({},d); delete limpio.desk;
      S=Object.assign(BLANK(),limpio);
      S.cfg=Object.assign(BLANK().cfg,d.cfg||{});
      S.cfg.onboarded=true;
      ['clientes','leads','promos','tareas'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];});
      /* el import gana sobre lo que haya en la nube */
      S.meta={rev:Math.max(revPrev,(d.meta&&d.meta.rev)||0)+1,updatedAt:nowISO(),device:SYNC.device};
      save({silent:true});if(SYNC.modo!=='local')programarPush();
      if($('onb'))$('onb').style.display='none';
      toast('Respaldo importado');render();
    }catch(e){alert('No se pudo leer el archivo.');}

}

function completarLead(l){
  if(!l)return l;
  ['oferta','trade','perfil','deal','recap','post','veh'].forEach(k=>{
    if(!l[k]||typeof l[k]!=='object')l[k]={};
  });
  if(!Array.isArray(l.acts))l.acts=[];
  if(!Array.isArray(l.recap.fni))l.recap.fni=[];
  return l;
}
function stepDone(l,s){
  completarLead(l);
  const f=finanzas(l);

  if(s===3)return f.precio>0;
  if(s===4)return !l.trade.has||f.acv>0;
  if(s===5)return !!l.perfil.empleador;
  if(s===6)return !!l.deal.banco;
  if(s===7)return !!l.recap.finalizado;
  if(s===8)return !!(l.post.resena||l.post.equityDate||l.post.refiDate||l.post.renewDate);
  return false;
}

     :`<div style="font-size:13px;color:var(--tx3)">Sin referidos.</div>`}
  </div>
  ${[['equityDate','TrendingUp',C.ok,'Alerta de Equity','Fecha para revisar el equity del cliente'],
     ['refiDate','TrendingUp',C.vio,'Alerta de Refinanciamiento','Fecha para ofrecer mejor tasa'],
     ['renewDate','RefreshCw',C.p,'Alerta de Renovación','Fecha para hablar de renovar']]
    .map(r=>{const d=dl(l.post[r[0]]);
    return `<div class="card">
      <div style="font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px;margin-bottom:5px">${ic(r[1],13,r[2])}${r[3]}</div>
      <div style="font-size:11.5px;color:var(--tx3);margin-bottom:8px">${r[4]}</div>
      <input class="inp" type="date" value="${esc(l.post[r[0]]||'')}" onchange="updN('post','${r[0]}',this.value);render()">
      ${d!==null?`<div style="font-size:11.5px;color:${r[2]};font-weight:700;margin-top:7px">
        ${d<0?'Pasó hace '+Math.abs(d)+' días':d===0?'Es hoy':'Faltan '+d+' días'}${d<=45?' · ya está en Alertas':''}</div>`:''}
    </div>`;}).join('')}
  </div>`;
};
function addRef(){
  const l=L();if(!l)return;
  const t=$('refTxt').value.trim(); if(!t)return;
  l.post.referidos=l.post.referidos||[];l.post.referidos.push(t);
  l.updatedAt=nowISO();save();render();
}
function rmRef(i){const l=L();if(!l)return;l.post.referidos.splice(i,1);save();render();}
</script>
<script>

/* ═══════════════════════════════════════════
   ARRANQUE
═══════════════════════════════════════════ */
render();
pintarPill();
arrancar();

/* Guarda la app en el telefono: abre sin senal y se puede instalar como programa.
   Los datos no pasan por aqui, solo la app en si. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW no registrado',e));
  });
}

/* Nadie ve el CRM sin cuenta. Con sesión guardada la app abre YA con la
   caché local y sincroniza detrás: sin internet se sigue trabajando. */
async function arrancar(){
  let tipo=false;
  try{tipo=await revisarEnlace();}catch(e){AUERR=e&&e.message?e.message:String(e);}
  if(tipo){
    try{
      await completarUsuario();
      await entrarConSesion();
      if(tipo==='recovery')setTimeout(modalClave,450);
      else toast('Correo confirmado — bienvenido');
      return;
    }catch(e){AUERR=e&&e.message?e.message:String(e);}
  }
  /* Enlace vencido pero la sesion sigue viva: el aviso va de toast, no de muro. */
  if(AUERR&&SES&&SES.refresh_token){toast(AUERR);AUERR='';}
  if(!SES||!SES.refresh_token){mostrarAuth();return;}

  SYNC.modo='supabase'; if(!SYNC.uid)SYNC.uid=miId(); saveSync();
  aplicarPerfil(); render(); setEstado('pendiente');
  try{await sbToken();}
  catch(e){
    if(!SES)return;                 /* el servidor rechazó la sesión: ya se pidió entrar */
    setEstado('error','Sin conexión — trabajando con la copia de este dispositivo');
    return;
  }
  await entrarConSesion();
}
